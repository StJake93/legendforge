  // ---------- Dice & Rolls ----------
  { term: "d4", cat: "Dice & Rolls", def: "The four-sided die, most often used for the damage of small weapons and many minor spell effects." },
  { term: "d6", cat: "Dice & Rolls", def: "The six-sided die, a standard for many weapon damage rolls, Sneak Attack dice, and low-level Bardic Inspiration." },
  { term: "d8", cat: "Dice & Rolls", def: "The eight-sided die, common for versatile and martial weapon damage and many spell damage rolls." },
  { term: "d10", cat: "Dice & Rolls", def: "The ten-sided die, used for some weapon damage rolls and as one half of a percentile roll." },
  { term: "d12", cat: "Dice & Rolls", def: "The twelve-sided die, the largest standard weapon damage die, used by weapons like the greataxe." },
  { term: "d20", cat: "Dice & Rolls", def: "The twenty-sided die at the heart of the game's resolution system, rolled for attacks, ability checks, and saving throws." },
  { term: "d100", cat: "Dice & Rolls", def: "A percentile roll made with two ten-sided dice, one read as the tens digit and one as the ones digit, giving a result from 1 to 100." },
  { term: "Advantage", cat: "Dice & Rolls", def: "A roll made by rolling two d20s and keeping the higher result, granted by favorable circumstances, features, or spells." },
  { term: "Disadvantage", cat: "Dice & Rolls", def: "A roll made by rolling two d20s and keeping the lower result, imposed by unfavorable circumstances, features, or spells." },
  { term: "Modifier", cat: "Dice & Rolls", def: "A number added to or subtracted from a die roll, usually derived from an ability score, proficiency bonus, or magic item." },
  { term: "Ability Modifier", cat: "Dice & Rolls", def: "The bonus or penalty tied to an ability score, calculated as the score minus 10, divided by 2, and rounded down." },
  { term: "Proficiency Bonus", cat: "Dice & Rolls", def: "A bonus based on character level added to rolls a character is proficient in, such as certain attacks, saves, and skill checks." },
  { term: "Natural 20", cat: "Dice & Rolls", def: "A d20 roll that shows a 20 on the die itself, which always succeeds on an attack roll and scores a critical hit." },
  { term: "Natural 1", cat: "Dice & Rolls", def: "A d20 roll that shows a 1 on the die itself, which always fails on an attack roll regardless of modifiers." },
  { term: "Critical Hit", cat: "Dice & Rolls", def: "The result of rolling a natural 20 on an attack roll, causing the attack to hit automatically and roll extra damage dice." },
  { term: "Dice Notation", cat: "Dice & Rolls", def: "Shorthand such as \"2d6+3\" describing how many dice to roll, what size they are, and what flat modifier to add." },

  { term: "Tie (Initiative)", cat: "Dice & Rolls", def: "When two combatants roll the same initiative total, the tie is broken by comparing Dexterity scores, then Dexterity modifiers, then GM discretion." },
  { term: "Roll", cat: "Dice & Rolls", def: "The act of rolling one or more dice to resolve an uncertain outcome, such as an attack, check, or save." },
  { term: "Percentile Dice", cat: "Dice & Rolls", def: "A pair of ten-sided dice used together to generate a random number between 1 and 100, commonly used for tables of random results." },

  { term: "D20 Test", cat: "Dice & Rolls", def: "The umbrella term for the three main d20-based rolls in the game: ability checks, attack rolls, and saving throws." },

  // ---------- Checks & Saves ----------
  { term: "Ability Check", cat: "Checks & Saves", def: "A d20 roll plus an ability modifier, and often a proficiency bonus, made to determine whether an attempted task succeeds." },

  // ---------- Combat ----------

  { term: "Cold", cat: "Damage & Defense", def: "A damage type from freezing temperatures, such as the Ray of Frost cantrip or a white dragon's breath." },
  { term: "Fire", cat: "Damage & Defense", def: "A damage type from flame and heat, such as the Fireball spell or a red dragon's breath." },
  { term: "Force", cat: "Damage & Defense", def: "A damage type from pure magical energy, such as Magic Missile, that bypasses most resistances tied to physical or elemental sources." },
  { term: "Lightning", cat: "Damage & Defense", def: "A damage type from electrical energy, such as the Lightning Bolt spell or a blue dragon's breath." },
  { term: "Necrotic", cat: "Damage & Defense", def: "A damage type from life-draining negative energy, often associated with undead creatures and the Chill Touch cantrip." },
  { term: "Piercing", cat: "Damage & Defense", def: "A damage type from puncturing and impaling, dealt by weapons like daggers, spears, and arrows." },
  { term: "Poison (Damage)", cat: "Damage & Defense", def: "A damage type from toxins and venom, such as a giant spider's bite." },
  { term: "Psychic", cat: "Damage & Defense", def: "A damage type from mental assault, such as the Vicious Mockery cantrip or a mind flayer's psionic attack." },
  { term: "Radiant", cat: "Damage & Defense", def: "A damage type from holy or positive energy, such as the Guiding Bolt spell or a celestial's radiance." },
  { term: "Slashing", cat: "Damage & Defense", def: "A damage type from cutting and shearing, dealt by weapons like swords and axes." },
  { term: "Thunder", cat: "Damage & Defense", def: "A damage type from concussive sound, such as the Thunderwave spell." },

  // ---------- Spellcasting ----------
  { term: "Spell", cat: "Spellcasting", def: "A discrete magical effect with defined rules for its casting time, range, components, duration, and effect." },
  { term: "Cantrip", cat: "Spellcasting", def: "A spell that can be cast at will without expending a spell slot, and that grows more powerful as the caster reaches higher levels." },
  { term: "Spell Slot", cat: "Spellcasting", def: "An expendable resource spent to cast a leveled spell, with higher-level slots making the same spell more powerful." },
  { term: "Spell Level", cat: "Spellcasting", def: "A number from 1 to 9 (or 0 for cantrips) indicating a spell's power and the minimum slot level needed to cast it." },
  { term: "Upcasting", cat: "Spellcasting", def: "Casting a spell using a spell slot higher than its base level, often increasing its effect, such as extra damage or additional targets." },
  { term: "Concentration", cat: "Spellcasting", def: "A state maintained while sustaining certain spells, broken by casting another concentration spell, being incapacitated, or failing a Constitution save after taking damage." },
  { term: "Ritual", cat: "Spellcasting", def: "A tag on some spells letting them be cast without a spell slot by spending 10 extra minutes, if the caster has the Ritual Casting feature." },
  { term: "Ritual Casting", cat: "Spellcasting", def: "A class feature that lets a character cast spells tagged \"ritual\" from their available spell list without expending a spell slot." },
  { term: "Verbal Component (V)", cat: "Spellcasting", def: "A spell component requiring the caster to speak specific words, which can't be done while silenced or gagged." },
  { term: "Somatic Component (S)", cat: "Spellcasting", def: "A spell component requiring precise hand gestures, which generally requires at least one hand free." },
  { term: "Material Component (M)", cat: "Spellcasting", def: "A spell component requiring specific physical items, which may be consumed or can be substituted with a spellcasting focus unless it has a listed cost." },
  { term: "Spellcasting Focus", cat: "Spellcasting", def: "An item, such as a holy symbol or arcane wand, that a caster can use in place of a spell's non-costly material components." },
  { term: "Spell Attack", cat: "Spellcasting", def: "An attack roll made when casting a spell that calls for one, adding the caster's spellcasting ability modifier and proficiency bonus." },
  { term: "Spell Save DC", cat: "Spellcasting", def: "The difficulty class a target must meet with a saving throw to resist a spell's effect, equal to 8 plus proficiency bonus plus spellcasting ability modifier." },
  { term: "Spellcasting Ability", cat: "Spellcasting", def: "The ability score (Intelligence, Wisdom, or Charisma, depending on class) used to power a caster's spells." },
  { term: "Prepared Spells", cat: "Spellcasting", def: "A list of spells a caster has readied from their class list, chosen after finishing a Long Rest, that they can cast that day." },
  { term: "Spells Known", cat: "Spellcasting", def: "The fixed list of spells some classes, like Sorcerer and Bard, can cast, learned permanently as they gain levels rather than prepared daily." },
  { term: "Always Prepared", cat: "Spellcasting", def: "Spells, such as domain or circle spells, that don't count against a caster's normal number of prepared spells and are automatically available." },
  { term: "Casting Time", cat: "Spellcasting", def: "The action, bonus action, reaction, or longer duration a spell requires to cast." },
  { term: "Range (Spell)", cat: "Spellcasting", def: "The distance at which a spell can affect a target, or a listed keyword such as Self or Touch." },
  { term: "Duration", cat: "Spellcasting", def: "How long a spell's effects last, ranging from Instantaneous to a set time, sometimes requiring concentration to maintain." },
  { term: "Area of Effect", cat: "Spellcasting", def: "The shape and size a spell affects, such as a cone, cube, cylinder, line, or sphere." },
  { term: "Cone (Area of Effect)", cat: "Spellcasting", def: "A spell area that expands from a point in a straight line, affecting a triangular wedge of space." },
  { term: "Cube (Area of Effect)", cat: "Spellcasting", def: "A spell area that fills a cubic space of a given size, originating from a point on one of its faces or within it." },
  { term: "Cylinder (Area of Effect)", cat: "Spellcasting", def: "A spell area defined by a radius and a height, extending upward or downward from a point of origin." },
  { term: "Line (Area of Effect)", cat: "Spellcasting", def: "A spell area that extends in a straight path of a given length and width from its point of origin." },
  { term: "Sphere (Area of Effect)", cat: "Spellcasting", def: "A spell area that spreads outward in all directions from a point to a given radius." },
  { term: "Spell Scroll", cat: "Spellcasting", def: "A magic item inscribed with a single spell that can be cast once by reading it, if the reader meets any listed requirements." },
  { term: "Counterspell", cat: "Spellcasting", def: "A reaction spell that can interrupt another creature's spellcasting, potentially negating the spell entirely." },
  { term: "Dispel Magic", cat: "Spellcasting", def: "A spell that can end ongoing magical effects on a target creature, object, or area." },
  { term: "Innate Spellcasting", cat: "Spellcasting", def: "The ability to cast specific spells a set number of times, granted by species, feat, or monster trait, without needing to prepare them." },
  { term: "Spell Component Pouch", cat: "Spellcasting", def: "An item that holds material components for spells, letting a caster ignore individually listed non-costly materials." },
  { term: "Target", cat: "Spellcasting", def: "The creature, object, or point in space a spell or attack is aimed at, as specified in the spell's description." },
  { term: "Spell List", cat: "Spellcasting", def: "The set of spells available to a given class, from which it can learn, prepare, or otherwise access spells." },
  { term: "Cantrip Scaling", cat: "Spellcasting", def: "The increase in a cantrip's damage dice at character levels 5, 11, and 17, keeping cantrips useful at higher levels." },

  // ---------- Schools of Magic ----------
  { term: "Abjuration", cat: "Schools of Magic", def: "The school of protective magic, including spells that create wards, banish creatures, or block harm, such as Shield and Counterspell." },
  { term: "Conjuration", cat: "Schools of Magic", def: "The school of magic that transports creatures or objects, or creates them from nothing, such as Conjure Animals and Misty Step." },
  { term: "Divination", cat: "Schools of Magic", def: "The school of magic that reveals information, uncovering secrets, foreseeing the future, or perceiving beyond normal senses, such as Detect Magic." },
  { term: "Enchantment", cat: "Schools of Magic", def: "The school of magic that influences the minds of others, charming, compelling, or altering how a creature thinks and acts, such as Charm Person." },
  { term: "Evocation", cat: "Schools of Magic", def: "The school of magic that manipulates raw energy to create powerful damaging or elemental effects, such as Fireball and Magic Missile." },
  { term: "Illusion", cat: "Schools of Magic", def: "The school of magic that deceives the mind and senses, creating false sensory images or disguising the truth, such as Minor Illusion." },
  { term: "Necromancy", cat: "Schools of Magic", def: "The school of magic governing the forces of life and death, manipulating life force to harm, heal, or raise the dead, such as Animate Dead." },
  { term: "Transmutation", cat: "Schools of Magic", def: "The school of magic that changes the physical properties of a creature, object, or environment, such as Polymorph." },

  // ---------- Movement & Position ----------
  { term: "Speed", cat: "Movement & Position", def: "The distance, in feet, a creature can move during its turn, modified by conditions, encumbrance, or terrain." },
  { term: "Walking Speed", cat: "Movement & Position", def: "A creature's base movement rate over normal ground, the default type of Speed used unless another movement type applies." },
  { term: "Difficult Terrain", cat: "Movement & Position", def: "Terrain that costs 2 feet of movement for every 1 foot moved through it, such as rubble, thick foliage, or shallow snow." },
  { term: "Climbing", cat: "Movement & Position", def: "Movement up a vertical surface, costing an extra foot of movement for every foot climbed unless the creature has a Climb Speed." },
  { term: "Swimming", cat: "Movement & Position", def: "Movement through water, costing an extra foot of movement for every foot swum unless the creature has a Swim Speed." },
  { term: "Climb Speed", cat: "Movement & Position", def: "A special movement rate letting a creature climb without spending extra movement." },
  { term: "Swim Speed", cat: "Movement & Position", def: "A special movement rate letting a creature swim without spending extra movement." },
  { term: "Fly Speed", cat: "Movement & Position", def: "A special movement rate letting a creature move through the air, sometimes requiring it to stay aloft or fall if incapacitated." },
  { term: "Burrow Speed", cat: "Movement & Position", def: "A special movement rate letting a creature tunnel through loose earth, sand, mud, or ice." },
  { term: "Jump", cat: "Movement & Position", def: "Movement covering a long or high distance, with jump distance tied to a creature's Strength score and drawn from its Speed." },
  { term: "Squeezing", cat: "Movement & Position", def: "Movement through a space narrower than a creature, which costs extra movement and imposes disadvantage on attack rolls and Dexterity saves." },
  { term: "Falling", cat: "Movement & Position", def: "Uncontrolled downward movement, dealing 1d6 bludgeoning damage per 10 feet fallen, up to a maximum, and knocking the creature prone." },
  { term: "Reach", cat: "Movement & Position", def: "The distance, in feet, from which a creature can make a melee attack or target a melee spell, usually 5 feet unless increased." },
  { term: "Threatened Space", cat: "Movement & Position", def: "The area within a creature's reach where it can make Opportunity Attacks against enemies who leave that space." },
  { term: "Space", cat: "Movement & Position", def: "The area of ground a creature occupies in combat, based on its size category, typically 5-by-5 feet for a Medium creature." },
  { term: "Moving Through a Space", cat: "Movement & Position", def: "Passing through a hostile creature's space, normally allowed only if the creature is at least two sizes larger or smaller, and costing extra movement." },
  { term: "Teleportation", cat: "Movement & Position", def: "Instant movement from one location to another without passing through the space between, often via a spell like Misty Step or Teleport." },
  { term: "Obscured", cat: "Movement & Position", def: "A visibility category; a lightly obscured area imposes disadvantage on sight-based Perception checks, while a heavily obscured area blocks vision through it entirely." },

  // ---------- Rests & Recovery ----------
  { term: "Short Rest", cat: "Rests & Recovery", def: "A period of at least 1 hour of downtime during which a character can spend Hit Dice to heal and regain certain limited-use features." },
  { term: "Long Rest", cat: "Rests & Recovery", def: "A period of at least 8 hours of downtime that restores all hit points, half of spent Hit Dice, and most limited-use features." },
  { term: "Hit Dice", cat: "Rests & Recovery", def: "A pool of dice tied to class and level that can be spent during a Short Rest to regain hit points, and that partially refresh on a Long Rest." },
  { term: "Heroic Inspiration", cat: "Rests & Recovery", def: "A resource a character can hold that lets them reroll one d20 test, replacing the older Inspiration die mechanic." },
  { term: "Natural Healing", cat: "Rests & Recovery", def: "Recovering hit points and resources through rest rather than magic, primarily via Short and Long Rests." },
  { term: "Downtime", cat: "Rests & Recovery", def: "Time between adventures a character can spend on activities like training, crafting, or carousing." },
  { term: "Recharge", cat: "Rests & Recovery", def: "The point at which a limited-use feature or spell slot becomes available again, tied to a Short Rest, Long Rest, or the start of a new day." },
  { term: "Interrupted Rest", cat: "Rests & Recovery", def: "A rest broken by at least 1 hour of strenuous activity, such as combat, forcing the character to start the rest over to gain its benefits." },
  { term: "Spend Hit Dice", cat: "Rests & Recovery", def: "The act of rolling one or more Hit Dice, plus the Constitution modifier, during a Short Rest to recover hit points." },
  { term: "Exhaustion Recovery", cat: "Rests & Recovery", def: "A Long Rest removes one level of Exhaustion, the primary way characters recover from this stacking condition without magic." },

  // ---------- Equipment & Mastery ----------
  { term: "Cleave", cat: "Equipment & Mastery", def: "A weapon mastery property that, after a hit, lets you make a free extra attack against a second creature within 5 feet of the first, without adding your ability modifier to that damage." },
  { term: "Graze", cat: "Equipment & Mastery", def: "A weapon mastery property that deals damage equal to your ability modifier to a creature even when your attack against it misses." },
  { term: "Nick", cat: "Equipment & Mastery", def: "A weapon mastery property that lets the extra attack from wielding two Light weapons happen as part of the Attack action instead of costing a bonus action." },
  { term: "Push", cat: "Equipment & Mastery", def: "A weapon mastery property that lets you push a creature you hit straight away from you up to 10 feet, if it isn't more than one size larger than you." },
  { term: "Sap", cat: "Equipment & Mastery", def: "A weapon mastery property that gives a creature you hit disadvantage on its next attack roll before the start of your next turn." },
  { term: "Slow", cat: "Equipment & Mastery", def: "A weapon mastery property that reduces a hit creature's Speed by 10 feet until the start of your next turn." },
  { term: "Topple", cat: "Equipment & Mastery", def: "A weapon mastery property that forces a creature you hit to make a Constitution saving throw or fall Prone." },
  { term: "Vex", cat: "Equipment & Mastery", def: "A weapon mastery property that grants you advantage on your next attack roll against the same creature before the end of your next turn." },
  { term: "Weapon Mastery", cat: "Equipment & Mastery", def: "A class feature letting a character apply the special mastery property of certain weapons they are proficient with." },
  { term: "Finesse", cat: "Equipment & Mastery", def: "A weapon property letting the wielder use Dexterity instead of Strength for its attack and damage rolls." },
  { term: "Heavy", cat: "Equipment & Mastery", def: "A weapon property that gives Small creatures disadvantage on attack rolls made with that weapon." },
  { term: "Light", cat: "Equipment & Mastery", def: "A weapon property that allows the weapon to be used for two-weapon fighting without penalty." },
  { term: "Loading", cat: "Equipment & Mastery", def: "A weapon property limiting the wielder to one attack with it per action, regardless of extra attacks, due to its reload time." },
  { term: "Thrown", cat: "Equipment & Mastery", def: "A weapon property letting the weapon be thrown to make a ranged attack, using the same ability modifier as its melee attack." },
  { term: "Two-Handed", cat: "Equipment & Mastery", def: "A weapon property requiring both hands to use the weapon." },
  { term: "Versatile", cat: "Equipment & Mastery", def: "A weapon property letting a weapon deal more damage when used with two hands instead of one." },
  { term: "Ammunition", cat: "Equipment & Mastery", def: "A weapon property requiring a stock of arrows, bolts, or similar projectiles to make ranged attacks, normally recovered after combat." },
  { term: "Reach (Weapon Property)", cat: "Equipment & Mastery", def: "A weapon property that extends the wielder's melee range by 5 feet beyond the normal reach." },
  { term: "Simple Weapon", cat: "Equipment & Mastery", def: "A category of easy-to-use weapons, like clubs and daggers, that most classes are proficient with." },
  { term: "Martial Weapon", cat: "Equipment & Mastery", def: "A category of weapons requiring more training, like longswords and longbows, typically restricted to martially trained classes." },
  { term: "Improvised Weapon", cat: "Equipment & Mastery", def: "An object not designed as a weapon used to make an attack, generally dealing 1d4 damage and lacking normal weapon properties." },
  { term: "Light Armor", cat: "Equipment & Mastery", def: "A category of armor that adds a creature's full Dexterity modifier to AC and imposes no Strength requirement." },
  { term: "Medium Armor", cat: "Equipment & Mastery", def: "A category of armor that adds a capped Dexterity modifier, usually up to +2, to AC." },
  { term: "Heavy Armor", cat: "Equipment & Mastery", def: "A category of armor with a fixed AC that ignores Dexterity modifier, often requiring a minimum Strength score to wear without penalty." },
  { term: "Shield", cat: "Equipment & Mastery", def: "A piece of equipment carried in one hand that adds +2 to AC while wielded." },
  { term: "Armor Proficiency", cat: "Equipment & Mastery", def: "Training that lets a character wear a category of armor without penalties like disadvantage on Strength or Dexterity checks, saves, and attacks." },
  { term: "Stealth Disadvantage", cat: "Equipment & Mastery", def: "A penalty imposed by some heavier armors that gives the wearer disadvantage on Dexterity (Stealth) checks." },
  { term: "Donning/Doffing", cat: "Equipment & Mastery", def: "The time it takes to put on or remove a piece of armor, ranging from about a minute to an action depending on the armor's category." },

  // ---------- Class Resources ----------
  { term: "Rage", cat: "Class Resources", def: "A Barbarian resource granting bonus melee damage, resistance to bludgeoning, piercing, and slashing damage, and advantage on Strength checks and saves, usable a limited number of times per Long Rest." },
  { term: "Bardic Inspiration", cat: "Class Resources", def: "A Bard resource granted as a die that an ally can add to one ability check, attack roll, or saving throw they make." },
  { term: "Channel Divinity", cat: "Class Resources", def: "A Cleric and Paladin resource that fuels specific divine effects, usable a limited number of times before needing a rest to recharge." },
  { term: "Wild Shape", cat: "Class Resources", def: "A Druid feature letting the caster transform into a beast form for a limited duration, usable a set number of times per rest." },
  { term: "Focus Points", cat: "Class Resources", def: "A Monk resource, replacing the older Ki Points, spent to fuel special martial arts features like Flurry of Blows and Patient Defense." },
  { term: "Lay On Hands", cat: "Class Resources", def: "A Paladin resource, a pool of hit points that can be spent to heal wounds or cure certain conditions with a touch." },
  { term: "Sneak Attack", cat: "Class Resources", def: "A Rogue feature granting extra damage dice once per turn when the Rogue has advantage on the attack or an ally is within 5 feet of the target." },
  { term: "Sorcery Points", cat: "Class Resources", def: "A Sorcerer resource that can be converted to and from spell slots and spent to fuel Metamagic options." },
  { term: "Pact Magic", cat: "Class Resources", def: "The Warlock's distinct spellcasting system, using a small number of spell slots that are all the same level and recharge on a Short Rest." },
  { term: "Mystic Arcanum", cat: "Class Resources", def: "A high-level Warlock feature granting one specific spell of 6th through 9th level that can be cast once per Long Rest without a spell slot." },
  { term: "Eldritch Invocation", cat: "Class Resources", def: "A repeatable Warlock feature choice granting a permanent magical benefit, spell-like ability, or bonus chosen from a growing list as the Warlock levels up." },
  { term: "Arcane Recovery", cat: "Class Resources", def: "A Wizard feature that lets the caster recover expended spell slots during a Short Rest, once per day." },
  { term: "Superiority Dice", cat: "Class Resources", def: "A Battle Master Fighter resource spent to fuel combat maneuvers, regained on a Short or Long Rest." },
  { term: "Action Surge", cat: "Class Resources", def: "A Fighter feature letting the character take one additional action on their turn, usable a limited number of times per rest." },
  { term: "Second Wind", cat: "Class Resources", def: "A Fighter feature letting the character regain hit points as a bonus action a limited number of times per rest." },
  { term: "Divine Smite", cat: "Class Resources", def: "A Paladin feature letting a spell slot be expended after a melee hit to deal extra radiant damage." },
  { term: "Wild Companion", cat: "Class Resources", def: "A Druid feature letting the caster summon a spirit in the shape of a beast, using the Find Familiar spell without expending a spell slot." },
  { term: "Font of Magic", cat: "Class Resources", def: "The Sorcerer feature that grants Sorcery Points and the ability to convert them to and from spell slots." },
  { term: "Unarmored Defense", cat: "Class Resources", def: "A class feature, notably for Barbarians and Monks, letting AC be calculated using Constitution or Wisdom instead of wearing armor." },
  { term: "Martial Arts", cat: "Class Resources", def: "A Monk feature allowing unarmed strikes and monk weapons to use Dexterity and scale their damage die by level." },
  { term: "Rage Damage", cat: "Class Resources", def: "The bonus damage a raging Barbarian adds to Strength-based melee weapon attacks, which increases as the Barbarian gains levels." },
  { term: "Favored Foe", cat: "Class Resources", def: "A Ranger feature marking a target to deal bonus damage to it, usable a limited number of times per rest." },
  { term: "Deflect Missiles", cat: "Class Resources", def: "A Monk feature letting the Monk reduce damage from a ranged weapon attack using their reaction, and potentially catch or redirect it." },
  { term: "Ki Points", cat: "Class Resources", def: "The 2014 term for the Monk's limited-use resource pool, renamed to Focus Points under the 2024 rules." },
  { term: "Subclass", cat: "Class Resources", def: "A specialization chosen within a class, such as a Cleric's Divine Domain or a Wizard's Arcane Tradition, granting additional features." },
  { term: "Class Feature", cat: "Class Resources", def: "An ability granted automatically, or by choice, as a character gains levels in a class." },
  { term: "Fighting Style", cat: "Class Resources", def: "A feat-like class feature chosen by several martial classes granting a permanent combat bonus, such as Archery or Defense." },
  { term: "Song of Rest", cat: "Class Resources", def: "A Bard feature that lets allies who rest near the Bard regain additional hit points during a Short Rest." },
  { term: "Divine Domain", cat: "Class Resources", def: "The subclass choice for Clerics, granting bonus domain spells and Channel Divinity options tied to a portfolio, such as Life or War." },
  { term: "Primal Order", cat: "Class Resources", def: "The subclass choice for Druids, Magician or Warden, shaping bonus features like extra cantrips or martial training." },
  { term: "Sacred Oath", cat: "Class Resources", def: "The subclass choice for Paladins, granting oath spells and Channel Divinity options tied to a code of conduct." },
  { term: "Otherworldly Patron", cat: "Class Resources", def: "The subclass choice for Warlocks, representing the entity granting their power and shaping their expanded spell list and features." },
  { term: "Arcane Tradition", cat: "Class Resources", def: "The subclass choice for Wizards, shaping specialized spellcasting features such as a school specialty." },
  { term: "Metamagic", cat: "Class Resources", def: "A Sorcerer feature letting Sorcery Points be spent to alter how a spell is cast, such as Quickened Spell to cast it as a bonus action or Twinned Spell to hit a second target." },
  { term: "Bardic College", cat: "Class Resources", def: "The subclass choice for Bards, such as the College of Lore, granting performance-themed features that expand their versatility." },

  // ---------- Creatures & Planes ----------
  { term: "Aberration", cat: "Creatures & Planes", def: "A creature type for utterly alien beings, such as beholders and mind flayers, often warping reality or minds around them." },
  { term: "Beast", cat: "Creatures & Planes", def: "A creature type for nonmagical or mildly magical animals, such as wolves and giant spiders." },
  { term: "Celestial", cat: "Creatures & Planes", def: "A creature type for beings native to the Upper Planes, such as angels and unicorns, typically allied with good." },
  { term: "Construct", cat: "Creatures & Planes", def: "A creature type for beings created, usually by magic, from inanimate materials, such as golems and animated armor." },
  { term: "Dragon", cat: "Creatures & Planes", def: "A creature type for reptilian, often winged and breath-weapon-wielding beings, such as chromatic and metallic dragons." },
  { term: "Elemental", cat: "Creatures & Planes", def: "A creature type for beings native to the Elemental Planes, composed of air, earth, fire, or water." },
  { term: "Fey", cat: "Creatures & Planes", def: "A creature type for magical beings closely tied to the forces of nature or the Feywild, such as dryads and pixies." },
  { term: "Fiend", cat: "Creatures & Planes", def: "A creature type for evil beings native to the Lower Planes, such as demons and devils." },
  { term: "Giant", cat: "Creatures & Planes", def: "A creature type for humanlike beings of great size and strength, such as ogres, trolls, and true giants." },
  { term: "Humanoid", cat: "Creatures & Planes", def: "A creature type for the main peoples of the world, such as humans, elves, orcs, and goblins." },
  { term: "Monstrosity", cat: "Creatures & Planes", def: "A creature type for frightening beings that are not entirely natural, sometimes created by magic to guard treasures, such as owlbears." },
  { term: "Ooze", cat: "Creatures & Planes", def: "A creature type for gelatinous beings that often lack a fixed shape, such as gelatinous cubes." },
  { term: "Plant", cat: "Creatures & Planes", def: "A creature type for vegetable creatures, distinct from ordinary flora, such as shambling mounds and awakened trees." },
  { term: "Undead", cat: "Creatures & Planes", def: "A creature type for once-living creatures animated by negative energy, such as zombies, skeletons, and vampires." },
  { term: "Tiny", cat: "Creatures & Planes", def: "A size category for creatures occupying roughly a 2.5-by-2.5-foot space, such as sprites or house cats." },
  { term: "Small", cat: "Creatures & Planes", def: "A size category for creatures occupying a 5-by-5-foot space, such as goblins or halflings." },
  { term: "Medium", cat: "Creatures & Planes", def: "A size category for creatures occupying a 5-by-5-foot space, such as humans and most humanoids." },
  { term: "Large", cat: "Creatures & Planes", def: "A size category for creatures occupying a 10-by-10-foot space, such as ogres or horses." },
  { term: "Huge", cat: "Creatures & Planes", def: "A size category for creatures occupying a 15-by-15-foot space, such as most giants." },
  { term: "Gargantuan", cat: "Creatures & Planes", def: "A size category for creatures occupying a 20-by-20-foot space or larger, such as ancient dragons and krakens." },
  { term: "Material Plane", cat: "Creatures & Planes", def: "The plane of existence where most D&D campaigns take place, home to the mortal world." },
  { term: "Ethereal Plane", cat: "Creatures & Planes", def: "A fog-shrouded plane overlapping the Material Plane, accessible via effects like Etherealness, from which creatures can see but not be seen or touched." },
  { term: "Astral Plane", cat: "Creatures & Planes", def: "A silvery void plane connecting the Material Plane to the Outer Planes, traversed via spells like Astral Projection." },
  { term: "Feywild", cat: "Creatures & Planes", def: "A vibrant, emotionally heightened echo of the Material Plane, home to fey creatures and reachable through spells like Plane Shift." },
  { term: "Shadowfell", cat: "Creatures & Planes", def: "A bleak, gloomy echo of the Material Plane associated with death, undeath, and shadow magic." },

/* ---------------- Derived getters ---------------- */
function totalLevel(){ return S.levelSeq.length; }
function classLevels(){
  const m={}; for(const c of S.levelSeq) m[c]=(m[c]||0)+1; return m;
}
function classOrder(){
  const seen=[]; for(const c of S.levelSeq) if(!seen.includes(c)) seen.push(c); return seen;
}
function profBonus(){ const L=totalLevel()||1; return Math.ceil(L/4)+1; }

function featBoosts(){
  const b={STR:0,DEX:0,CON:0,INT:0,WIS:0,CHA:0};
  for(const f of S.feats){ if(f.boosts) for(const k in f.boosts) b[k]+=f.boosts[k]; }
  return b;
}
function capstoneEffects(){
  // class capstones like Primal Champion / Body and Mind: permanent boosts + raised cap
  const out={boosts:{}, caps:{}};
  const CB=window.CAPSTONE_BOOSTS||{};
  for(const f of acquiredFeatures()){
    const cb=CB[f.name];
    if(cb){ for(const a in cb.boosts){ out.boosts[a]=(out.boosts[a]||0)+cb.boosts[a]; out.caps[a]=Math.max(out.caps[a]||0, cb.cap||20); } }
  }
  return out;
}
function abilityCapFor(ab){
  // Epic boons raise cap to 30 for the boosted ability; capstones raise to their own cap
  for(const f of S.feats){ if(f.cat==="epicBoons" && f.boosts && f.boosts[ab]) return 30; }
  const caps=capstoneEffects().caps;
  return Math.max(20, caps[ab]||0);
}
function backgroundBoosts(){
  const b={STR:0,DEX:0,CON:0,INT:0,WIS:0,CHA:0};
  if(!S.background) return b;
  const bg=BACKGROUND_DATA.find(x=>x.name===S.background); if(!bg) return b;
  if(S.boostTriple){ for(const a of bg.abilities) b[a]+=1; }
  else { if(S.boostPlus2) b[S.boostPlus2]+=2; if(S.boostPlus1) b[S.boostPlus1]+=1; }
  return b;
}
function abilityScore(ab){
  const bg=backgroundBoosts()[ab], f=featBoosts()[ab];
  const cap=capstoneEffects().boosts[ab]||0;
  return Math.min(S.base[ab]+bg+f+cap, abilityCapFor(ab));
}
function saveProficiencies(){

  // plus feat picks (Resilient)
  const set=new Set(S.firstClass?CLASS_DATA[S.firstClass].saves:[]);
  const SP=window.SAVE_PROF_FEATURES||{};
  for(const f of acquiredFeatures()){
    const grant=SP[f.name];
    if(grant){ (grant[0]==="ALL"?ABILITIES:grant).forEach(a=>set.add(a)); }
  }
  (S.savePicks||[]).forEach(a=>set.add(a));
  return set;
}
function mod(ab){ return Math.floor((abilityScore(ab)-10)/2); }
function fmtMod(n){ return (n>=0?"+":"")+n; }

function hasFeat(name){
  if(S.feats.some(f=>f.name===name)) return true;
  if(S.humanBonusFeat===name) return true;
  const bg=S.background && BACKGROUND_DATA.find(x=>x.name===S.background);
  return !!(bg && bg.feat===name);
}
function hasFeature(sub){ // search acquired class/subclass feature names
  return acquiredFeatures().some(f=>f.name.toLowerCase().includes(sub.toLowerCase()));
}

function maxHP(){
  if(!S.levelSeq.length) return 0;
  const cm = mod("CON");
  let hp=0;
  S.levelSeq.forEach((cls,i)=>{
    const die=CLASS_DATA[cls].hitDie;
    hp += (i===0 ? die : Math.floor(die/2)+1) + cm;
  });
  if(hasFeat("Tough")) hp += 2*totalLevel();
  S.feats.forEach(f=>{ const e=(window.FEAT_EFFECTS||{})[f.name]; if(e&&e.hpMax) hp += e.hpMax; });
  if(typeof gearHPBonus==="function") hp += gearHPBonus();
  // Draconic Sorcery: +3 HP then +1 per sorcerer level after 3rd (net: +sorcLevel, since 3 at L3 then +1/level)
  if(S.subclasses["Sorcerer"]==="Draconic Sorcery"){
    const sl=classLevels()["Sorcerer"]||0; if(sl>=3) hp += sl;
  }
  return Math.max(1,hp);
}

/* ---------------- Features acquired ---------------- */
function acquiredFeatures(){
  // returns [{name, desc, cls, lvl, charLvl, sub:bool, asi?, epicBoon?}]
  const out=[]; const counts={};
  S.levelSeq.forEach((cls,i)=>{
    counts[cls]=(counts[cls]||0)+1;
    const cl=counts[cls], charLvl=i+1;
    const cd=CLASS_DATA[cls];
    for(const f of (cd.features[cl]||[])) out.push({...f, cls, lvl:cl, charLvl});
    const scName=S.subclasses[cls];
    if(scName){
      const sc=SUBCLASS_DATA[cls] && SUBCLASS_DATA[cls][scName];
      if(sc) for(const f of (sc.features[cl]||[])) out.push({...f, cls:cls+" ("+scName+")", lvl:cl, charLvl, sub:true});
    }
  });
  return out;
}

/* ---------------- Casters & slots ---------------- */
function casterEntries(){
  // [{cls, label, caster, classLevel}] including subclass casters
  const out=[]; const cl=classLevels();
  for(const c of classOrder()){
    const cd=CLASS_DATA[c];
    if(cd.caster) out.push({cls:c, label:c, caster:cd.caster, classLevel:cl[c]});
    const scName=S.subclasses[c];
    if(scName){
      const sc=SUBCLASS_DATA[c][scName];
      if(sc && sc.caster && cl[c]>=cd.subclassLevel) out.push({cls:c, label:c+" ("+scName+")", caster:sc.caster, classLevel:cl[c]});
    }
  }
  return out;
}
function combinedCasterLevel(){

  const entries=casterEntries().filter(e=>e.caster.kind!=="pact");
  if(entries.length===1){
    const e=entries[0], L=e.classLevel;
    return e.caster.kind==="full"?L : e.caster.kind==="half"?Math.ceil(L/2) : Math.ceil(L/3);
  }
  let lvl=0;
  for(const e of entries){
    if(e.caster.kind==="full") lvl+=e.classLevel;
    else if(e.caster.kind==="half") lvl+=Math.ceil(e.classLevel/2);
    else if(e.caster.kind==="third") lvl+=Math.floor(e.classLevel/3);
  }
  return lvl;
}
function sharedSlots(){ const l=combinedCasterLevel(); return l>0 ? FULL_SLOTS[Math.min(20,l)] : []; }
function pactInfo(){
  const w=casterEntries().find(e=>e.caster.kind==="pact");
  if(!w) return null;
  const i=w.classLevel-1;
  return {slots:w.caster.pactSlots[i], slotLevel:w.caster.pactSlotLevel[i], classLevel:w.classLevel};
}
// Per-class max preparable spell level: single-class progression for that class alone
function classMaxSpellLevel(entry){
  const c=entry.caster, L=entry.classLevel;
  if(c.kind==="pact"){
    let m=c.pactSlotLevel[L-1];
    // Mystic Arcanum extends known-spell ceiling
    if(L>=11)m=6; if(L>=13)m=7; if(L>=15)m=8; if(L>=17)m=9;
    return m;
  }
  let eff = c.kind==="full"?L : c.kind==="half"?Math.ceil(L/2) : Math.ceil(L/3);
  if(eff<1) return 0;
  return FULL_SLOTS[Math.min(20,eff)].length;
}
function spellState(cls){
  const ss=S.spells[cls]=S.spells[cls]||{};
  ss.cantrips=ss.cantrips||[]; ss.prepared=ss.prepared||[]; ss.arcanum=ss.arcanum||{};
  ss.mastery=ss.mastery||{}; ss.signature=ss.signature||[];
  return ss;
}
// spells that are always prepared without consuming prepared slots:
// subclass bonus spells + Spell Mastery picks + Signature Spells
function alwaysPrepared(cls){
  const ss=spellState(cls);
  return [...bonusSpellsFor(cls), ...Object.values(ss.mastery).filter(Boolean), ...ss.signature];
}
/* ---------------- Feature spell grants (subclass features that teach spells) ---------------- */
const FEATURE_SPELL_GRANTS={
  "Magical Discoveries": { n:2, lists:["Cleric","Druid","Wizard"], ownerClass:"Bard", includeCantrips:true,
    abilityNote:"Charisma; they count as Bard spells and are always prepared (swap one when you gain a Bard level)" }
};
function pickConfigFor(featName){
  const eff=(window.FEAT_EFFECTS||{})[featName];
  if(eff&&eff.spellPick) return eff.spellPick;
  const g=FEATURE_SPELL_GRANTS[featName];
  if(!g) return null;
  const e=casterEntries().find(x=>x.cls===g.ownerClass);
  const maxL=e?classMaxSpellLevel(e):1;
  return { spells:g.n, maxLevel:maxL, lists:g.lists, includeCantrips:!!g.includeCantrips, abilityNote:g.abilityNote||"" };
}

/* ---------------- Option features (Metamagic, Invocations, ...) ---------------- */
function optOwnerLevel(def){
  const cl=classLevels();
  if(CLASS_DATA[def.owner]) return cl[def.owner]||0;                 // owned by a class
  for(const c of classOrder()) if(S.subclasses[c]===def.owner) return cl[c]||0;  // owned by a subclass
  return 0;
}
function optAllowedAt(def, lvl){
  let n=0;
  for(const k in def.known){ if(+k<=lvl) n=Math.max(n, def.known[k]); }
  return n;
}
function optionState(key){ return S.options[key]=S.options[key]||[]; }
function acquiredOptionFeatures(){
  const OF=window.OPTION_FEATURES||{}; const out=[];
  for(const key in OF){
    const def=OF[key];
    const lvl=optOwnerLevel(def);
    const allowed=optAllowedAt(def, lvl);
    if(allowed<=0) continue;
    // all:true features grant every option automatically (used per-situation at the table)
    if(def.all) out.push({key, def, allowed:def.options.length, chosen:def.options.map(o=>o.name), auto:true});
    else out.push({key, def, allowed, chosen:optionState(key)});
  }
  return out;
}
function classFeatureAcquired(cls, re){
  const lv=classLevels()[cls]||0; const cd=CLASS_DATA[cls]; if(!cd) return false;
  for(const l in cd.features){ if(+l<=lv && cd.features[l].some(f=>re.test(f.name))) return true; }
  return false;
}
function bonusSpellsFor(cls){
  const scName=S.subclasses[cls]; if(!scName) return [];
  const sc=SUBCLASS_DATA[cls][scName]; if(!sc||!sc.bonusSpells) return [];
  const cl=classLevels()[cls]||0; const out=[];
  for(const lvl in sc.bonusSpells){ if(+lvl<=cl) out.push(...sc.bonusSpells[lvl]); }
  return out;
}
function spellByName(n){ return SPELL_DATA.find(s=>s.name===n); }
function spellsForList(listName, maxLvl, minLvl=1){
  return SPELL_DATA.filter(s=>s.level>=minLvl && s.level<=maxLvl && s.classes.includes(listName))
    .sort((a,b)=>a.level-b.level || a.name.localeCompare(b.name));
}

/* ---------------- Multiclass legality ---------------- */
function meetsPrereq(pr){
  if(!pr) return true;
  if(pr.or){ return Object.keys(pr.or).some(a=>abilityScore(a)>=pr.or[a]); }
  return Object.keys(pr).every(a=>abilityScore(a)>=pr[a]);
}
function eligibleClasses(){
  // classes you can take your next level in
  const cur=classOrder(); const out=[];
  if(totalLevel()>=20) return out;
  for(const c of Object.keys(CLASS_DATA)){
    if(cur.includes(c)){ out.push({cls:c, ok:true, why:""}); continue; }
    // multiclass: must meet prereqs of ALL current classes and the new one
    const okNew=meetsPrereq(CLASS_DATA[c].multiclassPrereq);
    const okCur=cur.every(cc=>meetsPrereq(CLASS_DATA[cc].multiclassPrereq));
    let why="";
    if(!okNew) why="Requires "+prereqText(CLASS_DATA[c].multiclassPrereq);
    else if(!okCur) why="Your current class prerequisites are unmet";
    out.push({cls:c, ok:okNew&&okCur, why});
  }
  return out;
}
function prereqText(pr){
  if(!pr) return "";
  if(pr.or) return Object.keys(pr.or).map(a=>ABIL_NAMES[a]+" "+pr.or[a]).join(" or ");
  return Object.keys(pr).map(a=>ABIL_NAMES[a]+" "+pr[a]).join(" and ");
}

/* ---------------- Level up ---------------- */
function pendingChoicesFor(cls, newClassLevel){
  const cd=CLASS_DATA[cls]; const ch=[];
  const feats=(cd.features[newClassLevel]||[]);
  if(newClassLevel===cd.subclassLevel) ch.push({kind:"subclass", cls});
  for(const f of feats){
    if(f.asi) ch.push({kind:"asi", cls, label:f.name});
    if(f.epicBoon) ch.push({kind:"boon", cls});
    if(/fighting style/i.test(f.name)) ch.push({kind:"style", cls});
    if(/^expertise/i.test(f.name)){
      const avail=S.skills.filter(sk=>!S.expertise.includes(sk)).length;
      if(avail>0) ch.push({kind:"expertise", cls, n:Math.min(2,avail)});
    }
    if(/deft explorer/i.test(f.name)){
      const avail=S.skills.filter(sk=>!S.expertise.includes(sk)).length;
      if(avail>0) ch.push({kind:"expertise", cls, n:1});
    }
    if(/^scholar$/i.test(f.name)){
      const scholarly=["Arcana","History","Investigation","Medicine","Nature","Religion"];
      const avail=S.skills.filter(sk=>scholarly.includes(sk)&&!S.expertise.includes(sk)).length;
      if(avail>0) ch.push({kind:"expertise", cls, n:1, restrict:scholarly});
    }
    if(/spell mastery/i.test(f.name)) ch.push({kind:"mastery", cls});
    if(/signature spells/i.test(f.name)) ch.push({kind:"signature", cls});
    if(/mystic arcanum/i.test(f.name)){
      const m=/(\d)/.exec(f.desc.match(/level [6-9]/i)?f.desc.match(/level ([6-9])/i)[1]:"");
      const lvl = f.name.match(/([6-9])/) ? +f.name.match(/([6-9])/)[1] : (newClassLevel===11?6:newClassLevel===13?7:newClassLevel===15?8:9);
      ch.push({kind:"arcanum", cls, spellLevel:lvl});
    }
  }
  // subclass features may also add choices (e.g., extra fighting style); keep simple, scan subclass too
  const scName=S.subclasses[cls];
  if(scName){
    const sc=SUBCLASS_DATA[cls][scName];
    if(sc) for(const f of (sc.features[newClassLevel]||[])){
      if(/fighting style/i.test(f.name)) ch.push({kind:"style", cls});
      if(/^expertise/i.test(f.name)){
        const avail=S.skills.filter(sk=>!S.expertise.includes(sk)).length;
        if(avail>0) ch.push({kind:"expertise", cls, n:Math.min(2,avail)});
      }
      if(/bonus proficienc/i.test(f.name)) ch.push({kind:"featskills", n:3, from:null, fromSlot:null, feat:f.name});
      if(FEATURE_SPELL_GRANTS[f.name]) ch.push({kind:"featspells", fromSlot:"feature:"+f.name, feat:f.name});
    }
  }
  // option features (Metamagic, Invocations, maneuvers, ...) whose allowance grows this level
  const OF=window.OPTION_FEATURES||{};
  for(const key in OF){
    const def=OF[key];
    if(def.all) continue;   // auto-granted menus need no pick
    const owns=def.owner===cls||S.subclasses[cls]===def.owner;
    if(!owns) continue;
    const prev=optAllowedAt(def,newClassLevel-1), now=optAllowedAt(def,newClassLevel);
    if(now>prev) ch.push({kind:"options", key, total:now});
  }
  // spoils of the adventure at tier boundaries (character level, not class level)
  if(window.SPOILS&&SPOIL_LEVELS.includes(totalLevel())) ch.push({kind:"spoils", level:totalLevel()});
  // spell management reminder if this class (or its subclass) casts
  const entry=casterEntriesForClassAt(cls, newClassLevel);
  if(entry) ch.push({kind:"spells", cls, optional:true});
  return ch;
}
function casterEntriesForClassAt(cls, classLevel){
  const cd=CLASS_DATA[cls];
  if(cd.caster) return {caster:cd.caster};
  const scName=S.subclasses[cls];
  if(scName && SUBCLASS_DATA[cls][scName] && SUBCLASS_DATA[cls][scName].caster && classLevel>=cd.subclassLevel)
    return {caster:SUBCLASS_DATA[cls][scName].caster};
  return null;
}

function applyLevel(cls){
  S.levelSeq.push(cls);
  const newCl=classLevels()[cls];
  S.pending={cls, classLevel:newCl, choices:pendingChoicesFor(cls,newCl), done:{}};
}

/* ---------------- Road map (1-20 milestones per class) ---------------- */
function roadmapFor(cls){
  const cd=CLASS_DATA[cls]; const out=[];
  for(let l=1;l<=20;l++){
    const fs=cd.features[l]||[]; const names=fs.map(f=>f.name);
    let k="";
    if(l===cd.subclassLevel) k="sub";
    else if(fs.some(f=>f.epicBoon)) k="boon";
    else if(l===20) k="cap";
    else if(fs.some(f=>/extra attack/i.test(f.name))) k="attack";
    else if(fs.some(f=>f.asi)) k="asi";
    else if(names.length&&!names.every(n=>/subclass feature/i.test(n))) k="feat";
    out.push({l,k,names});
  }
  return out;
}
/* ---------------- Suggested spell loadout ---------------- */
const TAG_W={damage:3,control:3,healing:3,buff:2,defense:2,aoe:1.5,debuff:1.5,summon:1,utility:1,mobility:1,detection:.5,social:.5};
function suggestLoadout(cls){
  const e=casterEntries().find(x=>x.cls===cls); if(!e) return;
  const ss=spellState(cls);
  const cN=e.caster.cantrips[e.classLevel-1]||0, pN=e.caster.prepared[e.classLevel-1]||0;
  const T_=window.SPELL_TAGS||{};
  const dieAvg=sp=>{ const m=sp.desc.match(/(\d+)d(\d+)/); return m?(+m[1]*(+m[2]+1)/2):0; };
  const score=sp=>{ const t=T_[sp.name]||[]; return sp.level*1.6+(TAG_W[t[0]]||0)+(t[1]?(TAG_W[t[1]]||0)*.4:0)+(t[0]==="damage"?dieAvg(sp)/3:0); };
  const primary=sp=>(T_[sp.name]||["utility"])[0];
  if(cN>ss.cantrips.length){
    const pool=spellsForList(e.caster.list,0,0).filter(sp=>!ss.cantrips.includes(sp.name));
    const dmg=pool.filter(sp=>primary(sp)==="damage").sort((a,b)=>score(b)-score(a));
    const rest=pool.filter(sp=>primary(sp)!=="damage").sort((a,b)=>score(b)-score(a));
    const order=[...(dmg.length?[dmg[0]]:[]), ...rest, ...dmg.slice(1)];
    for(const sp of order){ if(ss.cantrips.length>=cN) break; ss.cantrips.push(sp.name); }
  }
  if(pN>ss.prepared.length){
    const maxL=e.caster.kind==="pact"?e.caster.pactSlotLevel[e.classLevel-1]:classMaxSpellLevel(e);
    const free=alwaysPrepared(cls);
    const pool=spellsForList(e.caster.list,maxL,1).filter(sp=>!ss.prepared.includes(sp.name)&&!free.includes(sp.name)).sort((a,b)=>score(b)-score(a));
    const cap=Math.max(2,Math.ceil(pN*0.4)); const used={};
    const want=["healing","control","damage","defense","buff"];
    for(const w of want){ const sp=pool.find(x=>primary(x)===w&&!ss.prepared.includes(x.name)); if(sp&&ss.prepared.length<pN){ ss.prepared.push(sp.name); used[w]=(used[w]||0)+1; } }
    for(const sp of pool){ if(ss.prepared.length>=pN) break; const t=primary(sp); if(ss.prepared.includes(sp.name)||(used[t]||0)>=cap) continue; ss.prepared.push(sp.name); used[t]=(used[t]||0)+1; }
  }
}
/* ---------------- Auto-place ability scores ---------------- */
function autoPlaceScores(){
  const cls=S.firstClass; if(!cls) return;
  const prim=CLASS_DATA[cls].primary;
  const order=[...prim,"CON","DEX","WIS","STR","INT","CHA"].filter((a,i,arr)=>arr.indexOf(a)===i);
  ABILITIES.forEach(a=>{ if(!order.includes(a)) order.push(a); });
  if(S.method==="pointbuy"){ STANDARD_ARRAY.forEach((v,i)=>{ S.base[order[i]]=v; }); }
  else if(S.method==="array"){ S.arrayAssign={}; STANDARD_ARRAY.forEach((v,i)=>{ S.arrayAssign[order[i]]=v; }); }
  else { const idx=T.rollPools.map((v,i)=>i).sort((x,y)=>T.rollPools[y]-T.rollPools[x]); S.rollAssign={}; idx.forEach((ri,i)=>{ S.rollAssign[order[i]]=ri; }); }
}

/* ---------------- Vignettes ---------------- */
const VIGNETTES = [
  {min:2,max:4,t:"The Rat Cellar",x:"The miller said the cellar held big rats. Instead you found a nest of giant centipedes and a flour barrel that turned out to be a mimic. You cut through the centipedes and wrestled the mimic still until it gave up the fight. You climbed out coated in ichor, and the miller owes you a favor now."},
  {min:2,max:4,t:"Toll of the Bridge Goblins",x:"A goblin gang blocked the bridge and demanded ten gold or one shoe. When you handed over the shoe, the boss ate it on the spot and negotiations ended there. You waded into the gang and fought them off the bridge one by one. You crossed the bridge with your gold still in your purse, one shoe lighter and a new respect for goblin appetites."},
  {min:2,max:4,t:"The Hungry Barrow",x:"At dusk, pale hands clawed up out of the barrow-earth: a rise of zombies, slow but tireless. The village needed the line held until sunrise gilded the standing stones, or the dead would reach the houses. You planted your feet and cut down wave after wave through the night. When the bell rang at dawn, it rang your name."},
  {min:2,max:4,t:"Wolves on the King's Road",x:"Winter drove a wolf pack down from the hills, eyes catching the torchlight like struck flint at the treeline. You walked the caravan's flank through a long, howling night, driving off three separate charges. By dawn the wagons were still rolling and every merchant was breathing. Their gratitude rides in your pack now, heavier than usual."},
  {min:2,max:4,t:"The Cult Below the Chapel",x:"Beneath a respectable little chapel, robed cultists chanted around a summoning circle and a very put-out imp. You kicked over their brazier and broke the circle before it could close. The cultists scattered into the tunnels, and the imp popped back to its own plane in a cloud of sulfur. You left with a bad smell in your cloak and a good story to tell."},
  {min:3,max:6,t:"The Bandit King's Wager",x:"The self-styled Bandit King wagered his crown that no one could beat him twice in one night. You beat him at swords first, then beat him again at cards before he could recover. His crew watched both losses and started calling you by name. Now that name gets said in taverns with equal parts fear and respect."},
  {min:3,max:6,t:"Night of the Ankheg",x:"Acid-scarred tunnels were swallowing the farmland field by field, and the farmers blamed ankhegs burrowing beneath the wheat. You climbed down into the churning dark after them, tracking the tunnels by smell and sound. You killed the largest one in a narrow chamber and dragged its mandible out as proof. The harvest held, and so did your reputation."},
  {min:4,max:7,t:"The Ghoul Warrens",x:"Below the potter's field, a warren of ghouls had grown fat and bold enough to raid the town at night. Their touch could freeze a limb solid, but you fought through the tunnels nest by nest. You put the warren to the torch and watched the smoke rise past dawn. You walk taller now, and towns nearby already know your name."},
  {min:4,max:8,t:"The Owlbear's Grudge",x:"Nothing in your training covered an owlbear that held a grudge and remembered faces. This one had crossed paths with you before, and it came looking for a rematch through half the forest. You dodged its charges and countered until it finally backed down, breathing hard. It walked off grudgingly respecting you, and everyone who watched the chase respects you too."},
  {min:5,max:8,t:"The Green Knight's Test",x:"A wandering knight in verdigris armor was challenging every traveler at the ford to single combat. You took the challenge at noon and traded blows with him until the light went orange at dusk. Neither of you landed a killing stroke, but you wore him down enough that he finally lowered his blade. He named you a peer of the road, and travelers at that ford still ask which way you went."},
  {min:5,max:9,t:"Trolls Under the Ferry Bridge",x:"Two trolls had figured out that the ferries running under their bridge carried the town's payroll. You lured them out from under the pilings and finished the fight with torches when your blades alone couldn't stop them from healing. The ferry line kept running, payroll intact, and the trolls didn't come back. The ferry company named a boat after you, and now you get free crossings for life."},
  {min:5,max:9,t:"The Wight of Cairn Hollow",x:"The wight ruling Cairn Hollow wore a crown of tarnished silver and commanded the risen dead of three old battlefields. If it wasn't stopped, that army would march on the valley below. You broke its blade first and its hold over the dead second, both in the same fight. Cairn Hollow is quiet now, but the songs about that night have already started."},
  {min:6,max:10,t:"You Have Vanquished a Beholder",x:"A beholder had ruled the undercity through fear, watching every tunnel through its many eyes for the slightest defiance. You fought your way past its lesser eye-rays and put a blade through the great central eye before it could aim its disintegration beam. The tyranny over the undercity ended the moment that eye went dark. You still dream about the beam some nights, but you're the one still standing."},
  {min:6,max:10,t:"The Medusa's Garden",x:"A garden of stone statues turned out to be a medusa's collection of everyone who had looked at her directly. You fought her by mirror-glance and instinct alone, never once meeting her eyes. After she fell, you found the restoration ritual in her hoard and freed three adventurers from stone. They walked back into the sun owing you their second lives."},
  {min:6,max:11,t:"The Mind of the Hive",x:"Something in the salt mine was thinking with a hundred bodies at once, and thralls kept dragging in new workers. You fought down through the mine to the elder brain's chamber and survived the visions it threw at your mind. You planted charges and brought the gallery down on top of it. Some nights you still hear a faint hum, but you're the one who walked away."},
  {min:7,max:11,t:"The Giant's Bargain",x:"A hill giant chieftain had been claiming the valley's herds as tribute, and a cloud giant above the clouds was claiming the hill giant's loyalty in turn. You beat the hill giant in single combat at the valley's edge, then climbed to the cloud giant's court and talked him out of the arrangement entirely. The valley pays tribute to no one now. People call you Giant-slayer, and most of them mean it."},
  {min:7,max:12,t:"The Drowned Temple",x:"Beneath the lake stood a temple to something older than the lake itself, guarded by sahuagin priests and a water elemental bound in chains for three centuries. You cut through the priests first and freed the elemental to settle the score itself. Every chain you found, you cut, and the temple's hold on the lake broke with the last one. The lake is just a lake now."},
  {min:8,max:12,t:"The Chimera of the Pass",x:"A chimera with three heads and three separate grudges had turned the mountain pass into a dead end for every caravan. You baited the lion head first, then the goat head, and finished the dragon head before it could breathe fire twice. The pass is open to trade again, and cartographers have already started renaming it after you. You signed one of the new maps yourself."},
  {min:9,max:13,t:"The Vampire of Greyveil Manor",x:"The lord of Greyveil Manor hadn't aged a day in ninety years, and his dinner guests had a habit of never leaving. You tracked him to his coffin before dawn and threw the curtains wide to pin him in the light. You finished it with a stake through the heart while he was still too weak to fight back. The manor's shadows have finally stopped moving on their own."},
  {min:9,max:14,t:"The Young Dragon's Hoard",x:"A young red dragon had decided the nearby town owed it tribute, and it burned the tax collector's office down to make the point. You tried reasoning with it first and got a wall of fire back. In the fight that followed you drove your blade between its scales and brought it down before it could torch the town itself. You kept a single scale as a trophy, and the town is still standing."},
  {min:10,max:14,t:"The Githyanki Raid",x:"A githyanki war-band rode the Astral tide through a tear in the sky, silver swords first, straight at the town below. You planted yourself in the breach and held the line while mages worked to close the rift. You cut down riders faster than the tide could bring them until the rift finally guttered shut. Somewhere beyond the veil, a lich-queen has written your name down."},
  {min:11,max:15,t:"The Frost Titan's War-Horn",x:"When the frost giant jarl sounded his war-horn, the glacier itself began to move, grinding toward the valley below. You climbed the moving ice as it crushed everything in its path and fought your way to the horn. You silenced the horn for good and dropped the jarl into a crevasse of his own making. Spring came late that year, but it came."},
  {min:11,max:16,t:"The Beholder Hive-Tyrant",x:"One beholder is dangerous enough, but this hive-tyrant had spawned a dozen more from its own dreams, and the district under its lair had learned to expect anything. You cut through the spawn one by one and cornered the tyrant in its own scarred chamber. You turned its disintegration rays back on the chamber walls and brought the whole lair down. The district is quiet now, and things there finally stay the way they look."},
  {min:12,max:16,t:"The Lich's Examination",x:"The lich Vorosthal had been testing adventurers for centuries and marked you down as an interesting variable worth watching. You tracked its phylactery to a hidden vault and shattered it before it could finish its notes on you. The lich itself crumbled to dust the moment the phylactery broke. You kept a fragment of the phylactery as a paperweight, in case it ever tries to finish its homework."},
  {min:12,max:17,t:"The Kraken's Tithe",x:"Nine coastal towns had been paying a kraken's tithe in ships and sailors, but the tenth town hired you instead. You rowed out past the breakers and fought the kraken as it rose, wave after wave crashing over the boat. You drove your weapon into its eye and it sank back into the deep for good. Sailors in every port still spill a drink for you before they sail."},
  {min:13,max:17,t:"The Adult Dragon's Due",x:"An ancient pact said the crown itself was owed to the dragon, and it came to collect in person, burning the treasury to make its point. You met it in the air above the flames and fought the whole exchange out on the wing. When the smoke cleared, the crown stayed on its cushion and the dragon did not. Kings across the region answer your letters promptly now."},
  {min:14,max:18,t:"The Death Knight's Vigil",x:"The death knight had guarded the broken gate for four hundred years, waiting for someone strong enough to finally end his watch. You fought him at the threshold, blade for blade, until he could no longer stand. You gave him the death he'd been waiting for and laid his sword to rest across his cairn. The gate beyond is yours to open now, and no map covers what's on the other side."},

function armorClassBreakdown(){

    if(!armorProficient(arm.rec)) parts.push("not proficient: Disadvantage on attacks, checks and saves using STR or DEX");
  } else {
    const opts=[{v:10+dex,l:"10 + DEX"}];
    if(classLevels()["Barbarian"]) opts.push({v:10+dex+mod("CON"),l:"Unarmored Defense (10 + DEX + CON)"});
    if(classLevels()["Monk"]&&!shield) opts.push({v:10+dex+mod("WIS"),l:"Unarmored Defense (10 + DEX + WIS)"});
    if(S.subclasses["Sorcerer"]==="Draconic Sorcery") opts.push({v:10+dex+mod("CHA"),l:"Draconic Resilience (10 + DEX + CHA)"});
    if(S.subclasses["Bard"]==="College of Dance"&&!shield) opts.push({v:10+dex+mod("CHA"),l:"Dazzling Footwork (10 + DEX + CHA)"});
    const best=opts.sort((a,b)=>b.v-a.v)[0]; ac=best.v; parts.push(best.l+" = "+best.v);
  }
  if(shield){ const b=(shield.rec?shield.rec.ac:2)+(gearEffect(shield).bonus||0); ac+=b; parts.push(`${shield.name} +${b}`); }
  if(arm&&S.fightingStyles.includes("Defense")){ ac+=1; parts.push("Defense style +1"); }
  for(const n of g.wonders){
    const it=gearItem(n); const b=gearEffect(it).acBonus||0; if(!b) continue;

}

/* ---------------- Benchmark monsters (phase c) ---------------- */
function tierOf(L){ return L>=17?4:L>=11?3:L>=5?2:1; }
function monsterByName(n){ return (window.MONSTER_DATA||[]).find(m=>m.name===n)||null; }
function benchmarkMonsters(){
  const all=window.MONSTER_DATA||[]; if(!all.length) return [];
  const pool=all.filter(m=>m.tier===tierOf(totalLevel())).sort((a,b)=>a.cr-b.cr);
  const defaults=pool.length>3?[pool[0],pool[Math.floor(pool.length/2)],pool[pool.length-1]]:pool;
  const picks=T.pgPick||[];
  return [0,1,2].map(i=>monsterByName(picks[i])||defaults[i]).filter(Boolean);
}
function monsterRound(m, ac){ // the monster's expected damage per round against a given AC (and your saves)
  let t=0;
  for(const a of m.attacks||[]){
    const w=a.recharge?1/3:1, avg=avgDice(a.dmg), diceOnly=avgDice(String(a.dmg).replace(/[+-]\s*\d+$/,""));
    if(a.atk!=null){ const h=hitChance(a.atk,ac); t+=w*(h*avg+0.05*diceOnly); }
    else if(a.save){ const mine=mod(a.save)+(saveProficiencies().has(a.save)?profBonus():0)+gearSaveBonus(); const fail=Math.min(.95,Math.max(.05,(a.dc-mine-1)/20)); t+=w*avg*(fail+(1-fail)*.5); }
  }
  return t;
}
function provingGround(){
  const ps=attackProfiles(); const n=attacksPerAction();
  const main=ps.find(p=>p.slot==="weapon")||ps.find(p=>p.slot==="ranged")||ps.find(p=>p.slot==="unarmed");
  const off=ps.find(p=>p.slot==="offhand"); const rng=ps.find(p=>p.slot==="ranged"&&p!==main);
  const monkL=classLevels()["Monk"]||0;
  const monsters=benchmarkMonsters();
  const cols=monsters.length?monsters.map(m=>({label:m.name, ac:m.ac, hp:m.hp, saves:m.saves||{}, atk:null, m})):PG_AC.map((ac,i)=>({label:"AC "+ac, ac, hp:null, saves:{}, saveMod:PG_SAVE[i], atk:PG_ATK[i]}));
  const rows=[];
  const mk=(label, fn)=>rows.push({label, cells:cols.map(fn)});
  const finish=(c,r)=>{ if(c.hp&&r.dpr>0) r.rounds=Math.ceil(c.hp/r.dpr); return r; };
  if(main){
    const bonusAtk=(off&&off.light&&main.light)?off:(monkL?ps.find(p=>p.slot==="unarmed"):null);
    const lbl=`${main.name} × ${n}${bonusAtk?" + "+(bonusAtk.slot==="unarmed"?"unarmed (bonus action)":"off-hand"):""}`;
    mk(lbl, c=>{ const d=dprFor(main,c.ac); let v=d.perAttack*n; let hits=n;
      if(bonusAtk){ v+=dprFor(bonusAtk,c.ac).perAttack; hits++; }
      v+=(1-Math.pow(1-d.hit,hits))*d.once; return finish(c,{hit:d.hit, dpr:v}); });
  }
  if(rng) mk(`${rng.name} × ${n}`, c=>{ const d=dprFor(rng,c.ac); return finish(c,{hit:d.hit, dpr:d.perAttack*n+(1-Math.pow(1-d.hit,n))*d.once}); });
  const ct=bestCantrip();
  if(ct) mk(`${ct.name}${ct.beams>1?" × "+ct.beams:""}`, c=>{
    if(ct.attackRoll){ const h=hitChance(ct.atk,c.ac); return finish(c,{hit:h, dpr:(h*ct.per+0.05*ct.per*0.5)*ct.beams}); }
    const sm=c.saves[ct.saveAb]!=null?c.saves[ct.saveAb]:(c.saveMod||0);
    const fail=Math.min(.95,Math.max(.05,(ct.dc-sm-1)/20)); return finish(c,{hit:fail, dpr:ct.per*(fail+(ct.half?(1-fail)*.5:0)), save:true});
  });
  const ac=armorClass(), hp=maxHP();
  const threat=cols.map(c=>{ if(!c.m) return {dpr:null, ehp:Math.round(hp/hitChance(c.atk,ac))}; const dpr=monsterRound(c.m,ac); return {dpr, rounds:dpr>0?Math.ceil(hp/dpr):null}; });
  return {rows, cols, threat, ac, hp, attacks:n, monsters};
}

/* ---------------- Kits & spoils ---------------- */
function kitsFor(cls){ return ((window.STARTING_KITS||{})[cls])||[]; }
function applyKit(){
  const kits=kitsFor(S.firstClass); if(!kits.length) return;
  const k=kits.find(x=>x.name===S.kit)||kits[0]; S.kit=k.name;
  const g=gearState(); g.armor=k.armor||null; g.offhand=k.offhand||null; g.weapon=k.weapon||null; g.ranged=k.ranged||null;
}
function archetype(){
  const cl=classLevels(), order=classOrder(); if(!order.length) return "heavy-melee";
  const sum=list=>order.filter(c=>list.includes(c)).reduce((t,c)=>t+cl[c],0);
  const martial=sum(["Barbarian","Fighter","Rogue"]), monk=cl["Monk"]||0, caster=sum(["Bard","Cleric","Druid","Sorcerer","Warlock","Wizard"]), half=sum(["Paladin","Ranger"]);
  if(monk&&monk>=Math.max(martial,caster,half)) return "unarmed";
  if(caster>martial+half+monk) return "full-caster";
  if(half>martial+monk&&half>=caster) return "half-caster";
  const g=gearState(); const w=gearItem(g.weapon), r=gearItem(g.ranged);
  const bow=r&&r.rec&&r.rec.kind==="ranged"&&hasProp(r.rec,"ammunition");
  const lightMain=!w||!w.rec||w.rec.cat==="simple"||hasProp(w.rec,"light");
  if(bow&&lightMain&&mod("DEX")>=mod("STR")) return "ranged";
  if(w&&w.rec&&hasProp(w.rec,"finesse")&&mod("DEX")>=mod("STR")) return "finesse-melee";
  if(bow&&mod("DEX")>mod("STR")) return "ranged";
  return "heavy-melee";
}
function reforge(it){
  if(!it||!it.base||!/^\+\d /.test(it.name)) return it?it.name:null;
  const g=gearState(); const isW=!!weaponRec(it.base); const n=it.name.match(/^(\+\d) /)[1];
  let cur=null;
  if(isW){ const base=weaponRec(it.base); const slot=base.kind==="ranged"?g.ranged:g.weapon; const ci=gearItem(slot); cur=ci&&ci.rec&&ci.rec.dmg?ci.rec.name:null; }
  else { const base=armorRec(it.base); const slot=base.cat==="shield"?g.offhand:g.armor; const ci=gearItem(slot); cur=ci&&ci.rec&&!ci.rec.dmg?ci.rec.name:null; }
  if(cur&&cur!==it.base){ const alt=MID().find(m=>m.base===cur&&m.name.startsWith(n+" ")); if(alt) return alt.name; }
  return it.name;
}
function spoilsOffer(level){
  const SP=window.SPOILS||{}; const list=((SP[archetype()]||{})[level])||[]; const out=[];
  const vt=(S.log[S.log.length-1]||{}).title; const trophy=TRD()[vt];
  for(const n of list){
    if(n==="<trophy>"){ if(trophy&&!out.some(o=>o.name===trophy.name)) out.push({name:trophy.name, item:trophy, trophy:true, from:vt}); continue; }
    const it=magicRec(n); if(!it) continue;
    const nm=reforge(it); const rec=magicRec(nm)||it;
    if(!out.some(o=>o.name===nm)) out.push({name:nm, item:rec, trophy:false});
  }
  return out;
}
function unequipSpoil(name){
  const g=gearState(); if(!name) return;
  for(const s of GEAR_SLOTS) if(g[s]===name){ const it=gearItem(name); g[s]=it&&it.rec?it.rec.name:null; }
  g.wonders=g.wonders.filter(w=>w!==name);
  S.owned=S.owned.filter(w=>w!==name);
}
function equipSpoil(name, level){
  const g=gearState(); const it=gearItem(name); if(!it) return;
  unequipSpoil(S.spoils[level]);
  if(it.kind==="wonder"){ if(!g.wonders.includes(name)){ g.wonders.push(name); if(g.wonders.length>3) g.wonders.shift(); } }
  else if(it.kind==="shield") g.offhand=name;
  else if(it.kind==="armor") g.armor=name;
  else if(it.rec&&it.rec.kind==="ranged") g.ranged=name;
  else g.weapon=name;
  if(!S.owned.includes(name)) S.owned.push(name);
  S.spoils[level]=name;
}
function gearOptions(slot){
  const g=gearState(); const opts=[]; const tr=armorTraining();
  const owned=S.owned.map(gearItem).filter(Boolean);
  if(slot==="armor"){
    AD().filter(a=>a.cat!=="shield").forEach(a=>opts.push({name:a.name, group:tr.has(a.cat)?"Armor":"Armor (untrained)"}));
    owned.filter(i=>i.kind==="armor").forEach(i=>opts.push({name:i.name, group:"Won"}));
  } else if(slot==="offhand"){
    AD().filter(a=>a.cat==="shield").forEach(a=>opts.push({name:a.name, group:"Shield"}));
    WD().filter(w=>w.kind==="melee"&&hasProp(w,"light")).forEach(w=>opts.push({name:w.name, group:weaponProficient(w)?"Light weapon":"Light weapon (not proficient)"}));
    owned.filter(i=>i.kind==="shield"||(i.kind==="weapon"&&i.rec&&hasProp(i.rec,"light"))).forEach(i=>opts.push({name:i.name, group:"Won"}));
  } else {
    const kind=slot==="ranged"?"ranged":"melee";
    WD().filter(w=>w.kind===kind||(kind==="ranged"&&hasProp(w,"thrown"))).forEach(w=>opts.push({name:w.name, group:weaponProficient(w)?(w.cat==="simple"?"Simple":"Martial"):"Not proficient"}));
    owned.filter(i=>i.kind==="weapon"&&i.rec&&(i.rec.kind===kind||(kind==="ranged"&&hasProp(i.rec,"thrown")))).forEach(i=>opts.push({name:i.name, group:"Won"}));
  }
  return opts;
}

function toolDesc(tool){
  const hit=TOOL_DESC.find(([k])=>tool.toLowerCase().includes(k.toLowerCase()));
  return hit?hit[1]:"A specialist's kit; proficiency adds your Proficiency Bonus to checks made with it.";
}

/* ---------------- Creation wizard ---------------- */
const WIZ_STEPS=["Species","Background","Class","Ability Scores","Seal the Pact"];
function wizStepDone(i){
  if(i===0) return !!S.species && speciesChoiceOK();
  if(i===1) return !!S.background && boostsOK();
  if(i===2) return !!S.firstClass && S.classSkills.length===(CLASS_DATA[S.firstClass]?CLASS_DATA[S.firstClass].skills.choose:0);
  if(i===3) return abilitiesOK() && (S.method!=="pointbuy" || pointsSpent()===27);
  return false;
}
function speciesChoiceOK(){
  const sp=SPECIES_DATA.find(s=>s.name===S.species);
  return !sp || !sp.choice || !!S.speciesChoice;
}
function boostsOK(){ return S.boostTriple || (S.boostPlus2 && S.boostPlus1 && S.boostPlus2!==S.boostPlus1); }
function abilitiesOK(){
  if(S.method==="pointbuy") return pointsSpent()<=27;
  if(S.method==="array") return ABILITIES.every(a=>S.arrayAssign[a]!=null) && new Set(Object.values(S.arrayAssign)).size===6;
  return ABILITIES.every(a=>S.rollAssign[a]!=null) && new Set(Object.values(S.rollAssign)).size===6;
}
function pointsSpent(){ return ABILITIES.reduce((t,a)=>t+POINT_COST[S.base[a]],0); }

function renderWizard(){
  const step=S.ui.wizStep;
  return `<div class="panel">
    <div class="wizsteps">${WIZ_STEPS.map((s,i)=>
      `<button class="ws ${i===step?"active":wizStepDone(i)?"done":""}" data-act="wiz" data-a="${i}">${i+1}. ${s}</button>`).join("")}
    </div>
    ${[wizSpecies,wizBackground,wizClass,wizAbilities,wizConfirm][step]()}
    <hr class="orn">
    <div style="display:flex;justify-content:space-between">
      <button class="btn ghost" data-act="wiz" data-a="${Math.max(0,step-1)}" ${step===0?"disabled":""}>← Back</button>
      ${step<4?`<button class="btn primary" data-act="wiz" data-a="${step+1}" ${wizStepDone(step)?"":"disabled"}>Continue →</button>`:""}
    </div>
  </div>`;
}

function wizSpecies(){
  const sp=SPECIES_DATA.find(s=>s.name===S.species);
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
    <h2>Choose Your Species</h2>
    <button class="btn" data-act="surprise" data-tipt="Surprise me" data-tipb="Forge a complete random character in one tap. You can rework every choice afterwards.">🎲 Surprise me</button>
  </div>
  <p class="lede">In the 2024 rules, your species grants traits; ability scores come from your background.</p>
  <div class="cardgrid">${SPECIES_DATA.map(s=>`
    <button class="card ${S.species===s.name?"sel":""}" data-act="species" data-a="${esc(s.name)}" data-tipt="Traits" data-tipb="${s.traits.map(t=>esc(t.name)).join(", ")}.">
      <div class="cname">${esc(s.name)}</div>
      <div class="cmeta">${esc(s.size)} · Speed ${s.speed} ft.</div>
      <div class="cdesc">${esc(SPECIES_FLAVOR[s.name]||s.traits.slice(0,3).map(t=>t.name).join(" · "))}</div>
    </button>`).join("")}
  </div>
  ${sp?`<h3 class="eyebrow">${esc(sp.name)} Traits</h3>
    ${sp.traits.map(t=>`<div class="featline"><span class="fname" data-act="tipfeat" data-a="${esc(t.name)}" data-b="${esc(t.desc)}">${esc(t.name)}</span> <span class="hint">: ${esc(t.desc)}</span></div>`).join("")}
    ${sp.choice?`<h3 class="eyebrow">${esc(sp.choice.label)}</h3>
      <div class="chiprow">${sp.choice.options.map(o=>`<button class="chip ${S.speciesChoice===o.name?"sel":""}" data-act="specchoice" data-a="${esc(o.name)}">${esc(o.name)}</button>`).join("")}</div>
      ${S.speciesChoice?`<p class="hint">${esc((sp.choice.options.find(o=>o.name===S.speciesChoice)||{}).desc||"")}</p>`:""}`:""}`:""}`;
}

function wizBackground(){
  const bg=BACKGROUND_DATA.find(b=>b.name===S.background);
  return `<h2>Choose Your Origin Story</h2>
  <p class="lede">Your background is who you were before the road called: it grants ability score increases, an origin feat, two skills, and a tool.</p>

      <div class="cname">${esc(b.name)}</div>

      <div class="cdesc">${esc(b.desc)}</div>
    </button>`).join("")}
  </div>
  ${bg?`<h3 class="eyebrow">Ability Score Increases</h3>
    <p class="hint">Increase one of ${bg.abilities.map(a=>ABIL_NAMES[a]).join(", ")} by 2 and another by 1, or all three by 1.</p>
    <div class="radiorow">
      <label><input type="radio" name="bm" data-act-change="boostmode" value="21" ${!S.boostTriple?"checked":""}> +2 / +1</label>
