        <div><label class="fld">+1 to</label><div class="chiprow">${bg.abilities.map(a=>`<button class="chip ${S.boostPlus1===a?"sel":""}" data-act="boost1" data-a="${a}" data-tipt="${ABIL_NAMES[a]}" data-tipb="${esc(ABIL_DESC[a])}" ${S.boostPlus2===a?"disabled":""}>${ABIL_NAMES[a]}</button>`).join("")}</div></div>
      </div>
      ${S.boostPlus2?`<p class="hint" style="margin:8px 0 0">+2 ${ABIL_NAMES[S.boostPlus2]}: ${esc(ABIL_DESC[S.boostPlus2])}</p>`:""}
      ${S.boostPlus1?`<p class="hint" style="margin:2px 0 0">+1 ${ABIL_NAMES[S.boostPlus1]}: ${esc(ABIL_DESC[S.boostPlus1])}</p>`:""}`:""}
    <h3 class="eyebrow">Granted by this background</h3>
    <div class="kv"><span>Origin feat</span><b><span class="fname" data-tipt="${esc(bg.feat)}" data-tipb="${esc((FEAT_DATA.origin.find(f=>bg.feat.startsWith(f.name.split(" (")[0]))||{}).desc||"")}">${esc(bg.feat)}</span></b></div>
    <div class="kv"><span>Skills</span><b>${bg.skills.map(sk=>`<span class="fname" data-tipt="${esc(sk)}" data-tipb="${esc(SKILL_DESC[sk]||"")}">${esc(sk)}</span>`).join(", ")}</b></div>
    <div class="kv"><span>Tool</span><b><span class="fname" data-tipt="${esc(bg.tool)}" data-tipb="${esc(toolDesc(bg.tool))}">${esc(bg.tool)}</span></b></div>
    ${S.species==="Human"?humanFeatPicker():""}`:""}`;
}
function humanFeatPicker(){
  const taken=S.background?(BACKGROUND_DATA.find(b=>b.name===S.background)||{}).feat:null;
  const sel=FEAT_DATA.origin.find(f=>f.name===S.humanBonusFeat);
  return `<h3 class="eyebrow">Versatile (Human): bonus origin feat</h3>
  <div class="chiprow">${FEAT_DATA.origin.filter(f=>f.name!==taken).map(f=>
    `<button class="chip ${S.humanBonusFeat===f.name?"sel":""}" data-act="humanfeat" data-a="${esc(f.name)}" data-tipt="${esc(f.name)}" data-tipb="${esc(f.desc)}">${esc(f.name)}</button>`).join("")}</div>
  ${sel?`<p class="hint" style="margin:6px 0 0"><b>${esc(sel.name)}:</b> ${esc(sel.desc)}</p>`:""}`;
}

function wizAbilities(){
  const methods=[["pointbuy","Point Buy (27 pts)"],["array","Standard Array"],["roll","Roll 4d6"]];
  let body="";
  if(S.method==="pointbuy"){
    body=`<p class="hint">Spend up to 27 points. Scores 8–15 before background increases. Spent: <span class="counts">${pointsSpent()} / 27</span></p>
    <div class="abilrow">${ABILITIES.map(a=>`
      <div class="abil"><div class="aname">${a}</div><div class="ascore">${S.base[a]}</div>
      <div class="amod">${fmtMod(Math.floor((S.base[a]-10)/2))}</div>
      <div class="stepper">
        <button data-act="pbdec" data-a="${a}" ${S.base[a]<=8?"disabled":""} aria-label="decrease ${a}">−</button>
        <button data-act="pbinc" data-a="${a}" ${S.base[a]>=15||pointsSpent()+(POINT_COST[S.base[a]+1]-POINT_COST[S.base[a]])>27?"disabled":""} aria-label="increase ${a}">+</button>
      </div></div>`).join("")}</div>`;
  } else if(S.method==="array"){
    body=`<p class="hint">Assign 15, 14, 13, 12, 10, 8; each once.</p>
    <div class="abilrow">${ABILITIES.map(a=>`
      <div class="abil"><div class="aname">${a}</div>
        <select data-act-change="arrayassign" data-a="${a}">
          <option value="">–</option>
          ${STANDARD_ARRAY.map(v=>`<option value="${v}" ${S.arrayAssign[a]===v?"selected":""} ${Object.entries(S.arrayAssign).some(([k,x])=>x===v&&k!==a)?"disabled":""}>${v}</option>`).join("")}
        </select></div>`).join("")}</div>`;
  } else {
    body=`<p class="hint">Roll 4d6, drop the lowest, six times; then assign each result once.</p>
    <button class="btn" data-act="rolldice">⚄ Roll the bones</button>
    ${T.rollPools.length?`<div class="rollpool">${T.rollPools.map(v=>`<div class="die">${v}</div>`).join("")}</div>
    <div class="abilrow">${ABILITIES.map(a=>`
      <div class="abil"><div class="aname">${a}</div>
        <select data-act-change="rollassign" data-a="${a}">
          <option value="">–</option>
          ${T.rollPools.map((v,i)=>`<option value="${i}" ${S.rollAssign[a]===i?"selected":""} ${Object.entries(S.rollAssign).some(([k,x])=>x===i&&k!==a)?"disabled":""}>${v}</option>`).join("")}
        </select></div>`).join("")}</div>`:""}`;
  }
  return `<h2>Determine Ability Scores</h2>
  <p class="lede">Your six ability scores are the raw numbers behind every roll you will ever make: each score's modifier is added to attacks, checks, and saves. Put your best scores where your class needs them${S.firstClass?` (${esc(S.firstClass)}: ${CLASS_DATA[S.firstClass].primary.map(a=>ABIL_NAMES[a]).join(" and ")})`:""}.</p>
  <div class="radiorow">${methods.map(([v,l])=>`<label><input type="radio" name="method" value="${v}" data-act-change="method" ${S.method===v?"checked":""}> ${l}</label>`).join("")}
    ${S.firstClass&&(S.method!=="roll"||T.rollPools.length)?`<button class="btn" data-act="autoscores" data-tipt="Auto-place" data-tipb="Puts your best scores where a ${esc(S.firstClass)} needs them (primary abilities first, then Constitution). You can still adjust everything.">✦ Place scores for a ${esc(S.firstClass)}</button>`:""}</div>
  ${body}
  <h3 class="eyebrow">Final scores (with background increases)</h3>
  <div class="abilrow">${ABILITIES.map(a=>`<div class="abil"><div class="aname">${a}</div><div class="ascore">${previewScore(a)}</div><div class="amod">${fmtMod(Math.floor((previewScore(a)-10)/2))}</div></div>`).join("")}</div>
  <h3 class="eyebrow">What each score does</h3>
  ${ABILITIES.map(a=>`<div class="kv"><span style="white-space:nowrap"><b>${ABIL_NAMES[a]}</b></span><span class="hint" style="text-align:right">${esc(ABIL_DESC[a])}</span></div>`).join("")}`;
}
function previewScore(a){
  let v=S.base[a];
  if(S.method==="array") v=S.arrayAssign[a]||8;
  if(S.method==="roll") v=S.rollAssign[a]!=null?T.rollPools[S.rollAssign[a]]:8;
  return Math.min(20, v+backgroundBoosts()[a]);
}

    ${kitPicker()}`:""}`;

function resourceUsesText(name){
  const R=(window.RESOURCE_USES||{})[name]; if(!R) return null;
  let n=null;
  if(R.byClass){ // same-named feature owned by multiple classes (Channel Divinity): sum acquired
    let total=0;
    for(const cls in R.byClass){
      const lv=classLevels()[cls]||0; if(!lv) continue;
      const bl=R.byClass[cls].byLevel||R.byClass[cls]; let m=null;
      for(const k in bl){ if(+k<=lv) m=bl[k]; }
      if(m) total+=m;
    }
    n=total||null;
  }
  else if(R.byLevel){ const lv=classLevels()[R.owner]||0; for(const k in R.byLevel){ if(+k<=lv) n=R.byLevel[k]; } }
  else if(typeof R.formula==="number") n=R.formula;
  else switch(R.formula){
    case "CHA_MIN1": n=Math.max(1,mod("CHA")); break;
    case "WIS_MIN1": n=Math.max(1,mod("WIS")); break;
    case "INT_MIN1": n=Math.max(1,mod("INT")); break;
    case "PB": n=profBonus(); break;
    case "CLASS_LEVEL": n=classLevels()[R.owner]||0; break;
    case "LEVEL_X5": n=5*(classLevels()[R.owner]||0); break;
  }
  if(n==null||n<=0) return null;
  return {n, pool:!!R.pool, recharge:R.recharge||""};
}

  for(const e of casterEntries()){

    <div class="kv"><span>Save DC <b>${dc}</b></span><span>Spell attack <b>${fmtMod(atk)}</b></span></div>

    ${pN?`<div class="kv"><span>Prepared (max level ${maxL})</span><b class="counts">${ss.prepared.length} / ${pN}</b></div>`:""}

    ${bonus.length?`<div class="eyebrow" style="margin-top:6px">Always prepared (${esc(S.subclasses[e.cls]||"")})</div>${sortedSpellNames(bonus).map(n=>spellLine(n)).join("")}`:""}
    <button class="btn" style="margin-top:6px" data-act="openspells" data-a="${esc(e.cls)}">Manage spells</button>`;
  }
  return html;
}
function spellLine(name,suffix){
  const sp=spellByName(name);
  if(!sp) return `<div class="spell-line">${esc(name)}${suffix||""}</div>`;
  return `<div class="spell-line"><span class="sname" data-act="tipspell" data-a="${esc(name)}">${esc(name)}</span>
    <span class="stag">${sp.level?("L"+sp.level):"cantrip"}${sp.conc?' <span class="tagC">C</span>':""}${sp.ritual?' <span class="tagR">R</span>':""}${suffix||""}</span></div>`;
}
function featsBlock(){
  const bg=BACKGROUND_DATA.find(b=>b.name===S.background);
  const lines=[];
  if(bg) lines.push({name:bg.feat+" (origin)", desc:(FEAT_DATA.origin.find(f=>bg.feat.startsWith(f.name.split(" (")[0]))||{}).desc||"Granted by your background."});
  if(S.humanBonusFeat) lines.push({name:S.humanBonusFeat+" (Human)", desc:(FEAT_DATA.origin.find(f=>f.name===S.humanBonusFeat)||{}).desc||""});
  for(const f of S.feats){
    const all=[...FEAT_DATA.general,...FEAT_DATA.epicBoons,...FEAT_DATA.origin];
    const fd=all.find(x=>x.name===f.name);
    const opt=((S.featChoices[f.slot]||{}).option||[]).join(", ");
    lines.push({name:f.name+(opt?` (${opt})`:"")+(f.boosts?` (${Object.entries(f.boosts).map(([a,n])=>"+"+n+" "+a).join(", ")})`:""), desc:fd?fd.desc:""});
  }
  for(const st of S.fightingStyles){
    const fd=FEAT_DATA.fightingStyles.find(x=>x.name===st);
    lines.push({name:"Fighting Style: "+st, desc:fd?fd.desc:""});
  }
  return lines.length?lines.map(l=>`<div class="featline"><span class="fname" data-act="tipfeat" data-a="${esc(l.name)}" data-b="${esc(l.desc)}">${esc(l.name)}</span></div>`).join(""):`<div class="hint">None yet.</div>`;
}
// A "Subclass Feature" placeholder row sometimes carries real progression info after
// its generic first sentence (e.g. "... Martial Arts die becomes d12."). Extract it.
function placeholderExtra(f){
  // Only "Subclass Feature" rows carry real progression riders; "Choose a Subclass"
  // rows' later sentences are just the subclass roster and must not leak as features.
  if(!/^subclass feature/i.test(f.name)) return null;
  const rest=f.desc.replace(/^[^.]*\.\s*/,"").trim();
  return rest.length>3?rest:null;
}
// "Unarmored Movement rises to +15 feet." -> {name:"Unarmored Movement: +15 feet", desc:rider}
function riderTitle(rider){
  const r=rider.replace(/\.$/,"");
  let m=r.match(/^(.+?) (?:rises to|becomes|increases to|is now|now has|is) (.+)$/i);
  if(m) return `${m[1].replace(/^Your /i,"")}: ${m[2].replace(/ (per rest cycle|from level \d+)$/i,"")}`;
  m=r.match(/^(.+?) (?:rise to|become|increase to) (.+)$/i);
  if(m) return `${m[1].replace(/^Your /i,"")}: ${m[2]}`;
  return r.length>48?r.slice(0,45).replace(/\s+\S*$/,"")+"…":r;
}
function displayFeatures(list){
  // Substitute placeholder class-table rows with the player's actual choices;
  // hide subclass placeholders (real subclass features render on their own) but
  // keep any progression info they carried.
  return list.map(f=>{
    const extra=placeholderExtra(f);
    if(extra) return {...f, name:riderTitle(extra), desc:extra, placeholder:true};
    return f;
  }).filter(f=>f.placeholder||!/subclass/i.test(f.name)).map(f=>{
    if(f.asi||f.epicBoon){
      const feat=S.feats.find(x=>x.slot===("L"+f.charLvl+"#")||x.slot&&x.slot.startsWith("L"+f.charLvl+"#"));
      if(feat){
        const all=[...FEAT_DATA.general,...FEAT_DATA.epicBoons];
        const fd=all.find(x=>x.name===feat.name)||{};
        const boostTxt=feat.boosts?" ("+Object.entries(feat.boosts).map(([a,n])=>"+"+n+" "+a).join(", ")+")":"";
        return {...f, name:(f.epicBoon?"Epic Boon: ":"Feat: ")+feat.name+boostTxt, desc:fd.desc||f.desc};
      }
    }
    if(/fighting style/i.test(f.name)&&S.styleBy[f.charLvl]){
      const st=S.styleBy[f.charLvl];
      const fd=FEAT_DATA.fightingStyles.find(x=>x.name===st)||{};
      return {...f, name:"Fighting Style: "+st, desc:fd.desc||f.desc};
    }
    if(/expertise/i.test(f.name)&&S.expBy&&S.expBy[f.charLvl])
      return {...f, desc:f.desc+" Chosen: "+S.expBy[f.charLvl].join(", ")+"."};
    return f;
  });
}
function featuresBlock(){
  const feats=displayFeatures(acquiredFeatures());

  return feats.map(f=>`<div class="featline"><span class="fname" data-act="tipfeat" data-a="${esc(f.name)}" data-b="${esc(f.desc)}">${esc(f.name)}</span> <span class="flvl">${esc(f.cls)} ${f.lvl}</span></div>`).join("");

function profsBlock(){

/* ---------------- Level-up overlay ---------------- */
function renderLevelUp(){
  const p=S.pending;
  if(p.stage==="pick") return renderClassPick();
  const cd=CLASS_DATA[p.cls];
  const gained=(cd.features[p.classLevel]||[]).map(f=>{
    const extra=placeholderExtra(f);
    return extra?{...f, name:riderTitle(extra), desc:extra, placeholder:true}:f;
  }).filter(f=>f.placeholder||!/subclass/i.test(f.name));
  const scName=S.subclasses[p.cls];
  const scGained=scName&&SUBCLASS_DATA[p.cls][scName]?(SUBCLASS_DATA[p.cls][scName].features[p.classLevel]||[]):[];
  const blocks=p.choices.map((c,i)=>renderChoiceBlock(c,i)).join("");
  const allDone=p.choices.every((c,i)=>c.optional||p.done[i]);
  return `<div class="sheet" role="dialog" aria-label="Level up">
    <h2>Level ${totalLevel()}: ${esc(p.cls)} ${p.classLevel}</h2>
    <p class="lede">Hit points +${Math.floor(cd.hitDie/2)+1}${mod("CON")?` ${fmtMod(mod("CON"))} (CON)`:""}. New features:</p>
    ${[...gained,...scGained].map(f=>`<div class="featline"><span class="fname" data-act="tipfeat" data-a="${esc(f.name)}" data-b="${esc(f.desc)}">${esc(f.name)}</span> <span class="hint">: ${esc(f.desc)}</span></div>`).join("")||`<p class="hint">Steady growth: no new class table features this level.</p>`}
    ${blocks}
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap">
      ${p.fromXP?`<button class="btn ghost" data-act="backlevel">← Choose a different class</button>`:`<span></span>`}
      <span style="display:flex;align-items:center;gap:12px">
        ${(()=>{const rem=p.choices.filter((c,i)=>!c.optional&&!p.done[i]).length;
          return rem?`<span class="nudge" style="margin:0">${rem} choice${rem>1?"s":""} remaining</span>`:`<span class="gains">Ready to seal</span>`;})()}
        <button class="btn primary" data-act="finishlevel" ${allDone?"":"disabled"}>Seal the level</button>
      </span>
    </div>
  </div>`;
}
function renderClassPick(){
  const opts=eligibleClasses();

    <h2>Level ${totalLevel()+1}: Choose Your Path</h2>
    <p class="lede">Continue your training, or multiclass into a new discipline (2024 rules: ability prerequisites apply both ways; combined level caps at 20).</p>
    <div class="cardgrid">${opts.map(o=>{const k=CLASS_DATA[o.cls];const lv=cl[o.cls]||0;return `
      <button class="card ${o.ok?"":"disabled"}" data-act="pickclass" data-a="${esc(o.cls)}" ${o.ok?"":"disabled"}>

        <div class="cmeta">d${k.hitDie} · ${lv?"":("Prereq: "+(prereqText(k.multiclassPrereq)||"none"))}</div>
        ${o.ok?`<div class="cdesc">${nextFeaturePreview(o.cls,(cl[o.cls]||0)+1)}</div>`:`<div class="cdesc">${esc(o.why)}</div>`}

function nextFeaturePreview(cls,lvl){
  const scName=S.subclasses[cls];
  const f=(CLASS_DATA[cls].features[lvl]||[])
    .filter(x=>!(scName&&/subclass feature/i.test(x.name)))   // real subclass feature names replace the pointer
    .map(x=>x.name);
  if(scName&&SUBCLASS_DATA[cls][scName]) f.push(...(SUBCLASS_DATA[cls][scName].features[lvl]||[]).map(x=>x.name));
  return f.length?("Next: "+f.map(esc).join(", ")):"Hit points and steady growth";

function renderChoiceBlock(c,i){
  const done=S.pending.done[i];
  const wrap=(title,inner)=>`<div class="choice-block ${done?"done":""}">
    <span class="ch-status">${done?"Chosen":"Required"}</span>
    <div class="ch-title">${title}</div>${inner}</div>`;
  if(c.kind==="subclass"){
    const subs=SUBCLASS_DATA[c.cls]||{};
    return wrap(`Choose your ${esc(c.cls)} subclass`,
      `<div class="cardgrid" style="margin-top:8px">${Object.keys(subs).map(sn=>`
        <button class="card ${S.subclasses[c.cls]===sn?"sel":""}" data-act="subclass" data-a="${esc(c.cls)}" data-b="${esc(sn)}" data-c="${i}">
          <div class="cname">${esc(sn)}</div><div class="cdesc">${esc(subs[sn].blurb||"")}</div>

  }
  if(c.kind==="asi"||c.kind==="boon"){
    const isBoon=c.kind==="boon";
    const pool=isBoon?FEAT_DATA.epicBoons:FEAT_DATA.general;
    const slotKey="L"+totalLevel()+"#"+i;
    const taken=S.feats.filter(f=>f.slot!==slotKey).map(f=>f.name);
    const options=pool.filter(f=>f.name==="Ability Score Improvement"||!taken.includes(f.name));
    const sel=T.asiFeat[i]||"";
    const fd=options.find(f=>f.name===sel);
    let sub="";
    if(sel==="Ability Score Improvement"){
      sub=`<div class="radiorow" style="margin-top:8px">
        <span class="hint">+1 to:</span>
        <select data-act-change="asiA" data-a="${i}">${ABILITIES.map(a=>`<option ${T.asiA[i]===a?"selected":""}>${a}</option>`).join("")}</select>
        <span class="hint">and +1 to (same = +2):</span>
        <select data-act-change="asiB" data-a="${i}">${ABILITIES.map(a=>`<option ${T.asiB[i]===a?"selected":""}>${a}</option>`).join("")}</select>
      </div>`;
    } else if(fd&&fd.asi){
      const allowed=fd.asi==="ANY"?ABILITIES:fd.asi.split("/");
      sub=`<div class="radiorow" style="margin-top:8px"><span class="hint">Feat's +1 goes to:</span>
        <select data-act-change="featab" data-a="${i}">${allowed.map(a=>`<option ${T.featAb[i]===a?"selected":""}>${a}</option>`).join("")}</select></div>`;
    }
    return wrap(isBoon?"Epic Boon (level 19)":esc(c.label||"Ability Score Improvement or Feat"),
      `<div style="margin-top:8px"><select data-act-change="asifeat" data-a="${i}">
        <option value="">– choose ${isBoon?"a boon":"a feat"} –</option>
        ${options.map(f=>`<option value="${esc(f.name)}" ${sel===f.name?"selected":""}>${esc(f.name)}</option>`).join("")}
      </select>
      ${fd?`<p class="hint" style="margin:6px 0">${fd.prereq?`<i>Prereq: ${esc(fd.prereq)}.</i> `:""}${esc(fd.desc)}</p>`:""}
      ${sub}
      <button class="btn" style="margin-top:8px" data-act="confirmasi" data-a="${i}" ${sel?"":"disabled"}>${done?"Update choice":"Confirm"}</button></div>`);
  }
  if(c.kind==="style"){
    const applied=(S.pending.styleApplied||{})[i];
    const tmp=T.styleTmp[i]||applied||"";
    const fd=FEAT_DATA.fightingStyles.find(x=>x.name===tmp);
    return wrap("Choose a Fighting Style",
      `<div class="chiprow" style="margin-top:8px">${FEAT_DATA.fightingStyles.map(f=>{
        const ownedElsewhere=S.fightingStyles.includes(f.name)&&f.name!==applied;
        return `<button class="chip ${tmp===f.name?"sel":""}" data-act="stylepick" data-a="${esc(f.name)}" data-b="${i}" title="${esc(f.desc)}" ${ownedElsewhere?"disabled":""}>${esc(f.name)}${ownedElsewhere?" ✓":""}</button>`;}).join("")}</div>
      ${fd?`<p class="hint" style="margin:8px 0 0"><b>${esc(fd.name)}:</b> ${esc(fd.desc)}</p>`:`<p class="hint" style="margin:8px 0 0">✓ = already known from another class. Pick a style to see what it does.</p>`}
      <button class="btn" style="margin-top:8px" data-act="confirmstyle" data-a="${i}" ${tmp&&!done?"":"disabled"}>${done?"Chosen":"Confirm"}</button>`);
  }
  if(c.kind==="expertise"){
    const opts=c.restrict?S.skills.filter(sk=>c.restrict.includes(sk)):S.skills;
    return wrap(`Expertise: choose ${c.n} proficient skill${c.n>1?"s":""} to double${c.restrict?" (scholarly skills only)":""}`,
      `<div class="chiprow" style="margin-top:8px">${opts.map(sk=>{
        const already=S.expertise.includes(sk)&&!T.expTmp.includes(sk);
        return `<button class="chip ${T.expTmp.includes(sk)?"sel":""}" data-act="exptoggle" data-a="${esc(sk)}" data-b="${c.n}" ${already?"disabled":""}>${esc(sk)}${already?" ★":""}</button>`;}).join("")}</div>
      <button class="btn" style="margin-top:8px" data-act="confirmexp" data-a="${i}" ${T.expTmp.length===c.n?"":"disabled"}>Confirm</button>`);
  }
  if(c.kind==="arcanum"){
    const ss=spellState(c.cls);
    const chosen=ss.arcanum[c.spellLevel];
    const pool=spellsForList("Warlock",c.spellLevel,c.spellLevel);
    return wrap(`Mystic Arcanum: choose a level ${c.spellLevel} spell`,
      `<div class="chiprow" style="margin-top:8px">${pool.map(sp=>`
        <button class="chip ${chosen===sp.name?"sel":""}" data-act="arcanum" data-a="${esc(c.cls)}" data-b="${esc(sp.name)}" data-c="${i}|${c.spellLevel}" data-tipt="${esc(sp.name)}" data-tipb="${esc(sp.desc)}">${esc(sp.name)}</button>`).join("")}</div>`);

  if(c.kind==="mastery"||c.kind==="signature"){

      masteryPickers(c.cls, c.kind, i)+`<p class="hint" style="margin-top:6px">${c.kind==="mastery"?"You always have these prepared and cast them at their lowest level without a spell slot; swap one on a Long Rest.":"Always prepared; cast each once at level 3 without a slot, recharging on a Short or Long Rest."}</p>`);
  }
  if(c.kind==="options"){
    const def=(window.OPTION_FEATURES||{})[c.key]||{options:[],label:c.key};
    const chosen=optionState(c.key);
    return wrap(`${esc(c.key)}: ${esc(def.label||"choose options")} (${chosen.length} / ${c.total})`,
      optionChips(c.key, c.total, i)+
      `<p class="hint" style="margin-top:6px">Pick until you reach ${c.total}. You can revisit these any time from the sheet's Talents section.</p>`);
  }
  if(c.kind==="featoption"){
    const def=(window.FEAT_OPTIONS||{})[c.feat]||{options:[],n:1};
    const fc=S.featChoices[c.fromSlot]=S.featChoices[c.fromSlot]||{};
    fc.option=fc.option||[];
    return wrap(`${esc(c.feat)}: choose ${def.n>1?def.n:"your"} ${esc(def.label||"option")}`,
      `<div class="chiprow" style="margin-top:8px">${def.options.map(o=>`
        <button class="chip ${fc.option.includes(o.name)?"sel":""}" data-act="featoptpick" data-a="${esc(c.fromSlot)}" data-b="${esc(o.name)}" data-c="${i}|${def.n}" data-tipt="${esc(o.name)}" data-tipb="${esc(o.desc)}">${esc(o.name)}</button>`).join("")}</div>
      ${fc.option.length?`<p class="hint" style="margin-top:6px">${fc.option.map(n=>{const o=def.options.find(x=>x.name===n);return o?`<b>${esc(o.name)}:</b> ${esc(o.desc)}`:esc(n);}).join(" ")}</p>`:""}`);
  }
  if(c.kind==="featskills"){
    const pool=(c.from||Object.keys(SKILL_ABIL)).filter(sk=>!S.skills.includes(sk)||T.fsTmp.includes(sk));
    return wrap(`${esc(c.feat)}: choose ${c.n} new skill proficienc${c.n>1?"ies":"y"}`,
      `<div class="chiprow" style="margin-top:8px">${pool.map(sk=>`<button class="chip ${T.fsTmp.includes(sk)?"sel":""}" data-act="fstoggle" data-a="${esc(sk)}" data-b="${c.n}" data-tipt="${esc(sk)} (${SKILL_ABIL[sk]})" data-tipb="${esc(SKILL_DESC[sk]||"")}">${esc(sk)}</button>`).join("")}</div>
      <button class="btn" style="margin-top:8px" data-act="confirmfs" data-a="${i}" ${T.fsTmp.length===c.n?"":"disabled"}>Confirm</button>`);
  }
  if(c.kind==="savepick"){
    const profs=saveProficiencies();
    return wrap(`${esc(c.feat)}: choose an ability for saving-throw proficiency (the feat's +1 goes there too)`,
      `<div class="chiprow" style="margin-top:8px">${ABILITIES.map(a=>{
        const has=profs.has(a)&&!(S.featChoices[c.fromSlot]&&S.featChoices[c.fromSlot].save===a);
        return `<button class="chip ${S.featChoices[c.fromSlot]&&S.featChoices[c.fromSlot].save===a?"sel":""}" data-act="savepick" data-a="${a}" data-b="${i}" data-tipt="${ABIL_NAMES[a]}" data-tipb="${esc(ABIL_DESC[a])}" ${has?"disabled":""}>${ABIL_NAMES[a]}${has?" ✓":""}</button>`;}).join("")}</div>`);
  }
  if(c.kind==="featspells"){
    return wrap(`${esc(c.feat)}: choose your spells`,
      featPickBlock(c.fromSlot, c.feat));
  }
  if(c.kind==="spoils"){
    return wrap(`Spoils of the adventure (level ${c.level})`, spoilsBlock(c,i));
  }
  if(c.kind==="spells"){
    return `<div class="choice-block done"><span class="ch-status">Optional</span>
      <div class="ch-title">Spellcasting</div>
      <p class="hint" style="margin:6px 0 8px">Your ${esc(c.cls)} spell capacity may have grown. Manage cantrips and prepared spells any time from the sheet.</p>
      <button class="btn" data-act="openspells" data-a="${esc(c.cls)}">Open spellbook</button></div>`;
  }
  return "";
}

/* ---------------- Spell Mastery / Signature pickers ---------------- */
// kind "mastery": one L1 + one L2 pick (Action casting time only); kind "signature": two L3 picks.
// choiceIdx >= 0 marks the pending-level choice done when complete; -1 = spellbook editing.
function masteryPickers(cls, kind, choiceIdx){
  const e=casterEntries().find(x=>x.cls===cls); if(!e) return "";
  const ss=spellState(cls);
  if(kind==="mastery"){
    return [1,2].map(lv=>{
      const pool=spellsForList(e.caster.list,lv,lv).filter(sp=>sp.cast==="Action");
      return `<div class="eyebrow" style="margin-top:8px">Level ${lv} mastery: ${ss.mastery[lv]?esc(ss.mastery[lv]):"none chosen"}</div>
      <div class="chiprow">${pool.map(sp=>`
        <button class="chip ${ss.mastery[lv]===sp.name?"sel":""}" data-act="masterypick" data-a="${esc(cls)}" data-b="${esc(sp.name)}" data-c="${choiceIdx}|${lv}" data-tipt="${esc(sp.name)}" data-tipb="${esc(sp.desc)}">${esc(sp.name)}</button>`).join("")}</div>`;
    }).join("");
  }
  const pool=spellsForList(e.caster.list,3,3);
  return `<div class="eyebrow" style="margin-top:8px">Signature spells: ${ss.signature.length} / 2 chosen</div>
  <div class="chiprow">${pool.map(sp=>`
    <button class="chip ${ss.signature.includes(sp.name)?"sel":""}" data-act="signaturepick" data-a="${esc(cls)}" data-b="${esc(sp.name)}" data-c="${choiceIdx}" data-tipt="${esc(sp.name)}" data-tipb="${esc(sp.desc)}">${esc(sp.name)}</button>`).join("")}</div>`;
}

function talentsBlock(){

/* ---------------- Innate & feat magic ---------------- */
function innateMagicEntries(){
  const out=[];
  const SS=window.SPECIES_SPELLS||{}, FE=window.FEAT_EFFECTS||{};
  const sp=SS[S.species];
  if(sp&&S.created){
    const names=[];
    const collect=m=>{ for(const lv in m){ if(+lv<=totalLevel()) names.push(...m[lv]); } };
    if(sp.base) collect(sp.base);
    if(sp.choices&&S.speciesChoice&&sp.choices[S.speciesChoice]) collect(sp.choices[S.speciesChoice]);
    if(names.length) out.push({source:S.species+(S.speciesChoice?" ("+S.speciesChoice+")":""), ability:sp.ability?("Uses "+sp.ability+" (your choice)"):"", spells:names, note:sp.note||""});
  }
  const featList=[];
  const bg=S.created&&BACKGROUND_DATA.find(b=>b.name===S.background);
  if(bg) featList.push({name:bg.feat, key:"bg"});
  if(S.humanBonusFeat&&S.created) featList.push({name:S.humanBonusFeat, key:"human"});
  for(const f of S.feats) featList.push({name:f.name, key:f.slot});
  for(const fl of featList){
    const eff=FE[fl.name]; if(!eff||(!eff.spells&&!eff.spellPick)) continue;
    const picked=S.featChoices[fl.key]||{};
    const names=[...(eff.spells||[]), ...(picked.cantrips||[]), ...(picked.spells||[])];
    out.push({source:fl.name, ability:eff.spellPick?(eff.spellPick.abilityNote||""):"", spells:names, pick:eff.spellPick||null, key:fl.key, note:eff.note||""});
  }
  // subclass features that teach spells (e.g. Lore Bard's Magical Discoveries)
  for(const fname in FEATURE_SPELL_GRANTS){
    if(!acquiredFeatures().some(f=>f.name===fname)) continue;
    const key="feature:"+fname;
    const pick=pickConfigFor(fname);
    const picked=S.featChoices[key]||{};
    out.push({source:fname, ability:pick&&pick.abilityNote||"", spells:[...(picked.cantrips||[]),...(picked.spells||[])], pick, key, note:""});
  }
  return out;
}
function featPickPools(pick){
  const inList=sp=> pick.lists? sp.classes.some(c=>pick.lists.includes(c))
    : pick.list? sp.classes.includes(pick.list)
    : pick.schools? pick.schools.includes(sp.school) : true;
  const byName=(a,b)=>(a.level-b.level)||a.name.localeCompare(b.name);
  const minLvl=pick.includeCantrips?0:1;
  return {
    cantrips: pick.cantrips? SPELL_DATA.filter(sp=>sp.level===0&&inList(sp)).sort(byName):[],
    spells: pick.spells? SPELL_DATA.filter(sp=>sp.level>=minLvl&&sp.level<=(pick.maxLevel||1)&&inList(sp)).sort(byName):[]
  };
}
function featPickBlock(key, featName){
  const pick=pickConfigFor(featName); if(!pick) return "";
  const pools=featPickPools(pick);
  const fc=S.featChoices[key]=S.featChoices[key]||{};
  fc.cantrips=fc.cantrips||[]; fc.spells=fc.spells||[];
  let html="";
  if(pick.cantrips) html+=`<div class="eyebrow" style="margin-top:8px">Cantrips (${fc.cantrips.length} / ${pick.cantrips})</div>
    <div class="chiprow">${pools.cantrips.map(sp=>`<button class="chip ${fc.cantrips.includes(sp.name)?"sel":""}" data-act="featpicksp" data-a="${esc(key)}" data-b="${esc(sp.name)}" data-c="cantrips|${pick.cantrips}" data-tipt="${esc(sp.name)}" data-tipb="${esc(sp.desc)}">${esc(sp.name)}</button>`).join("")}</div>`;
  if(pick.spells) html+=`<div class="eyebrow" style="margin-top:8px">${pick.includeCantrips?"Cantrips or spells":"Spells"} up to level ${pick.maxLevel||1} (${fc.spells.length} / ${pick.spells})</div>
    <div class="chiprow">${pools.spells.map(sp=>`<button class="chip ${fc.spells.includes(sp.name)?"sel":""}" data-act="featpicksp" data-a="${esc(key)}" data-b="${esc(sp.name)}" data-c="spells|${pick.spells}" data-tipt="${esc(sp.name)}" data-tipb="${esc(sp.desc)}">${esc(sp.name)}</button>`).join("")}</div>`;
  if(pick.abilityNote) html+=`<p class="hint" style="margin-top:6px">Spellcasting ability: ${esc(pick.abilityNote)}.</p>`;
  return html;
}
function featPickComplete(key, featName){
  const pick=pickConfigFor(featName); if(!pick) return true;
  const fc=S.featChoices[key]||{};
  return (fc.cantrips||[]).length===(pick.cantrips||0)&&(fc.spells||[]).length===(pick.spells||0);
}
function featPickMissing(key, featName){
  const pick=pickConfigFor(featName); if(!pick) return null;
  const fc=S.featChoices[key]||{};
  const mc=(pick.cantrips||0)-(fc.cantrips||[]).length;
  const ms=(pick.spells||0)-(fc.spells||[]).length;
  if(mc<=0&&ms<=0) return null;
  const bits=[];
  if(mc>0) bits.push(mc+" cantrip"+(mc>1?"s":""));
  if(ms>0) bits.push(ms+" spell"+(ms>1?"s":""));
  return bits.join(" and ");
}
function openFeatPick(key, featName){
  T.featPick={key, name:featName};
  const m=$("#tipmodal");
  m.classList.remove("hidden");
  const missing=featPickMissing(key, featName);
  m.innerHTML=`<div class="modalwrap"><div class="sheet" role="dialog">
    <h2>${esc(featName)}</h2>
    ${featPickBlock(key, featName)}
    ${missing?`<div class="nudge" style="margin-top:8px">${esc(missing)} still to choose</div>`:`<div class="gains" style="margin-top:8px">✓ All spells chosen</div>`}
    <div style="text-align:right;margin-top:10px"><button class="btn primary" data-act="closetip">Done</button></div>
  </div></div>`;
}
function revertFeatChoices(slotKey){
  const fc=S.featChoices[slotKey]; if(!fc) return;
  if(fc.skills) S.skills=S.skills.filter(sk=>!fc.skills.includes(sk));
  if(fc.expertise) S.expertise=S.expertise.filter(sk=>!fc.expertise.includes(sk));
  if(fc.save) S.savePicks=S.savePicks.filter(a=>a!==fc.save);
  if(fc.saves) S.savePicks=S.savePicks.filter(a=>!fc.saves.includes(a));
  delete S.featChoices[slotKey];
}
function attachFeatSubChoices(featName, slotKey){
  revertFeatChoices(slotKey);
  if(S.pending) S.pending.choices=S.pending.choices.filter(c=>c.fromSlot!==slotKey);
  const eff=(window.FEAT_EFFECTS||{})[featName]||{};
  const add=[];
  if(eff.skills&&eff.skills.all){
    const gained=Object.keys(SKILL_ABIL).filter(sk=>!S.skills.includes(sk));
    S.skills.push(...gained);
    (S.featChoices[slotKey]=S.featChoices[slotKey]||{}).skills=gained;
  }
  if(eff.skills&&eff.skills.choose) add.push({kind:"featskills", n:eff.skills.choose, from:eff.skills.from||null, fromSlot:slotKey, feat:featName});
  if(eff.expertise&&eff.expertise.choose){
    const avail=S.skills.filter(sk=>!S.expertise.includes(sk)).length;
    if(avail>0) add.push({kind:"expertise", n:Math.min(eff.expertise.choose,avail), fromSlot:slotKey, cls:S.pending?S.pending.cls:S.firstClass});
  }
  if(eff.saves){
    const grant=(eff.saves[0]==="ALL"?ABILITIES:eff.saves).filter(a=>!S.savePicks.includes(a));
    S.savePicks.push(...grant);
    (S.featChoices[slotKey]=S.featChoices[slotKey]||{}).saves=grant;
  }
  if(eff.savePick) add.push({kind:"savepick", fromSlot:slotKey, feat:featName});
  if(eff.spellPick) add.push({kind:"featspells", fromSlot:slotKey, feat:featName});
  if((window.FEAT_OPTIONS||{})[featName]) add.push({kind:"featoption", fromSlot:slotKey, feat:featName});
  if(add.length&&S.pending) S.pending.choices=[...S.pending.choices, ...add];
}

function provingPanel(){
  const pg=provingGround(); const all=window.MONSTER_DATA||[];
  const picker=all.length?`<div class="pgpick">${pg.cols.map((c,i)=>`<select data-act-change="pgpick" data-a="${i}" aria-label="Benchmark ${i+1}">${[1,2,3,4].map(t=>`<optgroup label="Tier ${t} (levels ${t===1?"1–4":t===2?"5–10":t===3?"11–16":"17–20"})">${all.filter(m=>m.tier===t).sort((a,b)=>a.cr-b.cr).map(m=>`<option value="${esc(m.name)}" ${c.label===m.name?"selected":""}>${esc(m.name)} (CR ${m.cr})</option>`).join("")}</optgroup>`).join("")}</select>`).join("")}</div>`:"";
  const verdicts=pg.cols.map((c,i)=>{ if(!c.m) return ""; const best=pg.rows.reduce((b,r)=>(!b||r.cells[i].dpr>b.cells[i].dpr)?r:b,null); const you=best&&best.cells[i].rounds, it=pg.threat[i].rounds;
    const call=you==null?"":(it==null?"it cannot hurt you":you<it?"you win":you>it?"it wins":"a coin flip");
    return `<div class="featline"><span class="fname" data-act="tipfeat" data-a="${esc(c.m.name)}" data-b="${esc((c.m.desc||"")+" CR "+c.m.cr+", AC "+c.ac+", "+c.hp+" HP.")}">${esc(c.m.name)}</span> <span class="hint">${you!=null?`you fell it in ${you} round${you>1?"s":""}`:"you cannot hurt it"}${it!=null?`, it drops you in ${it}`:""}${call?` · <b>${call}</b>`:""}</span></div>`; }).join("");
  return `<h3 class="eyebrow">Proving Ground</h3>
  <p class="hint">${all.length?`Expected results against three benchmark creatures from your tier (swap any of them). Averages assume every attack goes at one target and once-per-turn extras land on the first hit; legendary and lair actions are ignored. Casters are measured on their best cantrip only, so leveled spells will make them stronger than this reads.`:`Expected results against AC ${PG_AC.join(" / ")}.`}</p>
  ${picker}
  <div style="overflow-x:auto"><table class="mini"><tr><th>Attack routine</th>${pg.cols.map(c=>`<th>${esc(c.label)}${c.hp?`<span class="hint" style="display:block;font-weight:400;letter-spacing:0;text-transform:none">AC ${c.ac} · ${c.hp} HP</span>`:""}</th>`).join("")}</tr>
  ${pg.rows.map(r=>`<tr><td>${esc(r.label)}</td>${r.cells.map(c=>`<td><b>${Math.round(c.dpr*10)/10}</b> <span class="hint">/ round · ${Math.round(c.hit*100)}% ${c.save?"fail":"hit"}${c.rounds?` · ${c.rounds} rd`:""}</span></td>`).join("")}</tr>`).join("")||`<tr><td colspan="4" class="hint">No weapon or damaging cantrip equipped yet.</td></tr>`}
  <tr><td>Its round against you (AC ${pg.ac}, ${pg.hp} HP)</td>${pg.threat.map(t=>t.dpr!=null?`<td><b>${Math.round(t.dpr*10)/10}</b> <span class="hint">/ round${t.rounds?` · ${t.rounds} rd`:""}</span></td>`:`<td><b>${t.ehp}</b> <span class="hint">effective HP</span></td>`).join("")}</tr></table></div>
  ${verdicts}`;
}
function renderAnalysis(){
  const cl=classLevels(), L=totalLevel();
  const order=classOrder();
  const primary=order[0]?CLASS_DATA[order[0]].primary:[];
  const bestAtk=Math.max(...(primary.length?primary:["STR"]).map(a=>mod(a)))+profBonus();
  const casters=casterEntries();
  const roles=order.map(c=>CLASS_ROLES[c]);
  const multiclass=order.length>1;
  const need=new Set(); order.forEach(c=>CLASS_DATA[c].primary.forEach(a=>need.add(a)));
  const weak=[...need].filter(a=>abilityScore(a)<14);
  const milestones=order.map(c=>{
    const nl=(cl[c]||0)+1; if(nl>20) return null;
    const f=(CLASS_DATA[c].features[nl]||[]).map(x=>x.name);
    const scN=S.subclasses[c]; if(scN&&SUBCLASS_DATA[c][scN]) f.push(...(SUBCLASS_DATA[c][scN].features[nl]||[]).map(x=>x.name));
    return f.length?`${c} ${nl}: ${f.join(", ")}`:null;
  }).filter(Boolean);
  const highest=order.reduce((a,b)=>(cl[a]>=cl[b]?a:b), order[0]);
  // Data-driven spec reading
  const prof=buildTagProfile();
  const ranked=Object.entries(prof).sort((a,b)=>b[1]-a[1]);
  const featNotes=[...S.feats.map(f=>f.name),S.humanBonusFeat].filter(Boolean).map(n=>FEAT_NOTES[n]).filter(Boolean);
  let specLine;
  if(ranked.length>=2 && ranked[0][1]>3){
    const top=ranked.slice(0,2).map(r=>r[0]);
    const phrases=ranked.slice(0,3).map(r=>TAG_PHRASES[r[0]]).filter(Boolean);
    specLine=`This build is currently specced as a <b>${esc(ROLE_WORDS[top[0]]||top[0])}/${esc(ROLE_WORDS[top[1]]||top[1])}</b>, focusing on ${esc(phrases.slice(0,-1).join(", "))}${phrases.length>1?" and "+esc(phrases[phrases.length-1]):""}.`;
  } else if(casters.length){
    specLine=`The spellbook is still thin. Prepare more spells and this reading will sharpen.`;
  } else {
    specLine=`A pure martial spec: the story is told in weapons, feats, and features rather than spells${featNotes.length?", currently leaning on "+esc(featNotes.slice(0,3).join(", "))+"":""}.`;
  }
  const sigs=ranked.length?signatureSpells(ranked.slice(0,2).map(r=>r[0])):[];
  return `<div class="panel">
    <h2>Reading the Build: ${esc(S.name)}, Level ${L}</h2>
    <p class="lede">${esc(S.name)} is ${roles.length>1?`a hybrid of ${roles.map(r=>r.role).join(" and ")}`:`a ${roles[0]?roles[0].role:"wanderer"}`}, ${esc(S.species)} blood, shaped by a past as a ${esc((S.background||"").toLowerCase())}.</p>
    <p>${specLine}</p>
    ${sigs.length?`<p class="hint">Signature magic: ${sigs.map(n=>`<span class="sname" data-act="tipspell" data-a="${esc(n)}">${esc(n)}</span>`).join(" · ")}</p>`:""}
    ${featNotes.length&&casters.length?`<p class="hint">Feat leanings: ${esc(featNotes.slice(0,4).join(", "))}.</p>`:""}
    <div class="anagrid">
      <div class="panel" style="box-shadow:none">
        <h3 class="eyebrow">Strengths</h3>
        <div class="ana-stat">
        ${ABILITIES.filter(a=>abilityScore(a)>=16).map(a=>`<div class="kv"><span>${ABIL_NAMES[a]}</span><b>${abilityScore(a)} (${fmtMod(mod(a))})</b></div>`).join("")||"<div class='hint'>No score above 15 yet, a generalist's spread.</div>"}
        <div class="kv"><span>Primary attacks</span><b>~${fmtMod(bestAtk)} to hit</b></div>
        ${casters.map(e=>`<div class="kv"><span>${esc(e.label)}</span><b>Save DC ${8+profBonus()+mod(e.caster.ability)} · Atk ${fmtMod(profBonus()+mod(e.caster.ability))}</b></div>`).join("")}
        <div class="kv"><span>Staying power</span><b>${maxHP()} HP</b></div>
        </div>
      </div>
      <div class="panel" style="box-shadow:none">
        <h3 class="eyebrow">Watch for</h3>
        <div class="ana-stat">
          ${weak.length?`<p class="hint">Key abilities below 14: ${weak.map(a=>ABIL_NAMES[a]).join(", ")}; ${multiclass?"multiclass builds pay for breadth; consider your next ASI carefully":"an ASI here will pay off"}.</p>`:`<p class="hint">Your key abilities are in strong shape.</p>`}
          ${multiclass&&casters.length?`<p class="hint">Multiclass casting: shared slots come from the combined table, but each class prepares spells as if single-classed: your top-end spells arrive later than a pure caster's.</p>`:""}
          ${multiclass&&L>=5&&!acquiredFeatures().some(f=>/extra attack/i.test(f.name))&&order.some(c=>["Fighter","Paladin","Ranger","Barbarian","Monk","Rogue"].includes(c))?`<p class="hint">No Extra Attack yet at level ${L}: martial dips delay the level-5 power spike.</p>`:""}
          ${L<20?`<p class="hint">Capstones and epic boons land at 19–20; ${20-L} level${20-L>1?"s":""} of headroom remain.</p>`:`<p class="hint">Fully realized. There is nothing left to take, only stories left to tell.</p>`}
        </div>
      </div>
    </div>
    ${provingPanel()}
    <h3 class="eyebrow">How ${esc(S.name)} fights</h3>
    ${order.map(c=>`<p>${multiclass?"<b>"+esc(c)+" ("+cl[c]+"):</b> ":""}As a ${esc(c.toLowerCase())}${S.subclasses[c]?` of the ${esc(S.subclasses[c])}`:""}, ${esc(S.name)} favors ${CLASS_ROLES[c].style}.${S.subclasses[c]&&SUBCLASS_DATA[c][S.subclasses[c]]?" "+esc(SUBCLASS_DATA[c][S.subclasses[c]].blurb||""):""}</p>`).join("")}
    ${multiclass?`<p><b>The blend:</b> the ${esc(order.map(c=>c+" "+cl[c]).join(" / "))} recipe trades ${esc(highest)}'s top-end features for flexibility; the ${esc(order.filter(c=>c!==highest).join(" and "))} seasoning changes the action economy round to round. Whether it sings at a real table depends on how often each piece comes online in a typical fight.</p>`:""}
    ${milestones.length?`<h3 class="eyebrow">Next on the horizon</h3>${milestones.map(m=>`<div class="featline">▸ ${esc(m)}</div>`).join("")}`:""}
  </div>`;
}

function renderGlossary(){
  const data=window.GLOSSARY_DATA||[];
  const cats=[...new Set(data.map(g=>g.cat))];
  const q=T.glossQ.toLowerCase(), cat=T.glossCat;
  const list=data.filter(g=>(cat==="all"||g.cat===cat)&&(!q||g.term.toLowerCase().includes(q)||g.def.toLowerCase().includes(q)))
    .sort((a,b)=>a.term.localeCompare(b.term,undefined,{numeric:true}));
  return `<div class="panel">
    <h2>Glossary of the Table</h2>
    <p class="lede">The rules vocabulary of the 2024 game.</p>
    <div class="spellpick-controls">
      <input type="text" placeholder="Search terms…" value="${esc(T.glossQ)}" data-act-input="glossq">
      <select data-act-change="glosscat">
        <option value="all">All categories</option>
        ${cats.map(c=>`<option value="${esc(c)}" ${cat===c?"selected":""}>${esc(c)}</option>`).join("")}
      </select>
      <span class="hint">${list.length} shown</span>
    </div>
    <div class="glosslist">
      ${list.map(g=>`<div class="glossentry"><span class="gterm">${esc(g.term)}</span><span class="gcat">${esc(g.cat)}</span><div class="gdef">${esc(g.def)}</div></div>`).join("")||`<p class="hint">No terms match.</p>`}
    </div>
  </div>`;
}

    ``,`## Gear`, GEAR_SLOTS.map(s=>gearState()[s]).filter(Boolean).concat(gearState().wonders).join(", ")||"–",
    ``,`## Skills`, S.skills.map(s=>s+(S.expertise.includes(s)?" (expertise)":"")).join(", ")||"–",

  ];
  for(const e of acquiredOptionFeatures()){

    const ss=spellState(e.cls);

    lines.push("",`## ${e.label} spells`,
      ss.cantrips.length?("Cantrips: "+sortedSpellNames(ss.cantrips).join(", ")):"",
      ss.prepared.length?("Prepared: "+sortedSpellNames(ss.prepared).join(", ")):"",
      Object.values(ss.arcanum).filter(Boolean).length?("Arcanum: "+Object.values(ss.arcanum).filter(Boolean).join(", ")):"",
      masteryVals.length?("Spell Mastery: "+masteryVals.join(", ")):"",
      (ss.signature||[]).length?("Signature Spells: "+ss.signature.join(", ")):"");
  }
  const text=lines.filter(x=>x!==null).join("\n");
  const m=$("#tipmodal");
  m.classList.remove("hidden");
  m.innerHTML=`<div class="modalwrap"><div class="sheet" role="dialog">
    <h2>Build Summary</h2><p class="hint">Select all and copy; paste it anywhere.</p>
    <textarea style="width:100%;height:300px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px ui-monospace,monospace">${esc(text)}</textarea>
    <div style="text-align:right;margin-top:10px"><button class="btn" data-act="copytext">Copy</button> <button class="btn primary" data-act="closetip">Close</button></div>
  </div></div>`;
}

/* ---------------- Level flow ---------------- */
function forgeCharacter(){
  if(S.method==="array") ABILITIES.forEach(a=>{S.base[a]=S.arrayAssign[a];});
  if(S.method==="roll") ABILITIES.forEach(a=>{S.base[a]=T.rollPools[S.rollAssign[a]];});
  const bg=BACKGROUND_DATA.find(b=>b.name===S.background);
  S.skills=[...new Set([...(bg?bg.skills:[]), ...S.classSkills])];
  S.created=true;
  applyKit();
  resetTemp();
  S.levelSeq=[S.firstClass];
  S.xp=0;
  S.log.push({level:1, title:"The First Page", text:"Every legend starts with a name and a first step on the road. "+S.name+" just took both.", gains:S.firstClass+" 1"});
  const ch=pendingChoicesFor(S.firstClass,1);
  if(ch.length){ S.pending={cls:S.firstClass, classLevel:1, choices:ch, done:{}, fromXP:false}; }
  S.ui.tab="sheet";
  render();
}
function gainXP(){
  const L=totalLevel();
  if(L>=20) return;
  T.hpBefore=maxHP();
  T.levelSnap=JSON.stringify({...S, prevSnap:null, undoStack:[]});
  const newLevel=L+1;
  S.xp=XP_THRESHOLDS[newLevel-1];
  const v=pickVignette(newLevel);
  T.lastVignette=v;
  S.log.push({level:newLevel, title:v.t, text:v.x, gains:""});
  S.pending={stage:"pick"};
  render();
}
function restoreSnap(){
  if(!T.levelSnap) return false;
  S=Object.assign(freshState(), JSON.parse(T.levelSnap));
  return true;
}
function backToClassPick(){
  const keep=T.lastVignette;
  if(!restoreSnap()){ S.pending=null; render(); return; }
  const newLevel=totalLevel()+1;
  S.xp=XP_THRESHOLDS[newLevel-1];
  if(keep) S.log.push({level:newLevel, title:keep.t, text:keep.x, gains:""});
  S.pending={stage:"pick"};
  T.asiFeat={}; T.asiA={}; T.asiB={}; T.featAb={}; T.expTmp=[];
  render();
}
function applyLevel(cls){
  S.levelSeq.push(cls);
  const newCl=classLevels()[cls];
  S.pending={cls, classLevel:newCl, choices:pendingChoicesFor(cls,newCl), done:{}, fromXP:true};
  // spoils default to the obvious upgrade so sealing is never blocked by loot
  S.pending.choices.forEach((c,i)=>{ if(c.kind==="spoils"){ const o=spoilsOffer(c.level); if(o.length){ equipSpoil(o[0].name,c.level); S.pending.done[i]=true; } else S.pending.done[i]=true; } });
}
function finishLevel(){
  const p=S.pending;
  const last=S.log[S.log.length-1];
  if(last&&p.cls){
    const cd=CLASS_DATA[p.cls], L=totalLevel();
    const bits=[`${p.cls} ${p.classLevel}`+(S.subclasses[p.cls]&&p.classLevel===cd.subclassLevel?` (${S.subclasses[p.cls]})`:"")];
    const names=(cd.features[p.classLevel]||[]).filter(f=>!f.asi&&!f.epicBoon&&!/subclass/i.test(f.name)).map(f=>f.name);
    const sc=S.subclasses[p.cls]&&SUBCLASS_DATA[p.cls][S.subclasses[p.cls]];
    if(sc) names.push(...(sc.features[p.classLevel]||[]).map(f=>f.name));
    if(names.length) bits.push(names.join(", "));
    S.feats.filter(f=>f.slot&&f.slot.startsWith("L"+L+"#")).forEach(f=>bits.push((f.cat==="epicBoons"?"Boon: ":"Feat: ")+f.name));
    if(S.styleBy[L]) bits.push("Style: "+S.styleBy[L]);
    if(T.hpBefore!=null){ const d=maxHP()-T.hpBefore; if(d) bits.push((d>0?"+":"")+d+" HP"); }
    last.gains=bits.join(" · ");
  }
  if(p.fromXP&&T.levelSnap){ S.undoStack=[...(S.undoStack||[]), T.levelSnap].slice(-UNDO_MAX); S.prevSnap=T.levelSnap; }
  if(totalLevel()===20&&!S.archivedAt20){
    const r=stashToVault(S,"Maxed at 20");
    if(r.ok) S.archivedAt20=true;
  }
  if(totalLevel()===20&&!S.celebrated20){ S.celebrated20=true; T.legendForged=true; }
  S.pending=null;
  T.levelSnap=null;
  T.asiFeat={}; T.asiA={}; T.asiB={}; T.featAb={}; T.expTmp=[]; T.styleTmp={};
  render();
  // signature motion: HP counts up to its new value on the sheet
  const hpEl=document.querySelector(".sheethead .stat .sv");
  if(hpEl&&T.hpBefore!=null) animateCount(hpEl, T.hpBefore, maxHP(), 700);
  T.hpBefore=null;
}
function animateCount(el, from, to, ms){
  if(!el||from===to) return;
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=to; return; } }catch(e){}
  const t0=performance.now();
  const step=t=>{
    const p=Math.min(1,(t-t0)/ms);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function recomputePendingChoices(){
  const p=S.pending;
  const fresh=pendingChoicesFor(p.cls,p.classLevel);
  const done={};
  fresh.forEach((c,i)=>{
    if(c.kind==="subclass"&&S.subclasses[c.cls]){ done[i]=true; return; }
    const oldIdx=p.choices.findIndex((oc,j)=>oc.kind===c.kind&&p.done[j]);
    if(oldIdx>=0) done[i]=true;
  });
  S.pending={...p, choices:fresh, done};
  return fresh;
}
function confirmAsi(i){
  const sel=T.asiFeat[i]; if(!sel) return;
  const c=S.pending.choices[i];
  const isBoon=c.kind==="boon";
  const pool=isBoon?FEAT_DATA.epicBoons:FEAT_DATA.general;
  const fd=pool.find(f=>f.name===sel);
  S.feats=S.feats.filter(f=>f.slot!==("L"+totalLevel()+"#"+i));
  let boosts=null;
  if(sel==="Ability Score Improvement"){
    const A=T.asiA[i]||"STR", B=T.asiB[i]||"STR";
    boosts={}; boosts[A]=(boosts[A]||0)+1; boosts[B]=(boosts[B]||0)+1;
  } else if(fd&&fd.asi){
    const allowed=fd.asi==="ANY"?ABILITIES:fd.asi.split("/");
    const ab=T.featAb[i]||allowed[0];
    boosts={}; boosts[ab]=1;
  }
  S.feats.push({name:sel, cat:isBoon?"epicBoons":"general", boosts, slot:"L"+totalLevel()+"#"+i});
  S.pending.done[i]=true;
  attachFeatSubChoices(sel, "L"+totalLevel()+"#"+i);
  render();
}
function toggleSpell(name, on){
  const cls=T.spellTarget; if(!cls) return;
  const e=casterEntries().find(x=>x.cls===cls); if(!e) return;
  const ss=spellState(cls);
  const sp=spellByName(name); if(!sp) return;
  const arr=sp.level===0?ss.cantrips:ss.prepared;
  const limit=sp.level===0?(e.caster.cantrips[e.classLevel-1]||0):(e.caster.prepared[e.classLevel-1]||0);
  if(on){ if(!arr.includes(name)&&arr.length<limit) arr.push(name); }
  else { const ix=arr.indexOf(name); if(ix>=0) arr.splice(ix,1); }
  // render() rebuilds the whole app (including the modal container), so preserve
  // the spell list's scroll position across the rebuild
  const list=document.querySelector("#spellmodal .spellpick-list");
  const keep=list?list.scrollTop:0;
  render();
  renderSpellModal();
  const nl=document.querySelector("#spellmodal .spellpick-list");
  if(nl) nl.scrollTop=keep;
}
function doReset(){
  S=freshState(); resetTemp();
  try{localStorage.removeItem("forge-fate");localStorage.removeItem("vellum-valor");}catch(e){}
  render();
}
function composeBackstory(){
  const BD=window.BACKSTORY_DATA||{}; if(!BD.origins) return "";
  const R=a=>a&&a.length?a[Math.floor(Math.random()*a.length)]:"";
  const cls=S.firstClass||classOrder()[0];
  const parts=[R(BD.origins[S.species]||[]), R(BD.youths[S.background]||[]), R(BD.turns||[]), R((BD.purposes||{})[cls]||[])];
  const sub=cls&&S.subclasses[cls];
  if(sub&&BD.twists&&BD.twists[sub]) parts.push(BD.twists[sub]);
  return parts.filter(Boolean).join(" ");
}
function surpriseMe(){
  const R=a=>a[Math.floor(Math.random()*a.length)];
  S=freshState(); resetTemp();
  const sp=R(SPECIES_DATA); S.species=sp.name;
  if(sp.choice) S.speciesChoice=R(sp.choice.options).name;
  const cls=R(Object.keys(CLASS_DATA)); S.firstClass=cls;
  const cd=CLASS_DATA[cls], prim=cd.primary;
  const bgs=BACKGROUND_DATA.filter(b=>b.abilities.includes(prim[0]));
  const bg=R(bgs.length?bgs:BACKGROUND_DATA); S.background=bg.name;
  S.boostPlus2=bg.abilities.includes(prim[0])?prim[0]:bg.abilities[0];
  const b1pool=bg.abilities.filter(a=>a!==S.boostPlus2);
  S.boostPlus1=b1pool.includes("CON")?"CON":R(b1pool);
  if(S.species==="Human") S.humanBonusFeat=R(FEAT_DATA.origin.filter(f=>f.name!==bg.feat)).name;
  S.method="array";
  const order=[...prim,"CON","DEX","WIS","STR","INT","CHA"].filter((a,i,arr)=>arr.indexOf(a)===i);
  ABILITIES.forEach(a=>{ if(!order.includes(a)) order.push(a); });
  S.arrayAssign={}; STANDARD_ARRAY.forEach((v,i)=>{ S.arrayAssign[order[i]]=v; });
  S.classSkills=[];
  const pool=cd.skills.from.filter(sk=>!bg.skills.includes(sk));
  while(S.classSkills.length<cd.skills.choose&&pool.length) S.classSkills.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while(S.classSkills.length<cd.skills.choose){ const k=R(cd.skills.from); if(!S.classSkills.includes(k)) S.classSkills.push(k); }
  const nd=window.NAME_DATA||{given:{},family:{},epithets:[]};
  const spn=nd.given[S.species]?S.species:Object.keys(nd.given)[0];
  const g=spn?R(nd.given[spn]):"Hero";
  const roll=Math.random();
  S.name=(roll<0.6&&nd.family[spn]?g+" "+R(nd.family[spn]):roll<0.85&&(nd.epithets||[]).length?g+" "+R(nd.epithets):g).trim();
  const BD=window.BACKSTORY_DATA||{};
  if(BD.hooks) S.flavor.hook=R(BD.hooks);
  if(BD.alignments) S.flavor.alignment=R(Object.keys(BD.alignments));
  S.flavor.backstory=composeBackstory();
  { const kits=kitsFor(cls); if(kits.length) S.kit=R(kits).name; }
  forgeCharacter();
  if(S.pending){
    S.pending.choices.forEach((c,i)=>{
      if(c.kind==="style"){ const st=R(FEAT_DATA.fightingStyles).name; if(!S.fightingStyles.includes(st)) S.fightingStyles.push(st); S.styleBy[1]=st; S.pending.styleApplied={[i]:st}; S.pending.done[i]=true; }
      if(c.kind==="expertise"){ const opts=S.skills.filter(sk=>!S.expertise.includes(sk)); const picks=[]; while(picks.length<c.n&&opts.length) picks.push(opts.splice(Math.floor(Math.random()*opts.length),1)[0]); S.expertise.push(...picks); S.expBy[1]=picks; S.pending.done[i]=true; }
    });
    if(S.pending.choices.every((c,i)=>c.optional||S.pending.done[i])) finishLevel(); else render();
  }
  showSurpriseSummary();
}
function showSurpriseSummary(){
  const m=$("#tipmodal");
  m.classList.remove("hidden");
  m.innerHTML=`<div class="modalwrap reveal-wrap"><div class="sheet narrow reveal-sheet" role="dialog" aria-label="Your randomized character">
    <div class="eyebrow">The dice have spoken</div>
    <h2 class="reveal-name">${esc(S.name)}</h2>
    <div class="kv"><span>Species</span><b>${esc(S.species)}${S.speciesChoice?" ("+esc(S.speciesChoice)+")":""}</b></div>
    <div class="kv"><span>Background</span><b>${esc(S.background)}</b></div>
    <div class="kv"><span>Class</span><b>${esc(S.firstClass)}</b></div>
    <div class="kv"><span>Alignment</span><b>${esc(S.flavor.alignment||"Unaligned")}</b></div>
    ${S.flavor.hook?`<div class="hookline" style="margin-top:6px">${esc(S.flavor.hook)}</div>`:""}
    ${S.flavor.backstory?`<p class="hint" style="margin-top:8px">${esc(S.flavor.backstory)}</p>`:""}
    <div style="display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn ghost" data-act="surpriseback">← Build manually</button>
      <span style="display:flex;gap:8px">
        <button class="btn" data-act="surprise">🎲 Reroll</button>
        <button class="btn primary" data-act="closetip">⚔ Begin</button>
      </span>
    </div>
  </div></div>`;
}
function copyToClipboard(text, btn){
  const done=()=>{ if(btn) btn.textContent="Copied ✓"; };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text)); }
  else fallbackCopy(text);
  function fallbackCopy(t){
    const m=$("#tipmodal"); m.classList.remove("hidden");
    m.innerHTML=`<div class="modalwrap"><div class="sheet narrow" role="dialog"><h2>Build Link</h2>
      <p class="hint">Copy it from here:</p>
      <textarea style="width:100%;height:110px;font:12px ui-monospace,monospace;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">${esc(t)}</textarea>
      <div style="text-align:right;margin-top:8px"><button class="btn primary" data-act="closetip">Close</button></div></div></div>`;
  }
}
function doUndo(){
  if(!S.prevSnap) return;
  const stack=(S.undoStack&&S.undoStack.length)?S.undoStack:[S.prevSnap];
  const snap=stack[stack.length-1], rest=stack.slice(0,-1);
  S=Object.assign(freshState(), JSON.parse(snap));
  S.undoStack=rest; S.prevSnap=rest.length?rest[rest.length-1]:null;
  T.lastVignette=null; T.levelSnap=null;
  T.asiFeat={}; T.asiA={}; T.asiB={}; T.featAb={}; T.expTmp=[]; T.styleTmp={};
  render();
}

/* ---------------- Event wiring ---------------- */
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");
  if(!el) return;
  const a=el.dataset.a, b=el.dataset.b, act=el.dataset.act;
  hideHoverTip();
  switch(act){
    case "tab": S.ui.tab=a; render(); break;
    case "wiz": S.ui.wizStep=+a; render(); break;
    case "species": S.species=a; S.speciesChoice=null; if(a!=="Human")S.humanBonusFeat=null; render(); break;
    case "specchoice": S.speciesChoice=a; render(); break;
    case "bg": S.background=a; S.boostPlus2=null; S.boostPlus1=null; render(); break;
    case "boost2": S.boostPlus2=a; if(S.boostPlus1===a)S.boostPlus1=null; render(); break;
    case "boost1": S.boostPlus1=a; render(); break;
    case "humanfeat": S.humanBonusFeat=a; render(); break;
    case "pbinc": if(S.base[a]<15)S.base[a]++; render(); break;
    case "pbdec": if(S.base[a]>8)S.base[a]--; render(); break;
    case "rolldice": T.rollPools=Array.from({length:6},()=>{
        const d=Array.from({length:4},()=>1+Math.floor(Math.random()*6)).sort((x,y)=>y-x);
        return d[0]+d[1]+d[2];}); S.rollAssign={}; render(); break;
    case "class": S.firstClass=a; S.classSkills=[]; render(); break;
    case "skill": {
      const cd=CLASS_DATA[S.firstClass];
      T.lastSkillTap=a;
      if(S.classSkills.includes(a)) S.classSkills=S.classSkills.filter(x=>x!==a);
      else if(S.classSkills.length<cd.skills.choose) S.classSkills.push(a);
      render(); break; }
    case "forge": forgeCharacter(); break;
    case "xp": gainXP(); break;
    case "pickclass": applyLevel(a); render(); break;
    case "cancellevel": if(restoreSnap()){T.lastVignette=null; T.levelSnap=null;} else S.pending=null; render(); break;
    case "backlevel": backToClassPick(); break;
    case "subclass": S.subclasses[a]=b; S.pending.done[+el.dataset.c]=true;
      recomputePendingChoices(); render(); break;
    case "stylepick": {
      const i=+b;
      if(S.pending.done[i]){
        const prev=(S.pending.styleApplied||{})[i];
        if(prev){ S.fightingStyles=S.fightingStyles.filter(s=>s!==prev); delete S.styleBy[totalLevel()]; delete S.pending.styleApplied[i]; }
        S.pending.done[i]=false;
      }
      T.styleTmp[i]=a; render(); break; }
    case "confirmstyle": {
      const i=+a; const st=T.styleTmp[i]; if(!st) break;
      if(!S.fightingStyles.includes(st)) S.fightingStyles.push(st);
      S.styleBy[totalLevel()]=st;
      S.pending.styleApplied=S.pending.styleApplied||{}; S.pending.styleApplied[i]=st;
      S.pending.done[i]=true; render(); break; }
    case "exptoggle": {
      const n=+b||2;
      if(T.expTmp.includes(a)) T.expTmp=T.expTmp.filter(x=>x!==a);
      else if(T.expTmp.length<n) T.expTmp.push(a);
      render(); break; }
    case "confirmexp": {
      const c=S.pending.choices[+a];
      const picked=T.expTmp.filter(sk=>!S.expertise.includes(sk));
      S.expertise.push(...picked); S.expBy[totalLevel()]=[...T.expTmp];
      if(c&&c.fromSlot) (S.featChoices[c.fromSlot]=S.featChoices[c.fromSlot]||{}).expertise=picked;
      T.expTmp=[]; S.pending.done[+a]=true; render(); break; }
    case "fstoggle": {
      const n=+b||1;
      if(T.fsTmp.includes(a)) T.fsTmp=T.fsTmp.filter(x=>x!==a);
      else if(T.fsTmp.length<n) T.fsTmp.push(a);
      render(); break; }
    case "confirmfs": {
      const c=S.pending.choices[+a];
      const picked=T.fsTmp.filter(sk=>!S.skills.includes(sk));
      S.skills.push(...picked);
      if(c&&c.fromSlot) (S.featChoices[c.fromSlot]=S.featChoices[c.fromSlot]||{}).skills=picked;
      T.fsTmp=[]; S.pending.done[+a]=true; render(); break; }
    case "savepick": {
      const c=S.pending.choices[+b];
      const slotKey=c.fromSlot;
      const fc=S.featChoices[slotKey]=S.featChoices[slotKey]||{};
      if(fc.save) S.savePicks=S.savePicks.filter(x=>x!==fc.save);
      fc.save=a; S.savePicks.push(a);
      const feat=S.feats.find(f=>f.slot===slotKey);
      if(feat) feat.boosts={[a]:1};
      S.pending.done[+b]=true; render(); break; }
    case "featpicksp": {
      const [group,cap]=el.dataset.c.split("|");
      const fc=S.featChoices[a]=S.featChoices[a]||{};
      fc[group]=fc[group]||[];
      if(fc[group].includes(b)) fc[group]=fc[group].filter(n=>n!==b);
      else if(fc[group].length<+cap) fc[group].push(b);
      // mark the featspells pending choice done when complete
      if(S.pending){
        S.pending.choices.forEach((c,i)=>{ if(c.kind==="featspells"&&c.fromSlot===a) S.pending.done[i]=featPickComplete(a,c.feat); });
        render();
      } else { render(); if(T.featPick&&T.featPick.key===a) openFeatPick(T.featPick.key, T.featPick.name); }
      break; }
    case "featpick": openFeatPick(a, b); break;
    case "openopts": openOptionsModal(a); break;
    case "surge": { const tb=window.WILD_SURGE_TABLE||[]; if(tb.length){ const n=1+Math.floor(Math.random()*tb.length); T.lastSurge={n, t:tb[n-1]}; render(); } break; }
    case "dismisscelebrate": T.legendForged=false; render(); break;
    case "celebratechronicle": T.legendForged=false; S.ui.tab="sheet"; render();
      { const h=document.querySelector("#chronicle"); if(h) h.scrollIntoView({behavior:"smooth", block:"start"}); } break;
    case "nop": break;
    case "opttoggle": {
      const key=a, total=+b, idx=+el.dataset.c, name=el.dataset.d;
      const arr=optionState(key);
      if(arr.includes(name)) S.options[key]=arr.filter(x=>x!==name);
      else if(arr.length<total) arr.push(name);
      if(S.pending&&idx>=0&&S.pending.choices[idx]) S.pending.done[idx]=optionState(key).length===total;
      render(); break; }
    case "featoptpick": {
      const slot=a, name=b, [idx,n]=el.dataset.c.split("|");
      const fc=S.featChoices[slot]=S.featChoices[slot]||{};
      fc.option=fc.option||[];
      if(fc.option.includes(name)) fc.option=fc.option.filter(x=>x!==name);
      else { if(+n===1) fc.option=[name]; else if(fc.option.length<+n) fc.option.push(name); }
      if(S.pending&&+idx>=0&&S.pending.choices[+idx]) S.pending.done[+idx]=fc.option.length===+n;
      render(); break; }
    case "confirmasi": confirmAsi(+a); break;
    case "arcanum": { const [idx,lvl]=el.dataset.c.split("|"); spellState(a).arcanum[+lvl]=b; S.pending.done[+idx]=true; render(); break; }
    case "masterypick": {
      const [idx,lvl]=el.dataset.c.split("|");
      const ss=spellState(a);
      ss.mastery[+lvl]=ss.mastery[+lvl]===b?null:b;
      if(+idx>=0&&S.pending) S.pending.done[+idx]=!!(ss.mastery[1]&&ss.mastery[2]);
      if(+idx>=0){ render(); } else { render(); renderSpellModal(); }
      break; }
    case "signaturepick": {
      const idx=+el.dataset.c;
      const ss=spellState(a);
      if(ss.signature.includes(b)) ss.signature=ss.signature.filter(n=>n!==b);
      else if(ss.signature.length<2) ss.signature.push(b);
      if(idx>=0&&S.pending) S.pending.done[idx]=ss.signature.length===2;
      if(idx>=0){ render(); } else { render(); renderSpellModal(); }
      break; }
    case "finishlevel": finishLevel(); break;
    case "openspells": openSpellModal(a); break;
    case "closespells": T.spellTarget=null; $("#spellmodal").classList.add("hidden"); render(); break;
    case "sptab": T.spellFilter.tab=a; T.spellFilter.lvl="all"; renderSpellModal(); break;
    case "tipfeat": if(!CAN_HOVER) showTip(a,"",b||""); break;
    case "tipspell": if(!CAN_HOVER){ const sp=spellByName(a); if(sp){const c=tipContentFor(el); showTip(c.title,c.meta,c.body);} } break;
    case "closetip": if(ev.target===el||ev.target.closest(".btn")) {$("#tipmodal").classList.add("hidden");} break;
    case "export": exportSummary(); break;
    case "copytext": { const ta=$("#tipmodal textarea"); ta.select(); try{document.execCommand("copy");}catch(e){} el.textContent="Copied ✓"; break; }
    case "askreset": askConfirm("Burning this page erases "+(S.name||"your character")+" and the whole chronicle, and returns you to a blank ledger.", "reset", "Burn it, start anew"); break;
    case "askundo": askConfirm("Step back to before level "+totalLevel()+"? The choices made at this level, and its chronicle entry, will be unwritten.", "undo", "Step back"); break;
    case "randname": {
      const nd=window.NAME_DATA||{given:{},family:{},epithets:[]};
      const sp=S.species&&nd.given[S.species]?S.species:Object.keys(nd.given)[0];
      const pick=arr=>arr&&arr.length?arr[Math.floor(Math.random()*arr.length)]:"";
      const g=pick(nd.given[sp])||"Hero";
      const r=Math.random();
      S.name=(r<0.6&&nd.family[sp]?g+" "+pick(nd.family[sp]):r<0.85&&(nd.epithets||[]).length?g+" "+pick(nd.epithets):g).trim();
      render(); break; }
    case "confirmyes": {
      const f=T.confirmAct; T.confirmAct=null; $("#confirmmodal").classList.add("hidden");
      if(f==="reset") doReset();
      else if(f==="undo") doUndo();
      else if(f&&f.type==="vaultload"){ const s=loadVault().find(x=>x.id===f.id); if(s){ S=rehydrateState(JSON.parse(s.snap)); resetTemp(); S.ui.tab="sheet"; render(); } }
      else if(f&&f.type==="vaultdel"){ saveVault(loadVault().filter(x=>x.id!==f.id)); render(); }
      else if(f&&f.type==="import"&&T.importPending){ S=rehydrateState(T.importPending); T.importPending=null; resetTemp(); S.ui.tab="sheet"; render(); }
      break; }
    case "dismisswelcome": T.welcome=false; render(); break;
    case "autoscores": autoPlaceScores(); render(); break;
    case "kit": S.kit=a; render(); break;
    case "spoilpick": equipSpoil(a,+b); if(S.pending) S.pending.done[+el.dataset.c]=true; render(); break;
    case "unwonder": { const g=gearState(); g.wonders=g.wonders.filter(w=>w!==a); render(); break; }
    case "attune": { const g=gearState(); if(g.wonders.length<3&&!g.wonders.includes(a)) g.wonders.push(a); render(); break; }
    case "suggestspells": suggestLoadout(a); render(); renderSpellModal(); break;
    case "startbuild": S.ui.tab="create"; render(); break;
    case "surprise": surpriseMe(); break;
    case "surpriseback": $("#tipmodal").classList.add("hidden"); doReset(); break;
    case "align": S.flavor.alignment=S.flavor.alignment===a?null:a; render(); break;
    case "randhook": { const hs=((window.BACKSTORY_DATA||{}).hooks)||[]; if(hs.length){ let h=hs[Math.floor(Math.random()*hs.length)]; if(hs.length>1) while(h===S.flavor.hook) h=hs[Math.floor(Math.random()*hs.length)]; S.flavor.hook=h; } render(); break; }
    case "genstory": S.flavor.backstory=composeBackstory(); render(); break;
    case "sharelink": copyToClipboard(encodeBuildLink(S), el); saveState(); break;
    case "stash": { const r=stashToVault(S,""); if(r.ok){ S.ui.tab="vault"; } render(); break; }
    case "vaultload": { const s=loadVault().find(x=>x.id===a); if(s) askConfirm("Load '"+(s.meta.name||"Unnamed")+"' (level "+s.meta.level+")? Your current character will be replaced. Stash them first if you want to keep them.", {type:"vaultload", id:a}, "Load this legend"); break; }
    case "vaultdel": { const s=loadVault().find(x=>x.id===a); askConfirm("Delete '"+((s&&s.meta.name)||"this legend")+"' from the vault forever?", {type:"vaultdel", id:a}, "Delete it"); break; }
    case "vaultlink": { const s=loadVault().find(x=>x.id===a); if(s) copyToClipboard(encodeBuildLink(JSON.parse(s.snap)), el); break; }
    case "confirmno": T.confirmAct=null; $("#confirmmodal").classList.add("hidden"); break;
  }
});
document.addEventListener("change",ev=>{
  const el=ev.target.closest("[data-act-change]");
  if(!el) return;
  const act=el.dataset.actChange, a=el.dataset.a;
  switch(act){
    case "boostmode": S.boostTriple=el.value==="111"; render(); break;
    case "method": S.method=el.value; render(); break;
    case "arrayassign": S.arrayAssign[a]=el.value?+el.value:null; render(); break;
    case "rollassign": S.rollAssign[a]=el.value!==""?+el.value:null; render(); break;
    case "name": S.name=el.value; render(); break;
    case "asifeat": {
      const i=+a; T.asiFeat[i]=el.value;
      if(S.pending&&S.pending.done[i]){
        const slotKey="L"+totalLevel()+"#"+i;
        S.pending.done[i]=false;
        S.feats=S.feats.filter(f=>f.slot!==slotKey);
        revertFeatChoices(slotKey);
        S.pending.choices=S.pending.choices.filter(c=>c.fromSlot!==slotKey);
        T.fsTmp=[]; T.expTmp=[];
      }
      render(); break; }
    case "asiA": { const i=+a; T.asiA[i]=el.value; if(S.pending&&S.pending.done[i]) S.pending.done[i]=false; render(); break; }
    case "asiB": { const i=+a; T.asiB[i]=el.value; if(S.pending&&S.pending.done[i]) S.pending.done[i]=false; render(); break; }
    case "featab": { const i=+a; T.featAb[i]=el.value; if(S.pending&&S.pending.done[i]) S.pending.done[i]=false; render(); break; }
    case "optmodal": {
      const key=a, allowed=+el.dataset.b, name=el.dataset.c;
      const arr=optionState(key);
      if(el.checked){ if(!arr.includes(name)&&arr.length<allowed) arr.push(name); }
      else S.options[key]=arr.filter(x=>x!==name);
      // keep any matching pending choice's done-state in sync
      if(S.pending) S.pending.choices.forEach((c,i)=>{ if(c.kind==="options"&&c.key===key) S.pending.done[i]=optionState(key).length===c.total; });
      render(); openOptionsModal(key); break; }
    case "sptoggle": toggleSpell(a, el.checked); break;
    case "splvl": T.spellFilter.lvl=el.value; renderSpellModal(); break;
    case "hook": S.flavor.hook=el.value||null; render(); break;
    case "gear": { const g=gearState(); g[a]=el.value||null; render(); break; }
    case "pgpick": { T.pgPick=T.pgPick||[]; const cur=benchmarkMonsters().map(m=>m.name); for(let i=0;i<3;i++) T.pgPick[i]=T.pgPick[i]||cur[i]; T.pgPick[+a]=el.value; render(); break; }
    case "glosscat": T.glossCat=el.value; render(); break;
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target.closest("[data-act-input]");
  if(!el){ const cn=ev.target.closest("#charname"); if(cn) S.name=cn.value; return; }
  if(el.dataset.actInput==="flavhook"){ S.flavor.hook=el.value||null; saveState(); return; }
  if(el.dataset.actInput==="flavbackstory"){ S.flavor.backstory=el.value; saveState(); return; }
  if(el.dataset.actInput==="flavnotes"){ S.flavor.notes=el.value; saveState(); return; }
  if(el.dataset.actInput==="spq"){ T.spellFilter.q=el.value; const keep=el.selectionStart; renderSpellModal(); const ni=document.querySelector("[data-act-input='spq']"); if(ni){ni.focus(); ni.setSelectionRange(keep,keep);} }
  if(el.dataset.actInput==="glossq"){ T.glossQ=el.value; const keep=el.selectionStart; render(); const ni=document.querySelector("[data-act-input='glossq']"); if(ni){ni.focus(); ni.setSelectionRange(keep,keep);} }
});

/* ---------------- Boot ---------------- */
function handleSharedBuild(sb){
  try{ history.replaceState(null, "", location.pathname+location.search); }catch(e){}
  if(!S.created){ S=rehydrateState(sb); S.ui.tab="sheet"; render(); }
  else {
    T.importPending=sb;
    render();
    askConfirm("This link carries the build '"+(sb.name||"Unnamed")+"' (level "+(sb.levelSeq||[]).length+"). Load it? Your current character will be replaced. Stash them in the Vault first if you want to keep them.", {type:"import"}, "Load the shared build");
  }
}
window.addEventListener("hashchange",()=>{ const sb=decodeBuildHash(); if(sb) handleSharedBuild(sb); });
loadState();
const sharedBuild=decodeBuildHash();
if(S.created&&!sharedBuild) T.welcome=true;
render();
if(sharedBuild) handleSharedBuild(sharedBuild);
try{
  if("serviceWorker" in navigator && /^https?:/.test(location.protocol))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
}catch(e){}
