<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0B0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Legend Forge</title>
<style>
/* ============ Tokens: "The Arcanist's Instrument" — near-black, one violet accent ============ */
:root{
  --bg:#0B0B0F; --bg2:#101015; --panel:#131319; --panel2:#1A1A22;
  --ink:#E7E7EC; --ink-dim:#A9A9B4; --muted:#83838F;
  --line:#27272F; --line-soft:#1E1E26;
  --gold:#8B8BF4; --gold-deep:#6D6DE0; --gold-ink:#0B0B0F;
  --garnet:#E5697B; --emerald:#5FD39B; --azure:#6FB6FF;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --focus:#A5A5FF;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-lore:"Iowan Old Style",Palatino,Georgia,serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F3F6; --bg2:#ECECF1; --panel:#FFFFFF; --panel2:#F0F0F4;
    --ink:#17171D; --ink-dim:#4B4B57; --muted:#7A7A86;
    --line:#D9D9E1; --line-soft:#E6E6EC;
    --gold:#5555CE; --gold-deep:#4343B8; --gold-ink:#FFFFFF;
    --garnet:#C2334A; --emerald:#137E4C; --azure:#2470B8;
    --shadow:0 8px 24px rgba(23,23,40,.10);
    --focus:#4343B8;
  }
}
:root[data-theme="light"]{
  --bg:#F3F3F6; --bg2:#ECECF1; --panel:#FFFFFF; --panel2:#F0F0F4;
  --ink:#17171D; --ink-dim:#4B4B57; --muted:#7A7A86;
  --line:#D9D9E1; --line-soft:#E6E6EC;
  --gold:#5555CE; --gold-deep:#4343B8; --gold-ink:#FFFFFF;
  --garnet:#C2334A; --emerald:#137E4C; --azure:#2470B8;
  --shadow:0 8px 24px rgba(23,23,40,.10);
  --focus:#4343B8;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15.5px; line-height:1.55;
  min-height:100vh;
  font-variant-numeric:tabular-nums;
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ============ Frame ============ */
#app{max-width:1280px;margin:0 auto;padding:0 20px 60px}
header.masthead{ text-align:center; padding:14px 0 6px; }
.rule-orn{ display:none; }
.masthead h1{
  font-family:var(--font-display); font-weight:700; font-size:20px;
  letter-spacing:.28em; text-transform:uppercase; text-wrap:balance;
  margin:6px 0 2px; color:var(--ink);
}
.masthead h1 .amp{color:var(--gold); font-style:normal}
.masthead .subtitle{
  color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.3em; margin:0 0 6px;
}
.layout{display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:22px; align-items:start; margin-top:16px}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #railPanel{position:static; max-height:none}
}

/* ============ Tabs ============ */
nav.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
nav.tabs button{
  appearance:none; background:none; border:none; border-bottom:2px solid transparent;
  color:var(--ink-dim); font-family:var(--font-display); font-weight:500; font-size:11.5px;
  letter-spacing:.18em; text-transform:uppercase;
  padding:9px 14px; cursor:pointer;
  transition:color .13s ease-out, border-color .13s ease-out, background-color .13s ease-out, box-shadow .13s ease-out, transform .13s ease-out;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.active{color:var(--gold); border-bottom-color:var(--gold)}
nav.tabs button:disabled{opacity:.35; cursor:default}
main#stage{padding-top:16px; min-width:0}

/* ============ Panels & cards ============ */
.panel{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow)}
.panel + .panel{margin-top:16px}
h2{font-family:var(--font-display); font-size:20px; margin:0 0 10px; font-weight:600; letter-spacing:.02em}
h3{font-family:var(--font-display); font-size:16px; margin:18px 0 8px; font-weight:600; letter-spacing:.03em}
h3.eyebrow, .eyebrow{
  font-family:var(--font-display); font-size:10px; text-transform:uppercase; letter-spacing:.22em;
  color:var(--muted); font-weight:600; margin:14px 0 6px;
}
p.lede{color:var(--ink-dim); margin-top:0}
.hint{color:var(--muted); font-size:13.5px}
hr.orn{border:none; border-top:1px solid var(--line-soft); margin:16px 0}

.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
.card{
  background:var(--panel2); border:1px solid var(--line-soft); border-radius:12px;
  padding:12px 14px; cursor:pointer; text-align:left; font:inherit; color:var(--ink);
  transition:color .13s ease-out, border-color .13s ease-out, background-color .13s ease-out, box-shadow .13s ease-out, transform .13s ease-out;
}
.card:hover{border-color:var(--gold-deep); transform:translateY(-1px)}
.card.sel{
  border-color:var(--gold); box-shadow:0 0 0 1.5px var(--gold);
  background:color-mix(in srgb, var(--gold) 8%, var(--panel2));
}
.card.disabled{opacity:.45; cursor:not-allowed}
.card[style*="cursor:default"]:hover{border-color:var(--line-soft); transform:none}
.card .cname{font-family:var(--font-display); font-weight:600; letter-spacing:.02em}
.card .cmeta{font-size:11px; color:var(--muted); margin-top:2px}
.card .cdesc{font-size:13px; color:var(--ink-dim); margin-top:6px}

/* ============ Buttons & inputs ============ */
.btn{
  appearance:none; font:inherit; font-family:var(--font-body); font-weight:500; cursor:pointer; border-radius:10px;
  border:1px solid var(--line); background:var(--panel2); color:var(--ink);
  padding:8px 16px; letter-spacing:.03em;
  transition:color .13s ease-out, border-color .13s ease-out, background-color .13s ease-out, box-shadow .13s ease-out, transform .13s ease-out;
}
.btn:hover{border-color:var(--gold-deep)}
.btn.primary{
  background:var(--gold); color:var(--gold-ink); border-color:var(--gold);
  font-weight:600; letter-spacing:.05em;
}
.btn.primary:hover{
  background:var(--gold-deep); border-color:var(--gold-deep); color:var(--gold-ink);
  box-shadow:0 0 20px color-mix(in srgb, var(--gold) 45%, transparent);
}
.btn.big{font-size:16px; padding:12px 22px; border-radius:10px}
.btn.danger{color:var(--garnet); border-color:var(--garnet)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:none}
input[type=text], select, textarea{
  font:inherit; font-family:var(--font-body); color:var(--ink); background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; padding:7px 10px; max-width:100%;
}
input[type=text]::placeholder{color:var(--muted)}
label.fld{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.15em; color:var(--muted); margin:10px 0 4px}
.radiorow{display:flex; gap:14px; flex-wrap:wrap; margin:6px 0; align-items:center}
.radiorow label{display:flex; align-items:center; gap:6px; cursor:pointer}
.chiprow{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px;
  cursor:pointer; background:transparent; color:var(--ink-dim); font-family:var(--font-body);
  transition:color .13s ease-out, border-color .13s ease-out, background-color .13s ease-out, box-shadow .13s ease-out, transform .13s ease-out;
}
.chip:hover{border-color:var(--gold-deep); color:var(--ink)}
.chip.sel{border-color:var(--gold); color:var(--gold); font-weight:700; background:transparent}
.chip.locked{cursor:default}
.chip:disabled{opacity:.4; cursor:not-allowed}

/* ============ Ability blocks (Railway-style: label-under-numeral becomes label-over via column-reverse) ============ */
.abilrow{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
@media(max-width:700px){.abilrow{grid-template-columns:repeat(3,1fr)}}
.abil{
  background:var(--bg2); border:1px solid var(--line-soft); border-radius:10px;
  text-align:center; padding:8px 4px;
}
.abil .aname{font-size:11px; letter-spacing:.2em; color:var(--muted)}
.abil .ascore{font-family:var(--font-display); font-size:26px; font-weight:700; font-variant-numeric:tabular-nums}
.abil .amod{color:var(--gold); font-size:12px}
.abil .stepper{display:flex; justify-content:center; gap:6px; margin-top:4px}
.abil .stepper button{
  width:28px; height:28px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); cursor:pointer; font-size:15px; line-height:1;
  transition:border-color .13s ease-out;
}
.abil .stepper button:hover{border-color:var(--gold-deep)}
.abil .stepper button:disabled{opacity:.3; cursor:default}

/* ============ Character sheet (main column) ============ */
.sheethead{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:16px 20px; box-shadow:var(--shadow); margin-bottom:16px}
.sheethead .charname{font-family:var(--font-display); font-size:24px; font-weight:700}
.sheethead .charline{color:var(--ink-dim); font-size:14px}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0}
.sheethead .statgrid{grid-template-columns:repeat(7,1fr)}
@media(max-width:760px){.sheethead .statgrid{grid-template-columns:repeat(4,1fr)}}
.stat{
  background:var(--bg2); border:1px solid var(--line-soft); border-radius:10px; text-align:center; padding:10px 4px;
  display:flex; flex-direction:column-reverse; justify-content:flex-end; gap:2px; min-height:74px;
}
.stat .sv.sv-long{font-size:15px; line-height:1.25; padding-top:4px}
.stat[data-tipt]{cursor:help}
.stat .sv{font-family:var(--font-display); font-size:24px; font-weight:700; font-variant-numeric:tabular-nums}
.sheethead .statgrid .sv{font-size:26px; line-height:1.1}
.sheethead .statgrid .sv.sv-long{font-size:15px}
.stat .sl{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.xpbar{height:4px; background:var(--line-soft); border-radius:99px; overflow:hidden; margin:8px 0 2px}
.xpbar i{
  display:block; height:100%; background:linear-gradient(90deg, var(--gold-deep), var(--gold));
  box-shadow:0 0 12px color-mix(in srgb, var(--gold) 50%, transparent);
  transition:width .4s ease;
}
.sheetcols{columns:2 330px; column-gap:16px}
.scard{
  display:inline-block; width:100%; break-inside:avoid; vertical-align:top;
  background:var(--panel); border:1px solid var(--line-soft); border-radius:14px;
  padding:14px 16px 16px; margin:0 0 16px; box-shadow:var(--shadow);
}
.scard > .eyebrow:first-child{margin-top:0}
.scard .eyebrow{margin:16px 0 6px}
.scard > .eyebrow:first-child + .eyebrow{margin-top:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.atkrow{padding:5px 0}
.atkrow .atkval{font-family:var(--font-display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.atkrow .atkmeta{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.scard .featline{padding:4px 0}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:2px 0}
.kv b{font-family:var(--font-display); font-variant-numeric:tabular-nums; white-space:nowrap}
.featline{padding:3px 0; font-size:14px}
.fname, .sname{cursor:pointer; color:var(--ink); border-bottom:1px dotted var(--gold-deep)}
.fname:hover, .sname:hover{color:var(--gold)}
.featline .flvl{color:var(--muted); font-size:12px}
.slotpills{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0}
.slotpill{
  border:1px solid var(--gold-deep); border-radius:8px; padding:2px 8px; font-size:12.5px;
  color:var(--ink); font-variant-numeric:tabular-nums;
}
.spell-line{font-size:13.5px; padding:2px 0}
.spell-line .stag{font-size:11px; color:var(--muted)}
.tagC{color:var(--azure)} .tagR{color:var(--emerald)}
.counts{font-family:var(--font-display); font-variant-numeric:tabular-nums; color:var(--gold); font-weight:700}

/* ============ Adventure rail ============ */
#railPanel{
  position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto;
  background:var(--panel); border:1px solid var(--line-soft); border-radius:14px;
  padding:16px 16px 22px; box-shadow:var(--shadow);
}
#railPanel h2{font-size:18px; border-bottom:1px solid var(--line-soft); padding-bottom:8px}
.railxp{text-align:center; padding:8px 0 4px}
.vignette{
  background:var(--panel2); border-left:2px solid var(--gold); border-radius:0 10px 10px 0;
  padding:12px 14px; margin:14px 0 0; text-align:left;
  font-family:var(--font-lore); font-style:italic; color:var(--ink-dim); font-size:14px;
}
.vignette .vhead{
  font-family:var(--font-display); font-style:normal; font-size:10.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--gold); margin-bottom:4px;
}
.logentry{border-top:1px solid var(--line-soft); padding:9px 2px; font-size:13.5px}
.logentry .lhead{
  font-family:var(--font-display); color:var(--gold); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
}
.logentry .ltext{font-family:var(--font-lore); color:var(--ink-dim); font-style:italic}
.gains{font-size:13px; color:var(--emerald)}

/* ============ Overlays ============ */
#overlay, .modalwrap{
  position:fixed; inset:0; background:rgba(8,8,12,.72); backdrop-filter:blur(8px);
  display:flex; align-items:flex-start; justify-content:center; padding:4vh 14px; z-index:50;
  overflow-y:auto;
}
#overlay .sheet, .modalwrap .sheet{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  max-width:760px; width:100%; padding:22px 26px; box-shadow:var(--shadow); margin-bottom:6vh;
}
.modalwrap .sheet.narrow{max-width:520px}
.hidden{display:none!important}
.choice-block{border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px; margin:10px 0; background:var(--panel2)}
.choice-block.done{border-color:var(--emerald)}
.choice-block .ch-title{font-weight:700}
.choice-block .ch-status{float:right; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--garnet)}
.choice-block.done .ch-status{color:var(--emerald)}

/* ============ Hover tooltip ============ */
#hovertip{
  position:fixed; z-index:90; max-width:340px; pointer-events:none;
  background:var(--panel); border:1px solid var(--gold-deep); border-radius:10px;
  padding:10px 12px; box-shadow:var(--shadow); font-size:13.5px;
}
#hovertip .tt-title{font-family:var(--font-display); font-weight:600; color:var(--gold)}
#hovertip .tt-meta{font-size:11.5px; color:var(--muted); margin-bottom:4px}

/* ============ Spell picker ============ */
.spellpick-controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0}
.spellpick-list{max-height:46vh; overflow-y:auto; border:1px solid var(--line-soft); border-radius:12px; padding:6px 10px; background:var(--bg2)}
.sp-item{display:flex; gap:8px; align-items:baseline; padding:7px 8px; border-radius:8px}
.sp-item:hover{background:var(--panel2)}
.sp-item input{accent-color:var(--gold)}
.sp-item .spn{font-family:var(--font-body); font-weight:600; cursor:pointer}
.sp-item .spm{font-size:12px; color:var(--muted)}
.sp-item .spd{font-size:13px; color:var(--ink-dim)}

/* ============ Analysis ============ */
.anagrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.anagrid>.panel{margin-top:0; height:100%}
@media(max-width:760px){.anagrid{grid-template-columns:1fr}}
.ana-stat{font-size:15px}

/* ============ Glossary ============ */
.glosslist{margin-top:10px}
.glossentry{border-radius:8px; padding:8px 2px}
.glossentry:hover{background:var(--panel2)}
.glossentry .gterm{font-family:var(--font-display); font-weight:600}
.glossentry .gcat{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-left:8px}
.glossentry .gdef{font-size:14px; color:var(--ink-dim)}

.footer-note{text-align:center; color:var(--muted); font-size:12.5px; margin-top:30px; letter-spacing:.05em}

/* ============ Gear & spoils ============ */
.gearrow{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:10px;align-items:center;padding:5px 0}
.gearrow select{width:100%;min-width:0;font-size:12.5px;padding:5px 8px}
@media(max-width:420px){.gearrow{grid-template-columns:1fr}}
.rar{display:inline-flex;align-items:center;font-family:var(--font-display);font-size:9.5px;line-height:1;letter-spacing:.1em;text-indent:.1em;text-transform:uppercase;padding:4px 7px 3px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;margin-left:4px}
.rar-uncommon{border-color:var(--emerald);color:var(--emerald)}
.rar-rare{border-color:var(--azure);color:var(--azure)}
.rar-very-rare{border-color:var(--gold);color:var(--gold)}
.rar-legendary{border-color:var(--garnet);color:var(--garnet)}
.pgcells{font-variant-numeric:tabular-nums;white-space:nowrap}
.pgpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.pgpick select{width:100%;min-width:0;font-size:12.5px}
@media(max-width:600px){.pgpick{grid-template-columns:1fr}}

/* ============ Road map strip ============ */
.roadmap{margin:8px 0 2px}
.rm-row{display:flex;align-items:center;gap:3px;margin:3px 0}
.rm-cls{font-family:var(--font-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:none;white-space:nowrap;margin-right:8px;min-width:64px}
.rm{flex:1;height:7px;border-radius:2px;background:var(--line-soft);border:1px solid transparent;cursor:help;min-width:0}
.rm.feat{background:var(--line)}
.rm.sub{background:var(--azure)} .rm.asi{background:var(--gold-deep)} .rm.attack{background:var(--garnet)} .rm.boon{background:var(--emerald)} .rm.cap{background:var(--gold)}
.rm:not(.done):not(.now){opacity:.35}
.rm.now{opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--gold);height:9px}
.rm-key{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.rm-key span{display:inline-flex;align-items:center;gap:6px}
.rm-key i{display:block;width:12px;height:7px;flex:none;opacity:1;cursor:default;border-radius:2px}

/* ============ Legend Forged (level 20 moment) ============ */
#celebrate{
  position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(640px at 50% 42%, color-mix(in srgb, var(--gold) 16%, transparent), rgba(8,8,12,.86));
  backdrop-filter:blur(10px); animation:lfFade .35s ease-out both;
}
.lf-card{
  text-align:center; max-width:560px; width:100%; padding:44px 32px 36px;
  background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line); border-radius:18px;
  box-shadow:0 0 0 1px color-mix(in srgb, var(--gold) 25%, transparent), 0 0 90px color-mix(in srgb, var(--gold) 22%, transparent), var(--shadow);
}
.lf-card>*{animation:lfRise .55s cubic-bezier(.2,.8,.2,1) both}
.lf-card>:nth-child(2){animation-delay:.08s} .lf-card>:nth-child(3){animation-delay:.22s}
.lf-card>:nth-child(4){animation-delay:.34s} .lf-card>:nth-child(5){animation-delay:.42s}
.lf-card>:nth-child(6){animation-delay:.50s} .lf-card>:nth-child(7){animation-delay:.62s}
.lf-eyebrow{font-family:var(--font-display); font-size:10.5px; text-transform:uppercase; letter-spacing:.3em; color:var(--muted); font-weight:600}
.lf-num{
  font-family:var(--font-display); font-weight:700; font-size:clamp(84px,20vw,132px); line-height:1; letter-spacing:-.04em;
  color:var(--ink); margin-top:10px; font-variant-numeric:tabular-nums;
}
.lf-rule{
  height:2px; width:120px; margin:14px auto 18px; border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  animation:lfRule .7s cubic-bezier(.2,.8,.2,1) both !important; animation-delay:.28s !important;
}
.lf-title{font-family:var(--font-display); font-weight:600; font-size:clamp(17px,3.4vw,22px); letter-spacing:.3em; text-transform:uppercase; color:var(--gold)}
.lf-name{font-family:var(--font-lore); font-style:italic; font-size:19px; color:var(--ink); margin-top:10px}
.lf-line{font-size:12.5px; color:var(--ink-dim); margin-top:6px; letter-spacing:.02em}
.lf-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:26px}
@keyframes lfFade{from{opacity:0}}
@keyframes lfRise{from{opacity:0; transform:translateY(10px)}}
@keyframes lfRule{from{transform:scaleX(0); opacity:0}}

/* ============ Reveal glow (Surprise Me, signature layer) ============ */
.modalwrap.reveal-wrap{
  background:radial-gradient(620px at 50% 38%, color-mix(in srgb, var(--gold) 14%, transparent), rgba(8,8,12,.78));
}
.sheet.reveal-sheet{
  border-color:var(--gold-deep);
  box-shadow:0 0 80px color-mix(in srgb, var(--gold) 28%, transparent), var(--shadow);
}
.reveal-name{animation:lfNameIn .8s cubic-bezier(.2,.8,.2,1)}
@keyframes lfNameIn{
  from{opacity:0; letter-spacing:.3em; filter:blur(6px)}
  to{opacity:1; letter-spacing:.02em; filter:blur(0)}
}

/* ============ Mobile action bar ============ */
#mobilebar{display:none}
@media(max-width:960px){
  #mobilebar.on{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)); gap:10px; align-items:center;
    box-shadow:0 -8px 24px rgba(0,0,0,.3)}
  #mobilebar .btn.primary{flex:1; font-size:15px; padding:10px 12px; border-radius:999px}
  #mobilebar .mb-meta{font-size:11px; color:var(--muted); line-height:1.3; min-width:0}
  body.hasbar #app{padding-bottom:96px}
}

/* ============ Flavor & vault ============ */
textarea.flav{width:100%; min-height:90px; font:inherit; font-family:var(--font-body); font-size:14px; color:var(--ink);
  background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical}
.welcome{background:var(--panel2); border:1px solid var(--gold-deep); border-radius:10px;
  padding:8px 14px; margin-top:10px; font-size:14px; display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap}
.hookline{font-family:var(--font-lore); font-style:italic; color:var(--gold); font-size:13.5px; margin-top:2px}
.aligngrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:480px}
.aligngrid .chip{border-radius:10px; text-align:center}
.vaultcard{background:var(--panel2); border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px; margin:10px 0}
.vaultcard .vc-name{font-family:var(--font-display); font-weight:600}
.vaultcard .vc-meta{font-size:12.5px; color:var(--muted)}
.nudge{font-size:12.5px; color:var(--garnet); margin-top:6px}
.wizsteps{display:flex; gap:2px; flex-wrap:wrap; margin-bottom:14px}
.wizsteps .ws{
  flex:1; min-width:90px; text-align:center; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  padding:7px 4px; border-bottom:2px solid var(--line); color:var(--muted); cursor:pointer; background:none;
  border-top:none; border-left:none; border-right:none; font-family:var(--font-body);
  transition:color .13s ease-out, border-color .13s ease-out, background-color .13s ease-out, box-shadow .13s ease-out, transform .13s ease-out;
}
.wizsteps .ws.active{color:var(--gold); border-bottom-color:var(--gold)}
.wizsteps .ws.done{color:var(--emerald); border-bottom-color:var(--emerald)}
.rollpool{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0}
.die{
  border:1px solid var(--gold-deep); border-radius:10px; width:46px; height:46px; display:flex;
  align-items:center; justify-content:center; font-family:var(--font-display); font-size:20px; font-weight:700;
  font-variant-numeric:tabular-nums; background:var(--bg2);
}
table.mini{border-collapse:collapse; width:100%; font-size:13.5px}
table.mini td, table.mini th{border-bottom:1px solid var(--line-soft); padding:4px 6px; text-align:left; font-variant-numeric:tabular-nums}
table.mini td{font-family:var(--font-display); font-weight:600}
table.mini th{font-family:var(--font-body); font-weight:400; color:var(--muted); font-size:11px; letter-spacing:.15em; text-transform:uppercase}

    desc: "Magically locks a door, container, or similar closure until dispelled; only you, designated creatures, or a chosen password can bypass it." },
  { name: "Arcane Vigor", level: 2, school: "Abjuration",
    classes: ["Sorcerer","Wizard"],
    cast: "Bonus Action", range: "Self", conc: false, ritual: false,
    desc: "Spend and roll one or two of your unexpended Hit Point Dice, regaining the total plus your spellcasting modifier. Upcast: roll one additional Hit Die per slot level above 2." },
  { name: "Augury", level: 2, school: "Divination",
    classes: ["Cleric","Druid","Wizard"],
    cast: "1 Minute", range: "Self", conc: false, ritual: true,
    desc: "An otherworldly omen (weal, woe, both, or neither) forecasts the outcome of a course of action planned within the next 30 minutes; repeat castings before a Long Rest risk a cumulative 25 percent chance of no answer." },
  { name: "Barkskin", level: 2, school: "Transmutation",
    classes: ["Druid","Ranger"],
    cast: "Bonus Action", range: "Touch", conc: false, ritual: false,
    desc: "A willing creature's AC becomes 17 if it was lower, for 1 hour with no Concentration required." },
  { name: "Beast Sense", level: 2, school: "Divination",
    classes: ["Druid","Ranger"],
    cast: "Action", range: "Touch", conc: true, ritual: true,
    desc: "Perceive through a willing Beast's senses, including its special senses, for up to 1 hour." },
  { name: "Blindness/Deafness", level: 2, school: "Transmutation",
    classes: ["Bard","Cleric","Sorcerer","Wizard"],
    cast: "Action", range: "120 feet", conc: false, ritual: false,
    desc: "CON save or the target is Blinded or Deafened (your choice) for 1 minute, repeating the save at the end of each of its turns. Upcast: +1 target per slot level above 2." },
  { name: "Blur", level: 2, school: "Illusion",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "Attack rolls against you have Disadvantage for up to 1 minute; attackers with Blindsight or Truesight are immune." },
  { name: "Calm Emotions", level: 2, school: "Enchantment",
    classes: ["Bard","Cleric"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "Humanoids in a 20-foot-radius Sphere make a CHA save; on a failure you either suppress Charmed/Frightened (granting Immunity to gaining them) or make them Indifferent toward chosen enemies until they take damage." },
  { name: "Cloud of Daggers", level: 2, school: "Conjuration",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "Fills a 5-foot Cube with blades dealing 4d4 Slashing damage (no save, once per turn) to creatures inside, entering, or ending their turn there; a Magic action teleports the Cube up to 30 feet. Upcast: +2d4 per slot level above 2." },
  { name: "Continual Flame", level: 2, school: "Evocation",
    classes: ["Cleric","Druid","Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "A heatless, fuel-free flame on a touched object sheds Bright Light in a 20-foot radius (Dim for 20 more) until dispelled." },
  { name: "Cordon of Arrows", level: 2, school: "Transmutation",
    classes: ["Ranger"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "Plant up to four pieces of nonmagical ammunition for 8 hours; a non-designated creature entering within 30 feet triggers one to strike for 2d4 Piercing damage (DEX save negates), destroying that piece. Upcast: +2 pieces per slot level above 2." },
  { name: "Crown of Madness", level: 2, school: "Enchantment",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "120 feet", conc: true, ritual: false,
    desc: "A Humanoid makes a WIS save or is Charmed for up to 1 minute, forced to use its action to melee-attack a creature you choose; it repeats the save each turn, and you must take a Magic action each of your turns to sustain control." },
  { name: "Darkness", level: 2, school: "Evocation",
    classes: ["Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "Magical Darkness fills a 15-foot-radius Sphere (or an Emanation from an object) for up to 10 minutes; Darkvision cannot penetrate it, and it dispels light spells of level 2 or lower it overlaps." },
  { name: "Darkvision", level: 2, school: "Transmutation",
    classes: ["Druid","Ranger","Sorcerer","Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "A willing creature gains Darkvision out to 150 feet for 8 hours." },
  { name: "Detect Thoughts", level: 2, school: "Divination",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "For up to 1 minute, sense thinking minds within 30 feet or read a creature's surface thoughts; probing deeper forces a WIS save, and failure lets you read deeper thoughts while the target knows its mind is probed." },
  { name: "Dragon's Breath", level: 2, school: "Transmutation",
    classes: ["Sorcerer","Wizard"],
    cast: "Bonus Action", range: "Touch", conc: true, ritual: false,
    desc: "A willing creature can use a Magic action to exhale a 15-foot Cone of Acid, Cold, Fire, Lightning, or Poison for 3d6 damage (DEX save for half) for up to 1 minute. Upcast: +1d6 per slot level above 2." },
  { name: "Enhance Ability", level: 2, school: "Transmutation",
    classes: ["Bard","Cleric","Druid","Ranger","Sorcerer","Wizard"],
    cast: "Action", range: "Touch", conc: true, ritual: false,
    desc: "The target has Advantage on ability checks with one chosen ability (STR, DEX, INT, WIS, or CHA) for up to 1 hour. Upcast: +1 target per slot level above 2, each with its own ability." },
  { name: "Enlarge/Reduce", level: 2, school: "Transmutation",
    classes: ["Bard","Druid","Sorcerer","Wizard"],
    cast: "Action", range: "30 feet", conc: true, ritual: false,
    desc: "Grow or shrink a creature (unwilling: CON save negates) or unattended object one size category for up to 1 minute; enlarged targets get Advantage on STR checks and saves plus +1d4 weapon damage, reduced ones the reverse penalties." },
  { name: "Enthrall", level: 2, school: "Enchantment",
    classes: ["Bard","Warlock"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "Chosen creatures make a WIS save (auto-success for those fighting you) or take a -10 penalty to Perception checks and Passive Perception for up to 1 minute." },
  { name: "Find Steed", level: 2, school: "Conjuration",
    classes: ["Paladin"],
    cast: "Action", range: "30 feet", conc: false, ritual: false,
    desc: "Summons an Otherworldly Steed (Celestial, Fey, or Fiend) as a rideable ally that shares your Initiative and can be dismissed or re-summoned; it fully heals when the spell is recast. Upcast: the steed's stat block improves with slot level." },
  { name: "Find Traps", level: 2, school: "Divination",
    classes: ["Cleric","Druid","Ranger"],
    cast: "Action", range: "120 feet", conc: false, ritual: false,
    desc: "Instantly senses whether any trap (an object, mechanism, or magic designed to harm) is present within range and line of sight, revealing its general nature but not its location." },
  { name: "Flame Blade", level: 2, school: "Evocation",
    classes: ["Druid","Sorcerer"],
    cast: "Bonus Action", range: "Self", conc: true, ritual: false,
    desc: "Conjures a fiery scimitar for up to 10 minutes; a Magic action makes a melee spell attack for 3d6 + spellcasting modifier Fire damage, and the blade sheds light. Upcast: +1d6 per slot level above 2." },
  { name: "Flaming Sphere", level: 2, school: "Conjuration",
    classes: ["Druid","Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "A rolling 5-foot sphere of fire lasts up to 1 minute; creatures ending their turn within 5 feet (or rammed by it) take 2d6 Fire damage, DEX save for half, and a Bonus Action moves it 30 feet. Upcast: +1d6 per slot level above 2." },
  { name: "Gentle Repose", level: 2, school: "Necromancy",
    classes: ["Cleric","Paladin","Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: true,
    desc: "A touched corpse cannot decay or become Undead for 10 days, and that time does not count against raising-magic time limits." },
  { name: "Gust of Wind", level: 2, school: "Evocation",
    classes: ["Druid","Ranger","Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "A 60-foot Line of wind pushes creatures 15 feet away on a failed STR save, halves movement toward you, disperses gas, and snuffs unprotected flames for up to 1 minute; a Bonus Action redirects it." },
  { name: "Heat Metal", level: 2, school: "Transmutation",
    classes: ["Bard","Druid"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "A manufactured metal object glows red-hot, dealing 2d8 Fire damage to anyone touching it (repeatable as a Bonus Action for up to 1 minute); holders must pass a CON save or drop it, else suffer Disadvantage on attacks and checks. Upcast: +1d8 per slot level above 2." },
  { name: "Hold Person", level: 2, school: "Enchantment",
    classes: ["Bard","Cleric","Druid","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "A Humanoid makes a WIS save or is Paralyzed for up to 1 minute, repeating the save at the end of each of its turns. Upcast: +1 Humanoid target per slot level above 2." },
  { name: "Invisibility", level: 2, school: "Illusion",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "Touch", conc: true, ritual: false,
    desc: "A touched creature is Invisible for up to 1 hour; the effect ends on it immediately after it attacks, deals damage, or casts a spell. Upcast: +1 target per slot level above 2." },
  { name: "Knock", level: 2, school: "Transmutation",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "Unlocks, unsticks, or unbars one mundane closure (or suppresses Arcane Lock for 10 minutes), accompanied by a knock audible 300 feet away." },
  { name: "Lesser Restoration", level: 2, school: "Abjuration",
    classes: ["Bard","Cleric","Druid","Paladin","Ranger"],
    cast: "Bonus Action", range: "Touch", conc: false, ritual: false,
    desc: "As a Bonus Action, end one of the Blinded, Deafened, Paralyzed, or Poisoned conditions on a touched creature." },
  { name: "Levitate", level: 2, school: "Transmutation",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "A creature (unwilling: CON save negates) or 500-pound object floats vertically, moving up to 20 feet up or down per turn for up to 10 minutes, and drifts down safely when the spell ends." },
  { name: "Locate Animals or Plants", level: 2, school: "Divination",
    classes: ["Bard","Druid","Ranger"],
    cast: "Action", range: "Self", conc: false, ritual: true,
    desc: "Learn the direction and distance to the nearest specimen of a named kind of Beast, Plant creature, or nonmagical plant within 5 miles." },
  { name: "Locate Object", level: 2, school: "Divination",
    classes: ["Bard","Cleric","Druid","Paladin","Ranger","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "For up to 10 minutes, sense the direction to a specific familiar object or the nearest object of a named kind within 1,000 feet; any thickness of lead blocks it." },
  { name: "Magic Mouth", level: 2, school: "Illusion",
    classes: ["Bard","Wizard"],
    cast: "1 Minute", range: "30 feet", conc: false, ritual: true,
    desc: "Implants a 25-word message in an object that a magical mouth speaks in your voice when a trigger condition you define occurs, once or repeatedly, until dispelled." },
  { name: "Magic Weapon", level: 2, school: "Transmutation",
    classes: ["Paladin","Ranger","Sorcerer","Wizard"],
    cast: "Bonus Action", range: "Touch", conc: false, ritual: false,
    desc: "A nonmagical weapon becomes a +1 magic weapon for 1 hour, no Concentration required. Upcast: +2 with a level 3-5 slot, +3 with level 6+." },
  { name: "Melf's Acid Arrow", level: 2, school: "Evocation",
    classes: ["Wizard"],
    cast: "Action", range: "90 feet", conc: false, ritual: false,
    desc: "Ranged spell attack for 4d4 Acid damage plus 2d4 more at the end of the target's next turn; a miss still splashes half the initial damage. Upcast: both amounts gain +1d4 per slot level above 2." },
  { name: "Mind Spike", level: 2, school: "Divination",
    classes: ["Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "120 feet", conc: true, ritual: false,
    desc: "WIS save: 3d8 Psychic damage, half on a success; on a failure you also track the target's exact location for up to 1 hour, negating hiding and Invisibility against you. Upcast: +1d8 per slot level above 2." },
  { name: "Mirror Image", level: 2, school: "Illusion",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "Self", conc: false, ritual: false,
    desc: "Three illusory duplicates shadow you for 1 minute; when an attack roll hits you, a d6 per remaining duplicate (3+ on any die) redirects the hit to destroy a duplicate instead. Blinded attackers or those with Blindsight/Truesight ignore it." },
  { name: "Misty Step", level: 2, school: "Conjuration",
    classes: ["Sorcerer","Warlock","Wizard"],
    cast: "Bonus Action", range: "Self", conc: false, ritual: false,
    desc: "As a Bonus Action, teleport up to 30 feet to an unoccupied space you can see." },
  { name: "Moonbeam", level: 2, school: "Evocation",
    classes: ["Druid"],
    cast: "Action", range: "120 feet", conc: true, ritual: false,
    desc: "A 5-foot-radius, 40-foot-high Cylinder of light deals 2d10 Radiant damage (CON save for half, once per turn) to creatures in it or entering it, reverts shape-shifters, and can be moved 60 feet with a Magic action. Upcast: +1d10 per slot level above 2." },
  { name: "Nystul's Magic Aura", level: 2, school: "Illusion",
    classes: ["Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "For 24 hours, disguise a willing creature's creature type against magical detection or falsify an object's magical aura; 30 consecutive daily castings make it permanent until dispelled." },
  { name: "Pass without Trace", level: 2, school: "Abjuration",
    classes: ["Druid","Ranger"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "A 30-foot Emanation grants you and chosen creatures inside it +10 to Stealth checks and tracklessness for up to 1 hour." },
  { name: "Phantasmal Force", level: 2, school: "Illusion",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "INT save or the target perceives a 10-foot-Cube illusion as real for up to 1 minute, rationalizing contradictions and taking 2d8 Psychic damage a turn if the phantasm would harm it; an Investigation check against your DC ends it." },
  { name: "Prayer of Healing", level: 2, school: "Abjuration",
    classes: ["Cleric","Paladin"],
    cast: "10 Minutes", range: "30 feet", conc: false, ritual: false,
    desc: "After a 10-minute casting, up to five creatures regain 2d8 Hit Points and gain the benefits of a Short Rest; each cannot benefit again until it finishes a Long Rest. Upcast: +1d8 per slot level above 2." },
  { name: "Protection from Poison", level: 2, school: "Abjuration",
    classes: ["Cleric","Druid","Paladin","Ranger"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "Ends the Poisoned condition on a touched creature and grants it Advantage on saves against being Poisoned plus Resistance to Poison damage for 1 hour." },
  { name: "Ray of Enfeeblement", level: 2, school: "Necromancy",
    classes: ["Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "CON save; on a failure the target has Disadvantage on Strength-based D20 Tests and subtracts 1d8 from its damage rolls for up to 1 minute (save repeats each turn), and even on a success it has Disadvantage on its next attack roll." },
  { name: "Rope Trick", level: 2, school: "Transmutation",
    classes: ["Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "A touched rope rises to an invisible portal into an extradimensional refuge holding up to eight Medium creatures for 1 hour; effects cannot cross the portal, and occupants drop out when it ends." },
  { name: "Scorching Ray", level: 2, school: "Evocation",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "120 feet", conc: false, ritual: false,
    desc: "Three ranged spell attacks, each dealing 2d6 Fire damage, split among any targets. Upcast: +1 ray per slot level above 2." },
  { name: "See Invisibility", level: 2, school: "Divination",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: false, ritual: false,
    desc: "For 1 hour, you see Invisible creatures and objects as if visible and can see into the Ethereal Plane." },
  { name: "Shatter", level: 2, school: "Evocation",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "A 10-foot-radius Sphere of thunder deals 3d8 Thunder damage, CON save for half; Constructs save with Disadvantage and unattended objects take the damage. Upcast: +1d8 per slot level above 2." },
  { name: "Shining Smite", level: 2, school: "Transmutation",
    classes: ["Paladin"],
    cast: "Bonus Action", range: "Self", conc: true, ritual: false,
    desc: "Cast as a Bonus Action after hitting with a melee weapon or Unarmed Strike: +2d6 Radiant damage, and for up to 1 minute the target sheds light, grants Advantage to attacks against it, and cannot benefit from Invisibility. Upcast: +1d6 per slot level above 2." },
  { name: "Silence", level: 2, school: "Illusion",
    classes: ["Bard","Cleric","Ranger"],
    cast: "Action", range: "120 feet", conc: true, ritual: true,
    desc: "A 20-foot-radius Sphere blocks all sound for up to 10 minutes: creatures fully inside are Deafened, gain Immunity to Thunder damage, and cannot cast spells with Verbal components." },
  { name: "Spider Climb", level: 2, school: "Transmutation",
    classes: ["Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "Touch", conc: true, ritual: false,
    desc: "A willing creature can walk on walls and ceilings hands-free and gains a Climb Speed equal to its Speed for up to 1 hour. Upcast: +1 target per slot level above 2." },
  { name: "Spike Growth", level: 2, school: "Transmutation",
    classes: ["Druid","Ranger"],
    cast: "Action", range: "150 feet", conc: true, ritual: false,
    desc: "A camouflaged 20-foot-radius Sphere of ground becomes Difficult Terrain for up to 10 minutes, dealing 2d4 Piercing damage per 5 feet a creature moves through it; spotting it unseen requires a Search action against your spell save DC." },
  { name: "Spiritual Weapon", level: 2, school: "Evocation",
    classes: ["Cleric"],
    cast: "Bonus Action", range: "60 feet", conc: true, ritual: false,
    desc: "Conjures a spectral weapon (now requiring Concentration, up to 1 minute) that makes an immediate melee spell attack for 1d8 + spellcasting modifier Force damage and repeats it as a Bonus Action, moving 20 feet each time. Upcast: +1d8 per slot level above 2." },
  { name: "Suggestion", level: 2, school: "Enchantment",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "30 feet", conc: true, ritual: false,
    desc: "One creature that can hear and understand you makes a WIS save or is Charmed and pursues a reasonable 25-word course of action for up to 8 hours; damage from you or your allies ends the spell." },
  { name: "Summon Beast", level: 2, school: "Conjuration",
    classes: ["Druid","Ranger"],
    cast: "Action", range: "90 feet", conc: true, ritual: false,
    desc: "Summons a Bestial Spirit (Air, Land, or Water form) that acts right after you on your Initiative and obeys your verbal commands for up to 1 hour. Upcast: the stat block scales with the slot level used." },
  { name: "Warding Bond", level: 2, school: "Abjuration",
    classes: ["Cleric","Paladin"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "For 1 hour a willing target within 60 feet of you gains +1 AC, +1 to saves, and Resistance to all damage, while you take damage equal to whatever it suffers; ends if you drop to 0 HP or you separate beyond 60 feet." },
  { name: "Web", level: 2, school: "Conjuration",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "Fills a 20-foot Cube with Difficult Terrain webbing for up to 1 hour; creatures entering or starting there make a DEX save or are Restrained until they win a STR (Athletics) check, and fire burns 5-foot sections away (2d4 Fire damage to creatures caught)." },
  { name: "Zone of Truth", level: 2, school: "Enchantment",
    classes: ["Bard","Cleric","Paladin"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "For 10 minutes, creatures entering a 15-foot-radius Sphere make a CHA save or cannot speak a deliberate lie while inside; you know who failed, though the affected can still be evasive." },

  // ===== Level 3 (52 spells) =====
  { name: "Animate Dead", level: 3, school: "Necromancy",
    classes: ["Cleric","Wizard"],
    cast: "1 Minute", range: "10 feet", conc: false, ritual: false,
    desc: "Raises a Skeleton from bones or a Zombie from a corpse; a Bonus Action commands your creations within 60 feet, and control lasts 24 hours unless renewed by recasting. Upcast: animate or reassert control over two additional Undead per slot level above 3." },
  { name: "Aura of Vitality", level: 3, school: "Abjuration",
    classes: ["Cleric","Druid","Paladin"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "A 30-foot Emanation lasts up to 1 minute; on casting and at the start of each of your turns, heal one creature in it for 2d6 Hit Points." },
  { name: "Beacon of Hope", level: 3, school: "Abjuration",
    classes: ["Cleric"],
    cast: "Action", range: "30 feet", conc: true, ritual: false,
    desc: "Any number of creatures gain Advantage on WIS saves and Death Saves and receive maximum results from all healing for up to 1 minute." },
  { name: "Bestow Curse", level: 3, school: "Necromancy",
    classes: ["Bard","Cleric","Wizard"],
    cast: "Action", range: "Touch", conc: true, ritual: false,
    desc: "Touched creature makes a WIS save or suffers a chosen curse for up to 1 minute: Disadvantage with one ability, Disadvantage attacking you, a chance to waste turns Dodging, or +1d8 Necrotic damage from your attacks and spells. Upcast: higher slots extend duration, with level 5+ removing Concentration." },
  { name: "Blinding Smite", level: 3, school: "Evocation",
    classes: ["Paladin"],
    cast: "Bonus Action", range: "Self", conc: false, ritual: false,
    desc: "Cast as a Bonus Action after hitting with a melee weapon or Unarmed Strike: +3d8 Radiant damage and the target is Blinded for 1 minute, with a CON save at the end of each of its turns to recover. Upcast: +1d8 per slot level above 3." },
  { name: "Blink", level: 3, school: "Transmutation",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: false, ritual: false,
    desc: "For 1 minute, roll a d6 at the end of each of your turns; on 4-6 you shift to the Ethereal Plane, untouchable from the Material Plane, and return at the start of your next turn to a space within 10 feet of where you left." },
  { name: "Call Lightning", level: 3, school: "Conjuration",
    classes: ["Druid"],
    cast: "Action", range: "120 feet", conc: true, ritual: false,
    desc: "A storm cloud drops a bolt at a chosen point for 3d10 Lightning damage (DEX save for half, 5-foot radius), repeatable each turn as a Magic action for up to 10 minutes; an existing storm adds +1d10. Upcast: +1d10 per slot level above 3." },
  { name: "Clairvoyance", level: 3, school: "Divination",
    classes: ["Bard","Cleric","Sorcerer","Wizard"],
    cast: "10 Minutes", range: "1 mile", conc: true, ritual: false,
    desc: "Creates an invisible, invulnerable sensor at a familiar or obvious location within 1 mile for up to 10 minutes; you see or hear through it and can switch senses as a Bonus Action." },
  { name: "Conjure Animals", level: 3, school: "Conjuration",
    classes: ["Druid","Ranger"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "A pack of spectral animals moves with you (30 feet on your turn) for up to 10 minutes, dealing 3d10 Slashing damage (DEX save negates, once per turn) to creatures near it, and grants you Advantage on STR saves while adjacent. Upcast: +1d10 per slot level above 3." },
  { name: "Conjure Barrage", level: 3, school: "Conjuration",
    classes: ["Ranger"],
    cast: "Action", range: "Self", conc: false, ritual: false,
    desc: "Duplicates of your wielded weapon sweep a 60-foot Cone; chosen creatures in it take 5d8 Force damage, DEX save for half. Upcast: +1d8 per slot level above 3." },
  { name: "Counterspell", level: 3, school: "Abjuration",
    classes: ["Sorcerer","Warlock","Wizard"],
    cast: "Reaction", range: "60 feet", conc: false, ritual: false,
    desc: "Reaction when a creature within 60 feet casts with Verbal, Somatic, or Material components: the caster makes a CON save or its spell fails and the action is wasted, though any spell slot is not expended." },
  { name: "Create Food and Water", level: 3, school: "Conjuration",
    classes: ["Cleric","Paladin"],
    cast: "Action", range: "30 feet", conc: false, ritual: false,
    desc: "Conjures 45 pounds of bland but nourishing food (spoils in 24 hours) and 30 gallons of clean water." },
  { name: "Crusader's Mantle", level: 3, school: "Evocation",
    classes: ["Paladin"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "A 30-foot Emanation for up to 1 minute gives you and allies inside +1d4 Radiant damage on weapon and Unarmed Strike hits." },
  { name: "Daylight", level: 3, school: "Evocation",

    desc: "Animates up to three corpses as ghouls that obey your commands for 24 hours; recast the spell to keep control. Higher-level slots animate more ghouls or tougher undead (ghasts, wights, mummies)." },
  { name: "Disintegrate", level: 6, school: "Transmutation",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "Target makes a DEX save or takes 10d6 + 40 Force damage; a creature reduced to 0 HP turns to dust. Also disintegrates Large or smaller nonmagical objects and force constructs; +3d6 damage per slot level above 6." },
  { name: "Drawmij's Instant Summons", level: 6, school: "Conjuration",
    classes: ["Wizard"],
    cast: "1 Minute", range: "Touch", conc: false, ritual: true,
    desc: "Binds a touched object of up to 10 pounds to a 1,000+ GP sapphire; crushing the gem later teleports the item instantly to your hand, or reveals who holds it. Lasts until dispelled." },
  { name: "Eyebite", level: 6, school: "Necromancy",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "Your gaze forces one creature within 60 feet to make a WIS save or suffer a chosen effect: fall Unconscious (asleep), become Frightened of you, or be Poisoned. Each later turn you can take a Magic action to target a new creature." },
  { name: "Find the Path", level: 6, school: "Divination",
    classes: ["Bard","Cleric","Druid"],
    cast: "1 Minute", range: "Self", conc: true, ritual: false,
    desc: "Reveals the shortest physical route to a specific fixed destination you are familiar with on the same plane; you always know direction and turnings. Lasts up to 1 day while you concentrate." },
  { name: "Flesh to Stone", level: 6, school: "Transmutation",
    classes: ["Druid","Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "Target makes a CON save or is Restrained as it calcifies, repeating the save at the end of its turns; three failures leave it Petrified. Maintaining concentration for the full minute makes the petrification last until removed." },
  { name: "Forbiddance", level: 6, school: "Abjuration",
    classes: ["Cleric"],
    cast: "10 Minutes", range: "Touch", conc: false, ritual: true,
    desc: "Wards up to 40,000 square feet against teleportation and planar travel for 1 day; chosen creature types (Celestials, Elementals, Fey, Fiends, or Undead) take 5d10 Radiant or Necrotic damage when they enter. Casting it in the same spot daily for 30 days makes it permanent." },
  { name: "Globe of Invulnerability", level: 6, school: "Abjuration",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "Surrounds you with an immobile 10-foot-radius barrier; spells of level 5 or lower cast from outside cannot affect anything inside. Each slot level above 6 raises the level of spells blocked by 1." },
  { name: "Guards and Wards", level: 6, school: "Abjuration",
    classes: ["Bard","Wizard"],
    cast: "1 Hour", range: "Touch", conc: false, ritual: false,
    desc: "Protects up to 2,500 square feet of structure for 24 hours with layered defenses: fogged corridors, arcane-locked doors, webbed stairs, and one added effect such as Dancing Lights, Magic Mouth, Stinking Cloud, gusts of wind, or a Suggestion." },
  { name: "Harm", level: 6, school: "Necromancy",
    classes: ["Cleric"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "One creature makes a CON save; on a failure it takes 14d6 Necrotic damage and its hit point maximum is reduced by the damage dealt (minimum 1), on a success it takes half damage only." },
  { name: "Heal", level: 6, school: "Abjuration",
    classes: ["Cleric","Druid"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "One creature regains 70 hit points and is cured of the Blinded, Deafened, and Poisoned conditions. Healing increases by 10 per slot level above 6." },
  { name: "Heroes' Feast", level: 6, school: "Conjuration",
    classes: ["Bard","Cleric","Druid"],
    cast: "10 Minutes", range: "Self", conc: false, ritual: false,
    desc: "Conjures a grand meal (consuming a 1,000+ GP bowl); up to twelve diners who finish it are cured of disease and poison and, for 24 hours, gain immunity to the Poisoned and Frightened conditions, Advantage on WIS saves, and +2d10 maximum hit points." },
  { name: "Magic Jar", level: 6, school: "Necromancy",
    classes: ["Wizard"],
    cast: "1 Minute", range: "Self", conc: false, ritual: false,
    desc: "Projects your soul into a container, from which you can attempt to possess a Humanoid within 100 feet (CHA save resists); you use its body while your soul rides along. Lasts until dispelled or you return." },
  { name: "Mass Suggestion", level: 6, school: "Enchantment",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "Up to twelve creatures make WIS saves or follow a reasonable-sounding course of action you describe for 24 hours. Higher-level slots extend the duration greatly (10 days at 7th, 30 days at 8th, 366 days at 9th)." },
  { name: "Move Earth", level: 6, school: "Transmutation",
    classes: ["Druid","Sorcerer","Wizard"],
    cast: "Action", range: "120 feet", conc: true, ritual: false,
    desc: "Reshapes dirt, sand, or clay in a 40-foot-square area (raising, lowering, or excavating terrain), with each change taking 10 minutes; for up to 2 hours you can keep sculpting new areas." },
  { name: "Otiluke's Freezing Sphere", level: 6, school: "Evocation",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "300 feet", conc: false, ritual: false,
    desc: "Hurls a frigid globe that explodes in a 60-foot-radius sphere; creatures make a CON save, taking 10d6 Cold damage (half on success), and exposed water freezes. You can instead hold the globe to throw or set off later; +1d6 damage per slot level above 6." },
  { name: "Otto's Irresistible Dance", level: 6, school: "Enchantment",
    classes: ["Bard","Wizard"],
    cast: "Action", range: "30 feet", conc: true, ritual: false,
    desc: "The target must dance comically, using all its movement in place; it has Disadvantage on attack rolls and DEX saves while attackers have Advantage against it. A WIS save (initially, and repeated as an action) ends the effect." },
  { name: "Planar Ally", level: 6, school: "Conjuration",
    classes: ["Cleric"],
    cast: "10 Minutes", range: "60 feet", conc: false, ritual: false,
    desc: "Petitions an otherworldly power to send a Celestial, Elemental, or Fiend to aid you; the being is not compelled and expects payment negotiated for the length and danger of the requested service." },
  { name: "Programmed Illusion", level: 6, school: "Illusion",
    classes: ["Bard","Wizard"],
    cast: "Action", range: "120 feet", conc: false, ritual: false,
    desc: "Prepares an illusion of sight and sound within a 30-foot cube that activates when a trigger condition you set occurs, performs for up to 5 minutes, then resets after 10 minutes. Physical interaction or a successful INT (Investigation) check reveals it." },
  { name: "Summon Fiend", level: 6, school: "Conjuration",
    classes: ["Warlock","Wizard"],
    cast: "Action", range: "90 feet", conc: true, ritual: false,
    desc: "Summons a fiendish spirit (Demon, Devil, or Yugoloth form) that fights as an ally using a spell-level-scaled stat block, acting right after you each round for up to 1 hour. Higher-level slots strengthen its attacks and hit points." },
  { name: "Sunbeam", level: 6, school: "Evocation",
    classes: ["Cleric","Druid","Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "Fires a 60-foot line of radiance; each creature in it makes a CON save, taking 6d8 Radiant damage and being Blinded until your next turn starts (half damage, no blindness on success). For the duration you can take a Magic action to fire a new beam." },
  { name: "Tasha's Bubbling Cauldron", level: 6, school: "Conjuration",
    classes: ["Warlock","Wizard"],
    cast: "Action", range: "5 feet", conc: false, ritual: false,
    desc: "Conjures a cauldron brewing a chosen Common or Uncommon potion; you or allies can withdraw doses as a Bonus Action, up to a number equal to your spellcasting ability modifier (minimum 1). Unconsumed potions vanish when you cast the spell again." },
  { name: "Transport via Plants", level: 6, school: "Conjuration",
    classes: ["Druid"],
    cast: "Action", range: "10 feet", conc: false, ritual: false,
    desc: "Turns a Large or larger plant into a one-way magical doorway to another plant you have seen or touched on the same plane; for 1 minute, creatures stepping into one plant exit from the other." },
  { name: "True Seeing", level: 6, school: "Divination",
    classes: ["Bard","Cleric","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "Grants a willing creature Truesight out to 120 feet for 1 hour: it sees in darkness, perceives invisible creatures, pierces illusions, and sees into the Ethereal Plane." },
  { name: "Wall of Ice", level: 6, school: "Evocation",
    classes: ["Wizard"],
    cast: "Action", range: "120 feet", conc: true, ritual: false,
    desc: "Creates a wall or dome of ice; creatures where it appears make a DEX save, taking 10d6 Cold damage (half on success). Broken sections leave frigid air that deals 5d6 Cold damage (CON save for half) to creatures passing through; +2d6 and +1d6 respectively per slot level above 6." },
  { name: "Wall of Thorns", level: 6, school: "Conjuration",
    classes: ["Druid"],
    cast: "Action", range: "120 feet", conc: true, ritual: false,
    desc: "Raises a wall of tangled brush; creatures where it appears make a DEX save, taking 7d8 Piercing damage (half on success). Moving through the wall is slow and forces a DEX save for 7d8 Slashing damage; each type increases by 1d8 per slot level above 6." },
  { name: "Wind Walk", level: 6, school: "Transmutation",
    classes: ["Druid"],
    cast: "1 Minute", range: "30 feet", conc: false, ritual: false,
    desc: "You and up to ten willing creatures assume misty cloud forms for 8 hours, gaining a 300-foot Fly Speed and Resistance to nonmagical weapon damage; reverting to solid form takes 1 minute." },
  { name: "Word of Recall", level: 6, school: "Conjuration",
    classes: ["Cleric"],
    cast: "Action", range: "5 feet", conc: false, ritual: false,
    desc: "Instantly teleports you and up to five willing creatures within 5 feet to a sanctuary you previously designated by casting this spell in a location dedicated to your deity." },

  // ===== LEVEL 7 =====
  { name: "Conjure Celestial", level: 7, school: "Conjuration",
    classes: ["Cleric"],
    cast: "Action", range: "90 feet", conc: true, ritual: false,
    desc: "Manifests a celestial pillar of light in a 10-foot-radius, 40-foot-high cylinder that you can move 30 feet when you move; creatures it touches are bathed in your choice of Healing Light (regain 4d12 + spellcasting modifier HP) or Searing Light (DEX save, 6d12 Radiant damage, half on success), once per turn each. Both effects increase by 1d12 per slot level above 7." },
  { name: "Delayed Blast Fireball", level: 7, school: "Evocation",
    classes: ["Sorcerer","Wizard"],
    cast: "Action", range: "150 feet", conc: true, ritual: false,
    desc: "Plants a glowing bead that detonates in a 20-foot-radius sphere when the spell ends; creatures make a DEX save, taking 12d6 Fire damage (half on success), and the damage grows by 1d6 for each of your turns spent concentrating. Base damage rises 1d6 per slot level above 7." },
  { name: "Divine Word", level: 7, school: "Evocation",
    classes: ["Cleric"],
    cast: "Bonus Action", range: "30 feet", conc: false, ritual: false,
    desc: "Chosen creatures make CHA saves; failures suffer escalating effects by current hit points: Deafened at 50 HP or fewer, plus Blinded at 40, plus Stunned at 30, and instant death at 20 or fewer. Celestials, Elementals, Fey, and Fiends that fail are also banished to their home planes." },
  { name: "Etherealness", level: 7, school: "Conjuration",
    classes: ["Bard","Cleric","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "Self", conc: false, ritual: false,
    desc: "You step into the Border Ethereal for up to 8 hours, moving freely (including vertically) while perceiving but being unable to affect the overlapping plane. Higher-level slots let you bring additional willing creatures along." },
  { name: "Finger of Death", level: 7, school: "Necromancy",
    classes: ["Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "One creature makes a CON save, taking 7d8 + 30 Necrotic damage (half on success). A Humanoid killed by the spell rises at the start of your next turn as a zombie permanently under your command." },
  { name: "Fire Storm", level: 7, school: "Evocation",
    classes: ["Cleric","Druid","Sorcerer"],
    cast: "Action", range: "150 feet", conc: false, ritual: false,
    desc: "Fills ten connected 10-foot cubes with roaring flame; each creature in the area makes a DEX save, taking 7d10 Fire damage (half on success). You can choose to spare plant life in the area from harm." },
  { name: "Forcecage", level: 7, school: "Evocation",
    classes: ["Bard","Warlock","Wizard"],
    cast: "Action", range: "100 feet", conc: true, ritual: false,
    desc: "Creates an invisible prison of force (a 20-foot barred cage or a solid 10-foot box) that traps creatures inside for up to 1 hour; the cage cannot be dispelled and blocks nonmagical passage. A creature attempting to leave by teleportation must succeed on a CHA save or the attempt fails. Consumes 1,500+ GP of ruby dust." },
  { name: "Mirage Arcane", level: 7, school: "Illusion",
    classes: ["Bard","Druid","Wizard"],
    cast: "10 Minutes", range: "Sight", conc: false, ritual: false,
    desc: "Makes up to 1 square mile of terrain look, sound, smell, and even feel like different terrain for 10 days; structures and vegetation can be added or concealed, and the illusion has tangible properties (illusory bridges can be crossed)." },
  { name: "Mordenkainen's Magnificent Mansion", level: 7, school: "Conjuration",
    classes: ["Bard","Wizard"],
    cast: "1 Minute", range: "300 feet", conc: false, ritual: false,
    desc: "Conjures a shimmering door into an extradimensional mansion lasting 24 hours, stocked with lavish food for a hundred people and staffed by nearly invisible servants; only creatures you designate may enter." },
  { name: "Mordenkainen's Sword", level: 7, school: "Evocation",
    classes: ["Bard","Wizard"],
    cast: "Action", range: "90 feet", conc: true, ritual: false,
    desc: "Creates a hovering spectral blade; when it appears you make a melee spell attack against a creature within 5 feet of it for 4d12 + spellcasting modifier Force damage. As a Bonus Action on later turns you can move the sword up to 30 feet and attack again." },
  { name: "Plane Shift", level: 7, school: "Conjuration",
    classes: ["Cleric","Druid","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "Transports you and up to eight willing linked creatures to another plane of existence, arriving at or near a chosen destination (a tuned 250+ GP fork is required). Alternatively, force one unwilling creature you touch to save or be shunted to a random spot on a plane you choose." },
  { name: "Power Word Fortify", level: 7, school: "Enchantment",
    classes: ["Bard","Cleric"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "Speaks a word of vitality that grants 120 Temporary Hit Points, divided however you like among up to six creatures within range. No save, no attack roll: the protection simply takes hold." },
  { name: "Prismatic Spray", level: 7, school: "Evocation",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "Self", conc: false, ritual: false,
    desc: "Eight multicolored rays burst from your hand in a 60-foot cone; each creature is struck by a random ray and makes a DEX save against 12d6 damage of that ray's type (Fire, Acid, Lightning, Poison, or Cold) or against special effects: Restrained-then-Petrified, Blinded and banished, or two rays at once." },
  { name: "Project Image", level: 7, school: "Illusion",
    classes: ["Bard","Wizard"],
    cast: "Action", range: "500 miles", conc: true, ritual: false,
    desc: "Creates an illusory double of yourself anywhere you have seen within 500 miles; for up to a day you see and hear through it, move it, and make it speak and gesture. Physical interaction or an INT (Investigation) check reveals the fake." },
  { name: "Regenerate", level: 7, school: "Transmutation",
    classes: ["Bard","Cleric","Druid"],
    cast: "1 Minute", range: "Touch", conc: false, ritual: false,
    desc: "The touched creature regains 4d8 + 15 hit points immediately and 1 hit point at the start of each of its turns for 1 hour; severed body parts regrow or can be reattached during the duration." },
  { name: "Resurrection", level: 7, school: "Necromancy",
    classes: ["Bard","Cleric"],
    cast: "1 Hour", range: "Touch", conc: false, ritual: false,
    desc: "Returns a creature dead for up to 100 years (not of old age) to life with full hit points, neutralizing poisons and curing nonmagical diseases; the revived creature suffers a temporary penalty on d20 rolls that fades with rests. Consumes a 1,000 GP diamond." },
  { name: "Reverse Gravity", level: 7, school: "Transmutation",
    classes: ["Druid","Sorcerer","Wizard"],
    cast: "Action", range: "100 feet", conc: true, ritual: false,
    desc: "Inverts gravity in a 50-foot-radius, 100-foot-high cylinder for up to 1 minute; unanchored creatures and objects fall upward 100 feet (a DEX save allows grabbing a fixed object) and plummet back down when the spell ends." },
  { name: "Sequester", level: 7, school: "Transmutation",
    classes: ["Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "Hides a willing creature or object: the target becomes Invisible and undetectable by divination, and a creature enters suspended animation until a dismissal condition you set occurs. Consumes 5,000+ GP of gem dust; lasts until dispelled." },
  { name: "Simulacrum", level: 7, school: "Illusion",
    classes: ["Wizard"],
    cast: "12 Hours", range: "Touch", conc: false, ritual: false,
    desc: "Sculpts an obedient snow-and-ice duplicate of a Beast or Humanoid with half the original's hit point maximum; it uses the target's statistics but cannot learn, grow, or regain spell slots. Costs 1,500+ GP in components; only one simulacrum at a time." },
  { name: "Symbol", level: 7, school: "Abjuration",
    classes: ["Bard","Cleric","Druid","Wizard"],
    cast: "1 Minute", range: "Touch", conc: false, ritual: false,
    desc: "Inscribes a hidden glyph (1,000+ GP components consumed) that triggers on conditions you set, afflicting creatures in a 60-foot-radius sphere with a chosen effect such as Death (CON save, 10d10 Necrotic, half on success), Discord, Fear, Pain, Sleep, or Stunning." },
  { name: "Teleport", level: 7, school: "Conjuration",
    classes: ["Bard","Sorcerer","Wizard"],
    cast: "Action", range: "10 feet", conc: false, ritual: false,
    desc: "Instantly transports you and up to eight willing creatures (or a single object) to any destination on the same plane; accuracy depends on your familiarity with the target, rolled on a mishap table that can scatter or misplace arrivals." },

  // ===== LEVEL 8 =====
  { name: "Animal Shapes", level: 8, school: "Transmutation",
    classes: ["Druid"],
    cast: "Action", range: "30 feet", conc: false, ritual: false,
    desc: "Transforms any number of willing creatures into Large or smaller Beasts of Challenge Rating 4 or lower for up to 24 hours; targets gain the form's game statistics plus Temporary Hit Points, and you can reshape them into new forms as a Magic action." },
  { name: "Antimagic Field", level: 8, school: "Abjuration",
    classes: ["Cleric","Wizard"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "Surrounds you with a 10-foot Emanation where magic is suppressed for up to 1 hour: spells fail, magic items act mundane, summoned creatures wink out, and spell effects cannot enter or function inside." },
  { name: "Antipathy/Sympathy", level: 8, school: "Enchantment",
    classes: ["Bard","Druid","Wizard"],
    cast: "1 Hour", range: "60 feet", conc: false, ritual: false,
    desc: "Enchants a creature, object, or area for 10 days to repel or attract a chosen kind of creature: affected creatures that fail a WIS save are either Frightened and compelled to flee the target or compelled to approach and remain near it." },
  { name: "Befuddlement", level: 8, school: "Enchantment",
    classes: ["Bard","Druid","Warlock","Wizard"],
    cast: "Action", range: "150 feet", conc: false, ritual: false,
    desc: "Assaults one creature's mind: on a failed INT save it takes 10d12 Psychic damage and can no longer cast spells, use magic items, understand language, or communicate intelligibly, repeating the save every 30 days; a success means half damage only. Greater Restoration, Heal, or Wish ends the effect." },
  { name: "Clone", level: 8, school: "Necromancy",
    classes: ["Wizard"],
    cast: "1 Hour", range: "Touch", conc: false, ritual: false,
    desc: "Grows an inert duplicate body of a living creature inside a sealed vessel over 120 days; if the original dies afterward, its soul transfers to the mature clone, which awakens with the creature's full memories and abilities. Requires 1,000+ GP diamond (consumed) and a 2,000+ GP vessel." },
  { name: "Control Weather", level: 8, school: "Transmutation",
    classes: ["Cleric","Druid","Wizard"],
    cast: "10 Minutes", range: "Self", conc: true, ritual: false,
    desc: "Commands the weather within 5 miles for up to 8 hours, shifting precipitation, temperature, and wind one stage at a time (each change takes effect over 1d4 x 10 minutes); requires open sky." },
  { name: "Demiplane", level: 8, school: "Conjuration",
    classes: ["Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "Opens a shadowy door for 1 hour leading to a 30-foot-cube demiplane; you can create a new empty demiplane or reconnect to one you (or another caster whose demiplane you know) created before. Creatures inside when the door closes remain trapped there." },
  { name: "Dominate Monster", level: 8, school: "Enchantment",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "One creature of any type makes a WIS save or is Charmed and obeys your telepathic commands for up to 1 hour; you can seize precise control of it on your turn, and it repeats the save each time it takes damage. A level 9 slot extends concentration to 8 hours." },
  { name: "Earthquake", level: 8, school: "Transmutation",
    classes: ["Cleric","Druid","Sorcerer"],
    cast: "Action", range: "500 feet", conc: true, ritual: false,
    desc: "Shakes the ground in a 100-foot-radius circle for up to 1 minute: the area becomes Difficult Terrain, concentration is threatened, creatures make DEX saves or fall Prone, fissures can open and swallow creatures, and structures take heavy damage and may collapse." },
  { name: "Glibness", level: 8, school: "Enchantment",
    classes: ["Bard","Warlock"],
    cast: "Action", range: "Self", conc: false, ritual: false,
    desc: "For 1 hour, whenever you make a Charisma check you can replace the number rolled with a 15, and magic that would verify your truthfulness always reports you as truthful." },
  { name: "Holy Aura", level: 8, school: "Abjuration",
    classes: ["Cleric"],
    cast: "Action", range: "Self", conc: true, ritual: false,
    desc: "Radiates divine light in a 30-foot Emanation for up to 1 minute: chosen creatures gain Advantage on saving throws while attacks against them have Disadvantage, and a Fiend or Undead that hits one with a melee attack must succeed on a CON save or be Blinded." },
  { name: "Incendiary Cloud", level: 8, school: "Conjuration",
    classes: ["Druid","Sorcerer","Wizard"],
    cast: "Action", range: "150 feet", conc: true, ritual: false,
    desc: "Conjures a 20-foot-radius cloud of burning smoke that heavily obscures its area; creatures inside make a DEX save, taking 10d8 Fire damage (half on success) when it appears and when they end their turn in it. The cloud drifts 10 feet away from you each round." },
  { name: "Maze", level: 8, school: "Conjuration",
    classes: ["Wizard"],
    cast: "Action", range: "60 feet", conc: true, ritual: false,
    desc: "Banishes one creature into a labyrinthine demiplane for up to 10 minutes; it can take a Study action to attempt a DC 20 Intelligence (Investigation) check, escaping on a success. No initial save: the target simply vanishes." },
  { name: "Mind Blank", level: 8, school: "Abjuration",
    classes: ["Bard","Wizard"],
    cast: "Action", range: "Touch", conc: false, ritual: false,
    desc: "For 24 hours one willing creature is immune to Psychic damage, mind-reading, and the Charmed condition, and is shielded from all divination magic; even Wish cannot pry into its mind or locate it." },
  { name: "Power Word Stun", level: 8, school: "Enchantment",
    classes: ["Bard","Sorcerer","Warlock","Wizard"],
    cast: "Action", range: "60 feet", conc: false, ritual: false,
    desc: "A single word overwhelms one creature: if it has 150 hit points or fewer it is Stunned (CON save at the end of each of its turns to recover); otherwise its Speed drops to 0 until the start of your next turn. No initial save." },
  { name: "Sunburst", level: 8, school: "Evocation",
    classes: ["Cleric","Druid","Sorcerer","Wizard"],
    cast: "Action", range: "150 feet", conc: false, ritual: false,
    desc: "Detonates brilliant sunlight in a 60-foot radius; each creature makes a CON save, taking 12d6 Radiant damage and being Blinded for 1 minute on a failure (half damage only on a success). Blinded creatures repeat the save at the end of their turns." },
  { name: "Telepathy", level: 8, school: "Divination",
    classes: ["Wizard"],
    cast: "Action", range: "Unlimited", conc: false, ritual: false,
    desc: "Forges a 24-hour telepathic link with one willing creature you are familiar with, anywhere on the same plane; you can share words, images, sounds, and sensations regardless of language." },
  { name: "Tsunami", level: 8, school: "Conjuration",
    classes: ["Druid"],
    cast: "1 Minute", range: "1 mile", conc: true, ritual: false,
    desc: "Summons a wall of water up to 300 feet long and 50 feet high; creatures in it make a STR save, taking 6d10 Bludgeoning damage (half on success). The wave sweeps 50 feet across the land each round, shrinking as it goes and carrying creatures with it." },

  // ===== LEVEL 9 =====
  { name: "Astral Projection", level: 9, school: "Necromancy",
    classes: ["Cleric","Warlock","Wizard"],
    cast: "1 Hour", range: "10 feet", conc: false, ritual: false,
    desc: "Projects you and up to eight willing companions into the Astral Plane in astral bodies tethered to your sleeping forms by silver cords; you travel until the spell is dismissed, the cord is cut, or your astral form dies. Consumes 1,100+ GP of components per traveler." },
  { name: "Foresight", level: 9, school: "Divination",
    classes: ["Bard","Druid","Warlock","Wizard"],
    cast: "1 Minute", range: "Touch", conc: false, ritual: false,
